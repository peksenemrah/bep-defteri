<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEP Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --paper:#F3F7F5; --surface:#FFFFFF; --sunk:#E8EFEC; --ink:#12302B; --ink2:#4E6660; --ink3:#7C918B;
  --line:#D5E0DC; --accent:#0B6E69; --accent-soft:#D6EEEB; --on-accent:#FFFFFF;
  --l0:#D9573A; --l1:#E29B2E; --l2:#3A7FC1; --l3:#2A8F61;
  --l0s:#FBE4DD; --l1s:#FBEFD9; --l2s:#DDEAF7; --l3s:#DCF1E6;
  --shadow:0 1px 0 rgba(18,48,43,.06), 0 8px 24px -12px rgba(18,48,43,.25);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Bricolage Grotesque","Atkinson Hyperlegible Next",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1B19; --surface:#15272400; --surface:#162825; --sunk:#1D3430; --ink:#E6F0ED; --ink2:#A9BDB7; --ink3:#7E958F;
    --line:#2A433E; --accent:#4CC2B8; --accent-soft:#1B3D39; --on-accent:#06201D;
    --l0s:#3A221C; --l1s:#3A2E18; --l2s:#1A2E42; --l3s:#17352A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1B19; --surface:#162825; --sunk:#1D3430; --ink:#E6F0ED; --ink2:#A9BDB7; --ink3:#7E958F;
  --line:#2A433E; --accent:#4CC2B8; --accent-soft:#1B3D39; --on-accent:#06201D;
  --l0s:#3A221C; --l1s:#3A2E18; --l2s:#1A2E42; --l3s:#17352A;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-body);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 120px}
h1,h2,h3{font-family:var(--f-disp);letter-spacing:-.01em;margin:0}
.muted{color:var(--ink2)}
.small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:500;display:inline-flex;gap:8px;align-items:center;min-height:44px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--l0)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* home */
.mast{display:grid;gap:18px;padding:28px 0 26px;border-bottom:2px solid var(--ink)}
.mast h1{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:800;line-height:.95;letter-spacing:-.03em}
.mast p{margin:0;max-width:52ch;color:var(--ink2)}
.stat-strip{display:flex;gap:26px;flex-wrap:wrap;padding:16px 0}
.stat-strip b{font-family:var(--f-disp);font-size:1.6rem;display:block;line-height:1}
.list{display:grid;gap:0;margin-top:8px}
.rec{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.rec:hover{background:var(--sunk)}
.rec h3{font-size:1.15rem;font-weight:700}
.rec .meta{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:.9rem}
.empty{padding:48px 20px;text-align:center;border:2px dashed var(--line);border-radius:var(--r-l);margin-top:24px}
.empty h2{font-size:1.5rem;margin-bottom:6px}

/* mini ladder summary */
.mini{display:flex;gap:3px;align-items:flex-end;height:22px}
.mini i{display:block;width:8px;border-radius:2px;background:var(--sunk)}
.mini i:nth-child(1){height:6px}.mini i:nth-child(2){height:11px}.mini i:nth-child(3){height:16px}.mini i:nth-child(4){height:22px}
.mini span{font-size:.8rem;color:var(--ink2);margin-left:6px;align-self:center}

/* record header & tabs */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.top h2{font-size:1.15rem;line-height:1.2}
.top .sub{font-size:.85rem;color:var(--ink2)}
.tabs{display:flex;gap:4px;max-width:1080px;margin:0 auto;padding:0 18px 10px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--ink2);white-space:nowrap;display:flex;gap:8px;align-items:center;min-height:40px}
.tab .n{font-size:.75rem;background:var(--sunk);border-radius:999px;padding:1px 7px;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] .n{background:color-mix(in srgb,var(--paper) 20%,transparent);color:var(--paper)}
@media (max-width:720px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--paper)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;margin:0;max-width:none}
  .tab{flex-direction:column;gap:2px;font-size:.78rem;padding:6px 8px;border-radius:12px;flex:1;justify-content:center}
  .tab .n{display:none}
  .tab svg{width:22px;height:22px}
  .wrap{padding-bottom:140px}
}
.tab svg{width:18px;height:18px}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px}
.f{display:grid;gap:6px}
.f label{font-weight:700;font-size:.9rem}
.f .hint{font-size:.8rem;color:var(--ink3)}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:11px 12px;min-height:46px}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{min-height:120px;resize:vertical}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.section-h h2{font-size:1.4rem}
.sign{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:100%;height:100%;border-radius:999px;background:var(--sunk);border:1px solid var(--line);cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}

/* ders picker */
.ders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ders{border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px;background:var(--surface);text-align:left;display:grid;gap:2px}
.ders b{font-family:var(--f-disp);font-size:1.1rem}
.ders[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- the ladder (signature) ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2);margin:6px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.uda{margin-top:14px;border-top:2px solid var(--ink)}
.uda-h{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0 8px;width:100%;background:none;border:0;text-align:left}
.uda-h h3{font-size:1.2rem;font-weight:700}
.uda-h .chev{transition:transform .2s;flex:none}
.uda[data-open="false"] .chev{transform:rotate(-90deg)}
.uda[data-open="false"] .kdas{display:none}
.kda{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.kda .code{font-size:.8rem;font-weight:700;color:var(--ink3);letter-spacing:.02em}
.kda .t{font-weight:500}
.kda .oa-toggle{background:none;border:0;padding:4px 0;color:var(--accent);font-size:.85rem;font-weight:500}
.kda .oa{grid-column:1/-1;margin:0;padding:10px 14px;background:var(--sunk);border-radius:var(--r-s);font-size:.9rem;color:var(--ink2);list-style:none;display:grid;gap:4px}
.kda .foot{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:0}
.ladder{display:flex;align-items:flex-end;gap:5px;height:52px}
.ladder button{width:34px;border:0;border-radius:6px;background:var(--sunk);padding:0;position:relative;transition:background .15s,transform .1s}
.ladder button:nth-child(1){height:16px}.ladder button:nth-child(2){height:28px}.ladder button:nth-child(3){height:40px}.ladder button:nth-child(4){height:52px}
.ladder button:hover{transform:translateY(-2px)}
.ladder[data-l="0"] button:nth-child(-n+1){background:var(--l0)}
.ladder[data-l="1"] button:nth-child(-n+2){background:var(--l1)}
.ladder[data-l="2"] button:nth-child(-n+3){background:var(--l2)}
.ladder[data-l="3"] button:nth-child(-n+4){background:var(--l3)}
.lvl-name{font-size:.82rem;font-weight:700;min-width:118px;text-align:right;color:var(--ink3)}
.lvl-name[data-l="0"]{color:var(--l0)}.lvl-name[data-l="1"]{color:var(--l1)}.lvl-name[data-l="2"]{color:var(--l2)}.lvl-name[data-l="3"]{color:var(--l3)}
.ladder-wrap{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px 5px 6px;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.pill .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center}
.pill.on .dot{border-color:var(--accent);background:var(--accent)}
.pill.on .dot::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tag-perf{font-size:.82rem;color:var(--ink2)}
@media (max-width:560px){
  .kda{grid-template-columns:1fr}
  .ladder-wrap{justify-content:space-between}
  .lvl-name{text-align:left;min-width:0}
  .ladder button{width:40px}
}

/* sticky summary bar */
.dock{position:sticky;bottom:12px;z-index:15;margin-top:24px;display:flex;justify-content:center}
.dock-in{background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);max-width:100%}
.dock-in .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
@media (max-width:720px){.dock{bottom:84px}}

/* plan timeline */
.tl{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.tl-scroll{overflow-x:auto}
.tl-grid{display:grid;grid-template-columns:minmax(210px,1.3fr) repeat(10,minmax(46px,1fr));min-width:760px}
.tl-mh{font-size:.78rem;font-weight:700;color:var(--ink3);padding:10px 4px;text-align:center;border-bottom:1px solid var(--line);background:var(--sunk)}
.tl-mh:first-child{text-align:left;padding-left:16px}
.tl-uda{grid-column:1/-1;padding:10px 16px;font-family:var(--f-disp);font-weight:700;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sunk) 50%,var(--surface))}
.tl-name{padding:10px 16px;border-bottom:1px solid var(--line);text-align:left;background:none;border-top:0;border-left:0;border-right:1px solid var(--line);display:grid;gap:2px}
.tl-name .code{font-size:.75rem;color:var(--ink3);font-weight:700}
.tl-name .t{font-size:.9rem;line-height:1.3}
.tl-name .miss{font-size:.75rem;color:var(--l0);font-weight:500}
.tl-name .ok{font-size:.75rem;color:var(--l3);font-weight:500}
.tl-cell{border-bottom:1px solid var(--line);position:relative}
.tl-cell+.tl-cell{border-left:1px dashed var(--line)}
.tl-bar{position:absolute;z-index:1;top:50%;height:26px;transform:translateY(-50%);background:var(--accent);border-radius:8px;color:var(--on-accent);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:0;padding:0 6px;overflow:hidden;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* mobile plan list */
.plist{display:none}
@media (max-width:720px){
  .tl{display:none}
  .plist{display:grid;gap:10px}
}
.pcard{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:14px;text-align:left;display:grid;gap:8px;width:100%}
.pcard .code{font-size:.75rem;color:var(--ink3);font-weight:700}
.months{display:flex;gap:3px}
.months i{flex:1;height:8px;border-radius:3px;background:var(--sunk)}
.months i.on{background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;padding:0;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;color:var(--ink2)}
.chip button:hover{background:var(--line)}
.chip.add{background:var(--surface);border-style:dashed;cursor:pointer}
.chip.add:hover{border-color:var(--accent);color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,25,22,.45);z-index:50;opacity:0;animation:fade .18s forwards}
@keyframes fade{to{opacity:1}}
.sheet{position:fixed;z-index:51;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:721px){.sheet{top:0;right:0;bottom:0;width:min(560px,100vw);animation:slideL .22s ease-out;padding-top:env(safe-area-inset-top,0px)}}
@media (max-width:720px){.sheet{left:0;right:0;bottom:0;max-height:92vh;border-radius:22px 22px 0 0;animation:slideU .24s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}}
@keyframes slideL{from{transform:translateX(40px);opacity:0}}
@keyframes slideU{from{transform:translateY(60px);opacity:0}}
.sheet-h{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.sheet-h h3{font-size:1.15rem;line-height:1.3}
.sheet-b{padding:18px 20px;overflow-y:auto;display:grid;gap:22px;flex:1}
.sheet-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.grp h4{margin:0 0 8px;font-size:.95rem}
.picker{border:1px solid var(--line);border-radius:var(--r-m);margin-top:8px;overflow:hidden}
.picker input{border:0;border-bottom:1px solid var(--line);width:100%;padding:10px 12px;background:var(--sunk)}
.picker input:focus{outline:none}
.picker:not(:focus-within) .opts{display:none}
.picker .opts{max-height:220px;overflow-y:auto;display:grid}
.picker .opts button{text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.9rem}
.picker .opts button:hover{background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--sunk);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:500;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--accent);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-size:.78rem;font-weight:700;min-height:40px}
.mgrid button.in{background:var(--accent-soft);border-color:var(--accent-soft)}
.mgrid button.edge{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:420px){.mgrid{grid-template-columns:repeat(5,1fr)}}

/* documents */
.docbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
.docstage{background:var(--sunk);border-radius:var(--r-l);padding:18px;overflow-x:auto}
.docstage .doc{width:1000px}
.docstage{overflow-x:hidden}
.editing .doc{outline:2px dashed var(--accent);outline-offset:6px}
.note{background:var(--accent-soft);border-radius:var(--r-m);padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:80;font-weight:500;box-shadow:var(--shadow);animation:slideU .2s ease-out;max-width:calc(100vw - 32px);text-align:center}

/* bank */
.bank-ders{border-top:2px solid var(--ink);padding:14px 0}
.bank-ders summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between;list-style:none}
.bank-ders summary::-webkit-details-marker{display:none}
.bank-ders h3{font-size:1.2rem}
.bank-uda{margin:12px 0 0 0;padding-left:14px;border-left:3px solid var(--line)}
.bank-uda h4{margin:0 0 6px}
.bank-uda ul{margin:0;padding-left:18px;font-size:.9rem;color:var(--ink2)}
pre.fmt{background:var(--sunk);padding:12px;border-radius:var(--r-s);font-size:.82rem;overflow-x:auto;white-space:pre-wrap}

/* öğrenci ve takip */
.prog{display:block;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--l3);border-radius:99px}
.rec .prog{width:120px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:16px;text-align:left;display:grid;gap:10px;box-shadow:var(--shadow)}
.dcard b{font-family:var(--f-disp);font-size:1.15rem}
.dcard:hover{border-color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.kodlar{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--ink2);margin:8px 0 16px}
.kodlar span{display:inline-flex;align-items:center;gap:6px}
.k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-style:normal;font-weight:700;font-size:.8rem;color:#fff}
.kp{background:var(--l3)}.ks{background:var(--l2)}.km{background:var(--l1)}.kf{background:var(--l0)}.kn{background:var(--ink3)}

   clearTimeout(saveT);clearTimeout(syncT);
   try{if(AUTH.mode==='user'&&SB){const {error}=await SB.rpc('hesabimi_sil');if(error)throw error;localStorage.removeItem(storeKey());await SB.auth.signOut();AUTH.mode='out';S=freshState();render();toast('Hesabın ve tüm verilerin silindi.')}
    else{localStorage.removeItem(storeKey());localStorage.removeItem(KEY);localStorage.removeItem(KEY+':mod');S=freshState();AUTH.mode='out';render();toast('Bu cihazdaki tüm veriler silindi.')}}catch(err){toast('Silinemedi: '+authErr(err))}break}
  /* banka */
  case'bank-del':if(S.records.some(x=>x.dersId===t.dataset.id)){toast('Bu dersi kullanan planlar var; önce onları sil.');break}if(confirm('Ders bankadan silinsin mi?')){S.bank.dersler=S.bank.dersler.filter(d=>d.id!==t.dataset.id);save();render()}break;
  case'bank-import-text':{const ta=document.querySelector('[data-bankpaste]');const list=parseBank(ta.value);if(!list.length){toast('Metinde ders, alan ve amaç bulunamadı. Biçimi kontrol et.');break}const n=mergeDers(list);render();toast(`${n} ders bankaya eklendi.`);break}
  case'bank-export':{const data=JSON.stringify(S.bank,null,1);if(DOWNLOADS){try{await DOWNLOADS.save({filename:'amac-bankasi.json',data});toast('Yedek indirildi.')}catch(err){}}else{try{await navigator.clipboard.writeText(data);toast('Banka JSON olarak panoya kopyalandı.')}catch(err){toast('Yedek alınamadı.')}}break}
 }
});
function refreshPreview(){if(UI.view==='stu'&&UI.stuTab==='dosya'&&!UI.editing){const d=document.getElementById('docroot');const s=curStu();if(d&&s&&!s.docEdits.paket)d.innerHTML=paket(s)}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.picker .opts button'))e.preventDefault()});
function keepScroll(fn){const b=document.querySelector('.sheet-b');const y=b?b.scrollTop:0;fn();const nb=document.querySelector('.sheet-b');if(nb)nb.scrollTop=y}
function rerenderKda(r,kod){const el=document.getElementById('k-'+kod);if(!el){render();return}const f=kdaBul(r,kod);el.outerHTML=kdaRow(r,f.u,f.k)}
function refreshChrome(r){
 const {c,plan}=sayim(r);const tot=c.reduce((a,b)=>a+b,0);
 const setN=(tab,n)=>{const b=document.querySelector(`.tab[data-tab="${tab}"]`);if(!b)return;let sp=b.querySelector('.n');if(!n){sp?.remove();return}if(!sp){sp=document.createElement('span');sp.className='n';b.appendChild(sp)}sp.textContent=n};
 setN('perf',tot);setN('plan',plan);
 const d=document.querySelector('.dock-in');if(d)d.innerHTML=`<span class="small">${plan} amaç planda · ${c[2]+c[3]} amaç performansta</span><button class="btn" data-act="tab" data-tab="plan" ${plan?'':'disabled'}>Planla</button>`;
 const d0=dersOf(r);d0&&d0.udalar.forEach(u=>{const el=document.querySelector(`[data-udacount="${u.id}"]`);if(el)el.textContent=`${u.kdalar.filter(k=>r.perf[k.kod]!=null).length}/${u.kdalar.length}`});
}
document.addEventListener('input',e=>{
 const t=e.target;const r=rec();const s=curStu();
 if(RO&&t.dataset.in!=='filter'&&!t.closest('#authform')){return}
 if(t.hasAttribute('data-telmask')){const d=telNorm(t.value);t.value=telFmt(d.startsWith('0')||!d?d:'0'+d)}
 if(t.dataset.in==='filter'){UI.filter=t.value;const pos=t.selectionStart;render();const n=document.querySelector('[data-in="filter"]');n.focus();n.setSelectionRange(pos,pos);return}
 if(t.dataset.stu&&s){const k=t.dataset.stu;s[k]=t.value;if(k==='okul')S.profil.okul=t.value;if(k==='ogretmen')S.profil.ogretmen=t.value;touchS(s);
  if(k==='ad'){const h=document.querySelector('.top h2');if(h)h.textContent=t.value||'Adsız öğrenci'}
  if(k==='sinif'&&UI.sinifF==null){}
  if(k==='yil')recsOf(s).forEach(x=>Object.values(x.plan).forEach(p=>{p.bas='';p.bit=''}));return}
 if(t.dataset.profil){S.profil[t.dataset.profil]=t.value;save();return}
 if(t.dataset.imza&&s){s.imza[t.dataset.imza].ad=t.value;touchS(s);return}
 if(t.hasAttribute('data-islenis')){r.plan[UI.sheet.kod].islenis=t.value;touch(r);return}
 if(t.dataset.perfnot){const rr=S.records.find(x=>x.id===t.dataset.perfnot);rr.perfNot=t.value;touch(rr);return}
 if(t.dataset.kurul&&s){s.kurul[t.dataset.kurul]=t.value;touchS(s);return}
 if(t.hasAttribute('data-veli')&&s){s.veliMektup=t.value;touchS(s);return}
 if(t.dataset.draft&&UI.draft){UI.draft[t.dataset.draft]=t.value;return}
 if(t.dataset.pick){const q=t.value.toLocaleLowerCase('tr');t.nextElementSibling.querySelectorAll('button').forEach(b=>{b.hidden=q&&!b.textContent.toLocaleLowerCase('tr').includes(q)})}
});
document.addEventListener('change',async e=>{
 const t=e.target;const s=curStu();
 if(t.dataset.rolsec){const {error}=await SB.rpc('rol_degistir',{p_user:t.dataset.rolsec,p_rol:t.value});if(error){toast(sbHata(error));okulYukle()}else{toast('Rol güncellendi.');if(t.dataset.rolsec===AUTH.user.id)await okulBilgisi()}return}
 if(RO)return;
 if(t.dataset.stu==='ad'&&s&&S.profil.basHarf&&t.value.trim()){s.ad=basHarf(t.value);t.value=s.ad;touchS(s);const h=document.querySelector('.top h2');if(h)h.textContent=s.ad}
 if(t.dataset.imzaOn&&s){s.imza[t.dataset.imzaOn].on=t.checked;touchS(s);return}
 if(t.dataset.paket&&s){s.paket[t.dataset.paket]=t.checked;touchS(s);refreshPreview();return}
 if(t.dataset.actChange==='withoa'){UI.withOA=t.checked;render();return}
 if(t.dataset.actChange==='kabadolu'){UI.kabaDolu=t.checked;render();return}
 if(t.dataset.actChange==='basharf'){S.profil.basHarf=t.checked;save();if(t.checked&&S.students.some(x=>/\s/.test(x.ad.trim())&&!/^(\S\.\s?)+$/.test(x.ad.trim()))&&confirm('Mevcut öğrencilerin adları da baş harflere çevrilsin mi?')){S.students.forEach(x=>{if(x.ad)x.ad=basHarf(x.ad);x.docEdits={}});save()}toast(t.checked?'Yeni öğrenci adları baş harflerle saklanacak.':'Öğrenci adları tam olarak saklanacak.');return}
 if(t.hasAttribute('data-bankfile')){const f=t.files[0];if(!f)return;f.text().then(txt=>{try{const j=JSON.parse(txt);const list=Array.isArray(j)?j:(j.dersler||[]);if(!list.length)throw 0;list.forEach(d=>{d.id=d.id||uid();d.udalar.forEach(u=>{u.id=u.id||uid();u.kdalar.forEach(k=>{k.oa=k.oa||[]})})});const n=mergeDers(list);render();toast(`${n} ders yüklendi.`)}catch(err){toast('Dosya okunamadı: geçerli bir amaç bankası JSON\'u değil.')}})}
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('[data-metin]'))UI.metinAcik=e.target.open},true);
document.addEventListener('submit',e=>{if(e.target.id==='authform'){e.preventDefault();authSubmit()}});
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(e.key==='Escape'&&UI.sheet){UI.sheet=null;UI.draft=null;renderSheet();render();return}
 if(e.key==='Enter'&&t.dataset?.pick){e.preventDefault();const v=t.value.trim();if(!v)return;const first=[...t.nextElementSibling.querySelectorAll('button')].find(b=>!b.hidden);const val=(first&&first.textContent.toLocaleLowerCase('tr')===v.toLocaleLowerCase('tr'))?first.dataset.v:v;
  if(t.dataset.pick==='ortam'){const s=curStu();if(!s.ortam.includes(val))s.ortam.push(val);touchS(s);render();document.querySelector('[data-pick="ortam"]')?.focus()}
  else{const r=rec();const p=r.plan[UI.sheet.kod];const k=t.dataset.pick;p[k]=p[k]||[];if(!p[k].includes(val))p[k].push(val);touch(r);keepScroll(renderSheet);document.querySelector(`[data-pick="${k}"]`)?.focus()}}
});

boot();
</script>
</body>
</html>

ağlamdan kopmadan özgün örneklere dönüştürür.","c) Millî gün ve bayramların önemine ilişkin oluşturduğu özgün örnekleri kendi cümleleri ile ifade eder."]},{"kod":"HB.2.4.5","ad":"Dinî gün ve bayramların önemini yorumlayabilme","oa":["a) Dinî gün ve bayramların önemine ilişkin verilen örnekleri inceler.","b) Dinî gün ve bayramların önemine ilişkin verilen örnekleri bağlamdan kopmadan özgün örneklere dönüştürür.","c) Dinî gün ve bayramların önemine ilişkin oluşturduğu özgün örnekleri kendi cümleleri ile ifade eder."]}],"id":"tymm-hayat-bilgisi-2-u4"},{"ad":"Doğa ve Çevre","kdalar":[{"kod":"HB.2.5.1","ad":"Hava olayları ve mevsimler arasındaki ilişkiyi çözümleyebilme","oa":["a) Hava olayları ve mevsimlerin özelliklerini belirler.","b) Hava olayları ve mevsimler arasındaki ilişkiyi belirler."]},{"kod":"HB.2.5.2","ad":"Doğadan yararlanarak yönünü belirleyebilme","oa":[]},{"kod":"HB.2.5.3","ad":"Afetlere karşı alınması gereken önlemlere ilişkin bilgi toplayabilme","oa":["a) Afetlere karşı alınması gereken önlemlere ilişkin bilgi toplamak için kullanacağı araçları belirler.","b) Belirlediği araçları kullanarak afetlere karşı alınması gereken önlemlere ilişkin bilgileri bulur.","c) Afetlere karşı alınması gereken önlemlere ilişkin bulduğu bilgileri doğrular.","ç) Afetlere karşı alınması gereken önlemlere ilişkin bulduğu bilgileri kaydeder."]},{"kod":"HB.2.5.4","ad":"Doğal kaynakları tasarruflu kullanma davranışlarını günlük yaşamına yansıtabilme","oa":["a) Doğal kaynakları kullanırken davranışlarını gözden geçirir.","b) Doğal kaynakları tasarruflu kullanmaya yönelik çıkarımlarda bulunur.","c) Doğal kaynakları tasarruflu kullanmaya yönelik ulaştığı çıkarımları değerlendirir."]}],"id":"tymm-hayat-bilgisi-2-u5"},{"ad":"Bilim, Teknoloji ve Sanat","kdalar":[{"kod":"HB.2.6.1","ad":"Bilim insanlarının bilime katkılarına yönelik kaynaklardan bilgi toplayabilme","oa":["a) Bilim insanlarının bilime katkılarına ilişkin bilgi toplayacağı kaynakları belirler.","b) Bilim insanlarının bilime katkılarına ilişkin belirlediği kaynaklardan bilgileri bulur.","c) Bilim insanlarının bilime katkılarına ilişkin ulaştığı kaynakların uygunluğunu açıklar.","ç) Bilim insanlarının bilime katkılarına ilişkin kaynaklardan ulaştığı bilgileri kaydeder."]},{"kod":"HB.2.6.2","ad":"Teknolojik bir ürünün değişim ve sürekliliğine dair kanıta dayalı öngörüde bulunabilme","oa":["a) Teknolojik bir ürünün zaman içindeki değişimini kanıtlara dayalı olarak ilişkilendirir.","b) Teknolojik bir ürünün gelecekteki değişimine ilişkin çıkarım yapar."]},{"kod":"HB.2.6.3","ad":"Sanatın günlük yaşamdaki yerini belirleyebilme","oa":[]}],"id":"tymm-hayat-bilgisi-2-u6"}],"id":"tymm-hayat-bilgisi-2"},{"ad":"Hayat Bilgisi","sinif":"3. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Ben ve Okulum","kdalar":[{"kod":"HB.3.1.1","ad":"Güçlü ve gelişime açık olduğu alanlara karar verebilme","oa":["a) Güçlü ve gelişime açık olduğu alanlara ilişkin karar vermeye yönelik amacını belirler.","b) Güçlü ve gelişime açık olduğu alanlara ilişkin karar vermeye yönelik bilgi toplar.","c) Güçlü ve gelişime açık olduğu alanlara ilişkin karar vermeye yönelik seçenekler oluşturur.","ç) Güçlü ve gelişime açık olduğu alanlara ilişkin karar vermeye yönelik seçenekler üzerinde mantıksal denetleme yapar.","d) Güçlü ve gelişime açık olduğu alanlara ilişkin karar vermeye yönelik seçenekler arasından seçim yapar.","e) Güçlü ve gelişime açık olduğu alanlara ilişkin verdiği karara yönelik yansıtma yapar."]},{"kod":"HB.3.1.2","ad":"Okuldaki hak ve sorumluluklarına uygun davranabilme","oa":[]},{"kod":"HB.3.1.3","ad":"Çocuk haklarını tanıtmak için fikirlerini eyleme dönüştürebilme","oa":["a) Çocuk haklarını tanıtmak için plan yapar.","b) Çocuk haklarını tanıtmak için yaptığı planı uygular.","c) Çocuk haklarını tanıtmak için uyguladığı planı değerlendirir."]}],"id":"tymm-hayat-bilgisi-3-u1"},{"ad":"Sağlığım ve Güvenliğim","kdalar":[{"kod":"HB.3.2.1","ad":"Sağlığını korumaya yönelik davranışlarını düzenleyebilme","oa":[]},{"kod":"HB.3.2.2","ad":"Güvenliğini tehdit eden bir durumla karşılaştığında yapılması gerekenleri sorgulayabilme","oa":["a) Güvenliğini tehdit eden durumları tanımlar.","b) Güvenliğini tehdit eden bir durumla karşılaştığında yapılması gerekenler hakkında sorular sorar.","c) Güvenliğini tehdit eden bir durumla karşılaştığında yapılması gerekenler hakkında bilgi toplar.","ç) Güvenliğini tehdit eden bir durumla karşılaştığında yapılması gerekenler hakkında topladığı bilgilerin doğruluğunu değerlendirir.","d) Güvenliğini tehdit eden bir durumla karşılaştığında yapılması gerekenler hakkında çıkarım yapar."]},{"kod":"HB.3.2.3","ad":"Trafik kurallarına uymanın önemine ilişkin özgün ürünler sentezleyebilme","oa":["a) Trafik kurallarına uymanın önemini belirler.","b) Trafik kurallarına uyma ile güvenliği arasında ilişki kurar.","c) Trafik kurallarına uymanın önemine ilişkin özgün bir ürün oluşturur."]}],"id":"tymm-hayat-bilgisi-3-u2"},{"ad":"Ailem ve Toplum","kdalar":[{"kod":"HB.3.3.1","ad":"Aile ve toplum arasındaki ilişkiyi çözümleyebilme","oa":["a) Aile ve toplumun özelliklerini belirler.","b) Aile ve toplum arasındaki ilişkiyi belirler."]},{"kod":"HB.3.3.2","ad":"Yardıma ihtiyacı olan bireylerin yaşamını kolaylaştırmak için fikirlerini eyleme dönüştürebilme","oa":["a) Yardıma ihtiyacı olan bireylerin yaşamını kolaylaştırmak için plan yapar.","b) Yardıma ihtiyacı olan bireylerin yaşamını kolaylaştırmak için yaptığı planı uygular.","c) Yardıma ihtiyacı olan bireylerin yaşamını kolaylaştırmak için yaptığı planı değerlendirir."]},{"kod":"HB.3.3.3","ad":"Mesleklerin toplumsal yaşamdaki önemini yorumlayabilme","oa":["a) Mesleklerin toplumsal yaşamdaki önemine ilişkin verilen örnekleri inceler.","b) Mesleklerin toplumsal yaşamdaki önemine ilişkin verilen örnekleri bağlamdan kopmadan özgün örneklere dönüştürür.","c) Mesleklerin toplumsal yaşamdaki önemine ilişkin oluşturduğu özgün örnekleri kendi cümleleri ile ifade eder."]}],"id":"tymm-hayat-bilgisi-3-u3"},{"ad":"Yaşadığım Yer ve Ülkem","kdalar":[{"kod":"HB.3.4.1","ad":"Yakın çevresindeki tarihî mekân ve doğal güzelliklerin korunmasının önemini fark edebilme","oa":[]},{"kod":"HB.3.4.2","ad":"Ülkemizin yönetim şekli ile ilgili kaynaklardan bilgi toplayabilme","oa":["a) Ülkemizin yönetim şekli ile ilgili bilgi toplayacağı kaynakları belirler.","b) Ülkemizin yönetim şekli ile ilgili belirlediği kaynaklardan bilgileri bulur.","c) Ülkemizin yönetim şekli ile ilgili ulaştığı kaynakların uygunluğunu açıklar.","ç) Ülkemizin yönetim şekli ile ilgili kaynaklardan ulaştığı bilgileri kaydeder."]},{"kod":"HB.3.4.3","ad":"Mustafa Kemal Atatürk’ün kişilik özelliklerini çözümleyebilme","oa":["a) Mustafa Kemal Atatürk’ün kişilik özelliklerini ve elde ettiği başarıları belirler.","b) Mustafa Kemal Atatürk’ün kişilik özellikleri ile başarıları arasında ilişki kurar."]},{"kod":"HB.3.4.4","ad":"Millî birlik ve beraberliğimizin ülkemize katkılarını açıklayabilme","oa":[]}],"id":"tymm-hayat-bilgisi-3-u4"},{"ad":"Doğa ve Çevre","kdalar":[{"kod":"HB.3.5.1","ad":"Doğadaki varlıkların insan yaşamı için önemini yorumlayabilme","oa":["a) Doğadaki varlıkların insan yaşamı için önemine ilişkin verilen örnekleri inceler.","b) Doğadaki varlıkların insan yaşamı için önemine ilişkin verilen örnekleri bağlamdan kopmadan özgün örneklere dönüştürür.","c) Doğadaki varlıkların insan yaşamı için önemine ilişkin oluşturduğu özgün örnekleri kendi cümleleri ile ifade eder."]},{"kod":"HB.3.5.2","ad":"Krokiyi kullanarak bulunduğu yerin konumunu algılayabilme","oa":["a) Krokiyi kullanarak bulunduğu yerin konumunu belirler.","b) Bulunduğu yerin konumsal görselleştirmesini yapar.","c) Bulunduğu yerin konumsal özelliklerini özetler."]},{"kod":"HB.3.5.3","ad":"Afetlere yönelik yapılması gerekenleri sınıflandırabilme","oa":["a) Afetlere yönelik yapılması gerekenlere ilişkin ölçütleri afet öncesi, afet anı ve afet sonrası olarak belirler.","b) Afetlere yönelik yapılması gerekenleri afet öncesi, afet anı ve afet sonrası olarak ayrıştırır.","c) Afetlere yönelik yapılması gerekenleri afet öncesi, afet anı ve afet sonrası olarak tasnif eder.","ç) Afetlere yönelik yapılması gerekenleri afet öncesi, afet anı ve afet sonrası olarak etiketler."]},{"kod":"HB.3.5.4","ad":"Çevresel sürdürülebilirliğe yönelik kaynaklardan bilgi toplayabilme","oa":["a) Çevresel sürdürülebilirliğe yönelik bilgi toplayacağı kaynakları belirler.","b) Çevresel sürdürülebilirliğe yönelik belirlediği kaynaklardan bilgileri bulur.","c) Çevresel sürdürülebilirliğe yönelik ulaştığı kaynakların uygunluğunu açıklar.","ç) Çevresel sürdürülebilirliğe yönelik kaynaklardan ulaştığı bilgileri kaydeder."]}],"id":"tymm-hayat-bilgisi-3-u5"},{"ad":"Bilim, Teknoloji ve Sanat","kdalar":[{"kod":"HB.3.6.1","ad":"Bilimsel gelişmelerin günlük yaşama etkisini yorumlayabilme","oa":["a) Bilimsel gelişmelerin günlük yaşama etkisine ilişkin verilen örnekleri inceler.","b) Bilimsel gelişmelerin günlük yaşama etkisine ilişkin verilen örnekleri bağlamdan kopmadan özgün örneklere dönüştürür.","c) Bilimsel gelişmelerin günlük yaşama etkisine ilişkin oluşturduğu özgün örnekleri kendi cümleleri ile ifade eder."]},{"kod":"HB.3.6.2","ad":"Teknolojik gelişmelerin günlük yaşama etkisini çözümleyebilme","oa":["a) Teknolojik gelişmelerin günlük yaşama etkisini belirler.","b) Teknolojik gelişmelerle günlük yaşam arasında ilişki kurar."]},{"kod":"HB.3.6.3","ad":"Sanatçıların sanata katkılarına yönelik kaynaklardan bilgi toplayabilme","oa":["a) Sanatçıların sanata katkılarına yönelik bilgi toplayacağı kaynakları belirler.","b) Sanatçıların sanata katkılarına yönelik belirlediği kaynaklardan bilgileri bulur.","c) Sanatçıların sanata katkılarına yönelik ulaştığı kaynakların uygunluğunu açıklar.","ç) Sanatçıların sanata katkılarına yönelik kaynaklardan ulaştığı bilgileri kaydeder."]}],"id":"tymm-hayat-bilgisi-3-u6"}],"id":"tymm-hayat-bilgisi-3"},{"ad":"Fen Bilimleri","sinif":"3. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Bilimsel Keşif Yolculuğu","kdalar":[{"kod":"FB.3.1.1","ad":"Bilimsel bilgiye ulaşma yollarını sorgulayabilme","oa":["a) Merak ettiği bilimsel bir konuyu tanımlar.","b) İlgili konu hakkında sorular sorar.","c) Sorularını cevaplamaya yönelik bilgi toplar.","ç) Bilimsel bilgiye ulaşma yollarının uygunluğunu değerlendirir.","d) Toplanan bilgiler üzerinden bilimsel bilgiye ulaşma yollarına ilişkin çıkarım yapar."]},{"kod":"FB.3.1.2","ad":"Bilim insanlarının özelliklerine ilişkin genelleme yapabilme","oa":["a) Bilim insanları hakkında bilgi toplar.","b) Bilim insanlarının ortak özelliklerini belirler.","c) Bilim insanlarının ortak olmayan özelliklerini belirler.","ç) Örüntüler üzerinden bilim insanlarının özellikleri hakkında önermede bulunur."]}],"id":"tymm-fen-bilimleri-3-u1"},{"ad":"Canlılar Dünyasına Yolculuk","kdalar":[{"kod":"FB.3.2.1","ad":"Canlıları; mikroskopla görülebilen canlılar, mantarlar, bitkiler ve hayvanlar olarak sınıflandırabilme","oa":["a) Canlıların benzer ve farklı niteliklerini belirler.","b) Canlıları niteliklerine göre ayırır.","c) Canlıları gruplandırır.","ç) Canlıları etiketler."]},{"kod":"FB.3.2.2","ad":"Canlıların çevrelerini farklı yollarla algılamaları konusunda bilimsel çıkarım yapabilme","oa":["a) Canlıların çevrelerini algılama biçimlerine ilişkin nitelikleri tanımlar.","b) Duyu organlarının işlevleri ile ilgili veri toplayarak kaydeder.","c) Canlıların çevrelerini farklı biçimlerde algılamalarına ilişkin verileri yorumlayarak değerlendirir."]},{"kod":"FB.3.2.3","ad":"Canlıların yaşam döngülerini açıklamada tümevarımsal akıl yürütebilme","oa":["a) Canlıların yaşam döngüleri ile ilgili örüntüleri bulur.","b) Canlıların yaşam döngüleri ile ilgili genelleme yapar."]}],"id":"tymm-fen-bilimleri-3-u2"},{"ad":"Yer Bilimciler İş Başında","kdalar":[{"kod":"FB.3.3.1","ad":"Kayaçlar, madenler ve mineraller ile ilgili tümdengelimsel akıl yürütebilme","oa":["a) Kayaçlar, madenler ve mineralleri belirler.","b) Kayaçlar, madenler ve mineraller arasında ilişki kurar.","c) Kayaçlar, madenler ve mineraller arasında genelden genele veya genelden özele çıkarım yapar."]},{"kod":"FB.3.3.2","ad":"Fosil oluşumu ile ilgili sentez yapabilme","oa":["a) Fosil oluşumunu gösteren sürecin bütün ve parçalarını belirler.","b) Süreci oluşturan aşamalar arasında ilişki kurar.","c) Fosillerin oluşum sürecini oluşturan aşamaları uygun sırayla bir bütün hâline getirir."]}],"id":"tymm-fen-bilimleri-3-u3"},{"ad":"Maddeyi Tanıyalım, Karıştırıp Ayıralım","kdalar":[{"kod":"FB.3.4.1","ad":"Çevresindeki maddeleri hâllerine göre sınıflandırabilme","oa":["a) Çevresindeki maddelerin niteliklerini tanımlar.","b) Çevresindeki maddeleri niteliklerine göre ayırır.","c) Çevresindeki maddeleri hâllerine göre gruplandırır.","ç) Maddeleri hâllerine göre katı, sıvı ve gaz olarak etiketler."]},{"kod":"FB.3.4.2","ad":"Günlük yaşamda karşılaştığı karışımların ayrılmasında kullanılabilecek uygun yöntemleri kullanarak deney yapabilme","oa":["a) Karışımların ayrılmasında kullanılabilecek yöntemlerle ilgili deney tasarlar.","b) Deneyle ilgili ölçme ve veri analizi yapar."]},{"kod":"FB.3.4.3","ad":"Atıkların ayrıştırılmasına ilişkin problem çözebilme","oa":["a) Atıkların ayrıştırılmasına ilişkin problemi yapılandırır.","b) Atıkların ayrıştırılmasına ilişkin problemi özetler.","c) Atıkların ayrıştırılmasına ilişkin çözüm önerilerini gözleme ya da veriye dayalı tahmin eder.","ç) Atıkların ayrıştırılmasına ilişkin problemin çözümüne yönelik önermeler üzerinden akıl yürütür.","d) Atıkların ayrıştırılmasına ilişkin problemin çözümüne yönelik yansıtmada/değerlendirmede bulunur."]}],"id":"tymm-fen-bilimleri-3-u4"},{"ad":"Hareketi Keşfediyorum","kdalar":[{"kod":"FB.3.5.1","ad":"Varlıkların hareket durumlarını gözleme dayalı tahmin edebilme","oa":["a) Varlıkların hareket durumlarına ilişkin ön gözlem ve/veya deneyimlerini ilişkilendirir.","b) Varlıkların hareket durumlarına ilişkin çıkarım yapar.","c) Varlıkların hareket durumlarının sonuçlarına ilişkin yargıda bulunur."]},{"kod":"FB.3.5.2","ad":"Kuvvetin varlıklar üzerindeki etkilerini bilimsel gözleme dayalı tahmin edebilme","oa":["a) Varlıkların hareketinin ve şekil değiştirmesinin nedenine ilişkin ön bilgi ve deneyimleriyle önerme oluşturur.","b) Varlıkların hareketinin ve şekil değiştirmesinin nedenine ilişkin gözleme dayalı olan önermeleri karşılaştırır.","c) Kuvvetin varlıkların hareketine ve şekil değiştirmesine etkilerine ilişkin tahminlerini temellendirmek için gözlem verilerinden sonuç çıkarır.","ç) Kuvvetin varlıkların hareketine ve şekil değiştirmesine etkileri ile ilgili gözlemlenmemiş duruma ilişkin tahminde bulunur.","d) Kuvvetin varlıkların hareketine ve şekil değiştirmesine etkileri ile ilgili tahminlerinin geçerliliğini sorgular."]}],"id":"tymm-fen-bilimleri-3-u5"},{"ad":"Yaşamımızı Kolaylaştıran Elektrik","kdalar":[{"kod":"FB.3.6.1","ad":"Bazı araç gerecin elektrikli olduğuna ilişkin bilimsel çıkarım yapabilme","oa":["a) Farklı araç gerecin niteliklerini tanımlar.","b) Elektrikli araç gereçle ilgili veri toplayarak kaydeder.","c) Elektrikli araç gereçle ilgili verileri değerlendirir."]},{"kod":"FB.3.6.2","ad":"Elektrikli araç gerecin güvenli kullanımı ile ilgili eleştirel düşünebilme","oa":["a) Elektrikli araç gerecin güvenli kullanımı ile ilgili verilen bir olay/konu/problem veya durumu sorgular.","b) Elektrikli araç gerecin kullanımında güvenliğin sağlanabileceğine yönelik akıl yürütür.","c) Akıl yürütmeyle ulaştığı çıkarımları yansıtır."]},{"kod":"FB.3.6.3","ad":"Elektriği tasarruflu kullanma konusunda bilimsel veriye dayalı tahmin edebilme","oa":["a) Elektriği tasarruflu kullanma konusunda verilere ve/veya ön bilgilere dayalı önerme oluşturur.","b) Elektriği tasarruflu kullanma üzerine nicel ölçüm verilerine dayalı önermelerini gerekçelendirir.","c) Hesaplamalarına dayalı olarak tahmin eder.","ç) Tahminlerin geçerliliğini sorgular."]}],"id":"tymm-fen-bilimleri-3-u6"},{"ad":"Toprağı Tanıyorum, Tarımı Keşfediyorum","kdalar":[{"kod":"FB.3.7.1","ad":"Toprak oluşumuna ve yapısına ilişkin bilimsel gözlem yapabilme","oa":["a) Toprağın oluşumuna ve yapısına ilişkin nitelikleri tanımlar.","b) Toprağın yapısına ilişkin veri toplayarak kaydeder.","c) Toprağın yapısına ilişkin topladığı verileri açıklar."]},{"kod":"FB.3.7.2","ad":"Bir bitkinin yetişmesi için gerekenlere ilişkin genelleme yapabilme","oa":["a) Çevresinde bulunan tarım ürünlerinin nasıl yetiştirildiği konusunda araştırma yaparak bilgi toplar.","b) Bitki yetiştirmek için gerekli ortak özellikleri belirler.","c) Farklı bitkilerin yetiştirilmesinde ortak olmayan özellikleri belirler.","ç) Bir bitki yetiştirmek için yapılması gerekenler konusunda önermede bulunur."]}],"id":"tymm-fen-bilimleri-3-u7"},{"ad":"Canlıların Yaşam Alanlarına Yolculuk","kdalar":[{"kod":"FB.3.8.1","ad":"Canlıların yaşam alanlarının özelliklerini belirlemeye yönelik kanıt kullanabilme","oa":["a) Canlıların yaşam alanlarının özelliklerine ilişkin veri toplayarak kaydeder.","b) Canlıların yaşam alanlarına ilişkin veri setleri oluşturur.","c) Canlıların yaşam alanlarının özelliklerine ilişkin veriye dayalı açıklama yapar."]},{"kod":"FB.3.8.2","ad":"Yaşam alanındaki canlı çeşitliliğini operasyonel olarak tanımlayabilme","oa":["a) Yaşam alanının özelliklerini tanımlar.","b) Yaşam alanındaki canlı çeşitliliği ile ilgili ölçüm yapar.","c) Canlı çeşitliliğinin tanımını yapar."]},{"kod":"FB.3.8.3","ad":"Yaşam alanlarının korunması için yapılacakları sorgulayabilme","oa":["a) Merak ettiği konuyu tanımlar.","b) İlgili konu hakkında sorular sorar.","c) İlgili konu hakkında bilgi toplar.","ç) Toplanan bilgilerin doğruluğunu değerlendirir.","d) Toplanan bilgiler üzerinde çıkarım yapar."]}],"id":"tymm-fen-bilimleri-3-u8"}],"id":"tymm-fen-bilimleri-3"},{"ad":"Fen Bilimleri","sinif":"4. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Bilime Yolculuk","kdalar":[{"kod":"FB.4.1.1","ad":"Bilimin özellikleri ile ilgili deneyimlerini yansıtabilme","oa":["a) Bilim ile ilgili bilgi ve deneyimini gözden geçirir.","b) Bilimin özellikleri ile ilgili çıkarım yapar.","c) Bilimin özellikleri ile ilgili ulaşılan çıkarımları değerlendirir."]},{"kod":"FB.4.1.2","ad":"Bilgi kaynağının güvenilirliğini sorgulayabilme","oa":["a) Merak ettiği bilimsel bir konuyu tanımlar.","b) İlgili konu hakkında sorular sorar.","c) İlgili konu hakkında teknolojik araçlar ve diğer kaynakları kullanarak bilgi toplar.","ç) Toplanan bilgilerden hareketle bilginin doğruluğunu değerlendirir.","d) Yaptığı değerlendirmeler sonucunda bilgi kaynaklarının güvenilirliği ile ilgili çıkarım yapar."]}],"id":"tymm-fen-bilimleri-4-u1"},{"ad":"Sağlıklı Besleniyorum","kdalar":[{"kod":"FB.4.2.1","ad":"Besin içeriklerini ayırt etmek için deney yapabilme","oa":["a) Besinlerdeki protein, karbohidrat, yağ ve su içeriğini ayırt etmek için deney tasarlar.","b) Yaptığı deneyde veri analizi yapar."]},{"kod":"FB.4.2.2","ad":"Besinlerde vitamin ve/veya mineral bulunduğuna ilişkin genelleme yapabilme","oa":["a) Besinlerdeki vitamin ve mineraller ile ilgili bilgi toplar.","b) Besinlerdeki ortak olan özellikleri belirler.","c) Besinlerdeki ortak olmayan özellikleri belirler.","ç) Örüntüler üzerinden besinlerde vitamin ve/veya minerallerin bulunduğu önermesinde bulunur."]},{"kod":"FB.4.2.3","ad":"Besinlerin işlevleri ile ilgili hipotez oluşturabilme","oa":["a) Besinlerin işlevleri ile ilgili problemi tanımlar.","b) Besinlerin işlevleri ve vücudumuzdaki görevleri arasındaki neden-sonuç ilişkilerini belirler.","c) Besinlerin içerikleri ile ilgili verilen değişkenleri belirler.","ç) Besinlerin işlevleri ile ilgili değişkenleri kontrol eder.","d) Besinlerin işlevleri ve sağlıklı yaşam arasındaki ilişkiye yönelik önerme sunar."]}],"id":"tymm-fen-bilimleri-4-u2"},{"ad":"Dünya’mızı Keşfedelim","kdalar":[{"kod":"FB.4.3.1","ad":"Dünya’nın şekli ile ilgili bilimsel gözleme dayalı tahmin yapabilme","oa":["a) Dünya’nın şekli ile ilgili ön bilgi ve deneyimlerine dayalı önerme oluşturur.","b) Dünya’nın şekli ile ilgili gözleme dayalı olan önermeleri karşılaştırır.","c) Dünya’nın şekli ile ilgili tahminlerini temellendirmek için gözlem verilerinden sonuç çıkarır.","ç) Dünya’nın şekli ile ilgili veriye dayalı tahminde bulunur.","d) Dünya’nın şekli ile ilgili verilere dayalı tahminlerin geçerliğini sorgular."]},{"kod":"FB.4.3.2","ad":"Dünya’nın yapısıyla ilgili bilimsel model oluşturabilme","oa":["a) Dünya’nın yapısını açıklamak için model önerir.","b) Dünya’nın yapısını açıklamak için yeni kanıtlarla modeli geliştirir."]},{"kod":"FB.4.3.3","ad":"Dünya’nın hareketlerini gözlemlerine dayanarak tahmin edebilme","oa":["a) Dünya’nın hareketleri ile ilgili önceki gözlem ve/veya deneyimini ilişkilendirir.","b) Dünya’nın hareketlerine ilişkin çıkarım yapar.","c) Dünya’nın hareketlerinin sonuçlarına ilişkin yargıda bulunur."]}],"id":"tymm-fen-bilimleri-4-u3"},{"ad":"Maddenin Değişimi","kdalar":[{"kod":"FB.4.4.1","ad":"Maddelerin hâl değişimine yönelik bilimsel çıkarım yapabilme","oa":["a) Maddelerin hâllerine yönelik nitelikleri tanımlar.","b) Maddelerin hâl değişimine yönelik verileri kaydeder.","c) Maddelerin hâl değişimine yönelik verileri yorumlayarak değerlendirir."]},{"kod":"FB.4.4.2","ad":"Maddelerin ısı etkisiyle değişimine yönelik deney yapabilme","oa":["a) Maddelerin ısı etkisiyle değişimine yönelik deney tasarlar.","b) Maddelerin ısı etkisiyle değişimine yönelik ölçme veri analizi yapar."]}],"id":"tymm-fen-bilimleri-4-u4"},{"ad":"Mıknatısı Keşfediyorum","kdalar":[{"kod":"FB.4.5.1","ad":"Mıknatısın kutupları ve birbirleriyle etkileşimleri ile ilgili tümevarımsal akıl yürütebilme","oa":["a) Mıknatıs çeşitlerinin kutupları ve birbiriyle etkileşimleri ile ilgili örüntü bulur.","b) Mıknatısın kutupları ve birbiriyle etkileşimleri ile ilgili genelleme yapar."]},{"kod":"FB.4.5.2","ad":"Mıknatısın etki ettiği maddelere ilişkin bilimsel gözleme dayalı tahmin yapabilme","oa":["a) Mıknatısın etki ettiği maddelere ilişkin ön bilgi ve deneyimlerine dayanarak önerme oluşturur.","b) Mıknatısın etki ettiği maddelere ilişkin gözleme dayalı önermeleri karşılaştırır.","c) Mıknatısın etki ettiği maddelere ilişkin tahminlerini temellendirmek için gözlem verilerinden sonuç çıkarır.","ç) Mıknatısın etki ettiği maddelerle ilgili gözlemlenmemiş duruma ilişkin tahminde bulunur.","d) Tahminlerin geçerliğini sorgular."]},{"kod":"FB.4.5.3","ad":"Mıknatısın kullanım alanlarına yönelik bilimsel olarak sorgulayabilme","oa":["a) Mıknatısın kullanım alanlarına yönelik bir soru veya problem tanımlar.","b) Sorusunu/problemini cevaplamada kullanabileceği bir model geliştirir.","c) Modelini oluşturmaya yönelik araştırma planlayarak gerçekleştirir.","ç) Oluşturduğu modele ilişkin verileri analiz ederek yorumlar.","d) Oluşturduğu modelle ilgili sorunlara ilişkin kanıta dayalı açıklama yaparak çözüm üretir.","e) Oluşturduğu modeli değerlendirerek paylaşır."]}],"id":"tymm-fen-bilimleri-4-u5"},{"ad":"Elektrik ve Enerji Kaynakları","kdalar":[{"kod":"FB.4.6.1","ad":"Basit bir elektrik devresi kurmaya ilişkin bilimsel olarak sorgulayabilme","oa":["a) Devre elemanlarını kullanarak basit bir elektrik devresi kurmaya ilişkin soru veya problemi tanımlar.","b) Sorusunu/problemini cevaplamada kullanacağı basit bir elektrik devresi modeli geliştirir.","c) Basit bir elektrik devresinde devre elemanlarına ve işlevlerine ilişkin araştırmayı planlayarak gerçekleştirir.","ç) Basit bir elektrik devresine ilişkin verileri analiz ederek yorumlar.","d) Elektrik devresinin çalışıp çalışmamasına yönelik kanıta dayalı açıklama yaparak çözüm üretir.","e) Çalışan basit bir elektrik devresi kurmaya ilişkin bilgiyi değerlendirerek paylaşır."]},{"kod":"FB.4.6.2","ad":"Elektrik üretiminde yenilenebilir ve yenilenemeyen enerji kaynaklarını kullanmaya ilişkin eleştirel düşünebilme","oa":["a) Elektrik üretiminde yenilenebilir ve yenilenemeyen enerji kaynaklarını kullanmaya ilişkin bir durumu veya problemi sorgular.","b) Elektrik üretiminde yenilenebilir ve yenilenemeyen enerji kaynaklarını kullanmaya ilişkin durum veya problemin canlılar ve çevre üzerine etkileri konusunda akıl yürütür.","c) Enerji kaynaklarının sürdürülebilirliklerine ilişkin akıl yürütmeyle ulaştığı çıkarımları yansıtır."]}],"id":"tymm-fen-bilimleri-4-u6"},{"ad":"Işığı Tanıyalım","kdalar":[{"kod":"FB.4.7.1","ad":"Görme olayının gerçekleşebilmesi için ışığın rolüne ilişkin deney yapabilme","oa":["a) Görme olayının gerçekleşebilmesi için ışığın rolüne ilişkin deney tasarlar.","b) Görme olayında ışığın rolüne ilişkin deneyde ölçme ve veri analizi yapar."]},{"kod":"FB.4.7.2","ad":"Doğal ve yapay ışık kaynaklarını karşılaştırabilme","oa":["a) Çevresindeki ışık kaynaklarına ilişkin özellikleri belirler.","b) Işık kaynaklarının benzerliklerini listeler.","c) Işık kaynaklarının farklılıklarını listeler."]},{"kod":"FB.4.7.3","ad":"Işık kirliliğinin canlılara etkisine ilişkin problemleri çözebilme","oa":["a) Işık kirliliğinin canlılara etkisine ilişkin problemi yapılandırır.","b) Problemi özetler.","c) Problemin çözümüne yönelik gözleme dayalı/mevcut bilgiye/veriye dayalı tahmin eder.","ç) Problemin çözümüne yönelik önermeler üzerinden akıl yürütür.","d) Problemin çözümüne ilişkin yansıtmada/değerlendirmede bulunur."]}],"id":"tymm-fen-bilimleri-4-u7"},{"ad":"Sürdürülebilir Yaşam Alanları","kdalar":[{"kod":"FB.4.8.1","ad":"Sürdürülebilir bir yaşam alanı kurmaya ilişkin bilimsel sorgulama yapabilme","oa":["a) Sürdürülebilir bir yaşam alanı kurmaya ilişkin soru veya problem tanımlar.","b) Sorusunu/problemini cevaplamada kullanabileceği bir sürdürülebilir yaşam alanı modeli geliştirir.","c) Sürdürülebilir bir yaşam alanı kurmaya ilişkin araştırma planlayarak modelini gerçekleştirir.","ç) Yaşam alanının sürdürülebilirliğine ilişkin verileri analiz ederek yorumlar.","d) Yaşam alanının sürdürülebilir olup olmadığına ilişkin kanıta dayalı açıklama yaparak çözüm üretir.","e) Sürdürülebilir bir yaşam alanı kurmaya ilişkin bilgiyi değerlendirerek paylaşır."]}],"id":"tymm-fen-bilimleri-4-u8"}],"id":"tymm-fen-bilimleri-4"},{"ad":"Sosyal Bilgiler","sinif":"4. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Birlikte Yaşamak","kdalar":[{"kod":"SB.4.1.1","ad":"Sosyal bilgiler dersinin hayatına sunacağı katkıları yorumlayabilme","oa":["a) Örnek olaylardan hareketle sosyal bilgiler dersinin bireysel ve toplumsal katkılarını inceler.","b) Sosyal bilgiler dersinin bireysel ve toplumsal katkılarını bağlamdan kopmadan dönüştürür.","c) Sosyal bilgiler dersinin bireysel ve toplumsal katkılarını nesnel, doğru ve anlamı değiştirmeyecek şekilde yeniden ifade eder."]},{"kod":"SB.4.1.2","ad":"Bireysel özelliklere saygı duymayı hayatına yansıtabilme","oa":["a) Bireysel özelliklere ilişkin deneyimlerini gözden geçirir.","b) Bireysel özelliklere saygı duymanın önemine ilişkin çıkarım yapar.","c) Bireysel özelliklere saygı duymanın önemine ilişkin ulaştığı çıkarımları değerlendirir."]},{"kod":"SB.4.1.3","ad":"Toplumsal birliği sürdürmeye yönelik fikir üretebilme","oa":["a) Aile, sınıf ve okul ortamında toplumsal birliği sürdürmenin bir gereklilik olduğunu fark eder.","b) Aile, sınıf ve okul ortamında toplumsal birliği sürdürmeye katkıda bulunan benzer örnekleri inceler.","c) Aile, sınıf ve okul ortamında toplumsal birliği sürdürmeye yönelik fikir üretir."]}],"id":"tymm-sosyal-bilgiler-4-u1"},{"ad":"Evimiz Dünya","kdalar":[{"kod":"SB.4.2.1","ad":"Konum ve yön bulmada haritaları okuyabilme","oa":["a) Haritanın başlığından haritanın içeriğine ilişkin anlam çıkarır.","b) Harita üzerindeki sembol ve renkleri ayırt eder.","c) Harita kenar bilgilerini ve harita kenar bilgilerindeki sembolleri anlamlandırır.","ç) Yakın çevresindeki bir yerin konumunu belirlerken konum bilgisi, konum bulmaya yönelik sistemler ve araçlardan yararlanır.","d) Haritadaki unsurlardan hareketle haritayı ve harita türünü çözümler."]},{"kod":"SB.4.2.2","ad":"Yakın çevresinden hareketle doğa ve insan ilişkisini çözümleyebilme","oa":["a) Yakın çevresindeki doğal çevre unsurlarını belirler.","b) Yakın çevresindeki doğal çevre unsurları ile insanlar arasındaki ilişkileri belirler."]},{"kod":"SB.4.2.3","ad":"Afetlerin etkilerini azaltma konusunda yapılabileceklere ilişkin oluşturduğu ürünü paylaşabilme","oa":["a) Kendisine sunulan kaynaklara dayanarak geçmişten günümüze yakın çevresinde gerçekleşen afetlere yönelik çıkarım yapar.","b) Yakın çevresinde gerçekleşebilecek afetlerin etkilerini azaltmak için yapılabilecekleri yansıtan bir ürün oluşturur.","c) Yakın çevresinde gerçekleşebilecek afetlerin etkilerini azaltmak için yapılabileceklere ilişkin oluşturduğu ürünü paylaşır."]}],"id":"tymm-sosyal-bilgiler-4-u2"},{"ad":"Ortak Mirasımız","kdalar":[{"kod":"SB.4.3.1","ad":"Geçmişten günümüze çocuk oyun ve oyuncaklarının değişimini karşılaştırabilme","oa":["a) Geçmişten günümüze çocuk oyun ve oyuncaklarının özelliklerini kanıt, gözlem ve/veya deneyimlere dayalı olarak belirler.","b) Oyun ve oyuncakların zaman içerisinde değişmeyen özelliklerini kanıt, gözlem ve/veya deneyime dayalı olarak listeler.","c) Oyun ve oyuncakların zaman içerisinde değişen özelliklerini kanıt, gözlem ve/veya deneyime dayalı olarak listeler."]},{"kod":"SB.4.3.2","ad":"Aile tarihini yansıtan bir ürün paylaşabilme","oa":["a) Aile tarihine ilişkin elde ettiği kaynaklara dayalı çıkarım yapar.","b) Aile tarihine ilişkin kanıtlardaki bilgilerden hareketle görüşünü yansıtan bir ürün oluşturur.","c) Aile tarihine ilişkin görüşlerine dayalı olarak oluşturduğu ürünü paylaşır."]},{"kod":"SB.4.3.3","ad":"Yakın çevresindeki ortak miras ögelerini tanımanın önemini yorumlayabilme","oa":["a) Yakın çevresindeki ortak miras ögelerini inceler.","b) Yakın çevresindeki ortak miras ögeleri ile ilgili edindiği bilgileri nesnel, doğru anlamı değiştirmeyecek bir şekilde yeniden ifade eder."]}],"id":"tymm-sosyal-bilgiler-4-u3"},{"ad":"Yaşayan Demokrasimiz","kdalar":[{"kod":"SB.4.4.1","ad":"Millî Mücadele Dönemi’nde Mustafa Kemal Atatürk’ün ve Türk milletinin yaptığı fedakârlıkları yorumlayabilme","oa":["a) Millî Mücadele Dönemi’nde Mustafa Kemal Atatürk’ün ve Türk milletinin yaptığı fedakârlıklara ilişkin kaynakları inceler.","b) Millî Mücadele Dönemi’nde Mustafa Kemal Atatürk’ün ve Türk milletinin yaptığı fedakârlıklara ilişkin bilgileri bağlamdan kopmadan dönüştürür.","c) Millî Mücadele Dönemi’nde Mustafa Kemal Atatürk’ün ve Türk milletinin yaptığı fedakârlıklara ilişkin edindiği bilgileri nesnel, doğru ve anlamı değiştirmeyecek şekilde yeniden yorumlar."]},{"kod":"SB.4.4.2","ad":"Cumhuriyetin getirdiği değişimlerin hayatımıza katkılarını yorumlayabilme","oa":["a) Cumhuriyetin getirdiği değişimleri dönemi anlatan anılar, hikâyeler ve görsel içerikler aracılığıyla inceler.","b) Cumhuriyetin getirdiği değişimlerden edindiği bilgileri bağlamdan kopmadan dönüştürür.","c) Cumhuriyetin getirdiği değişimlerden edindiği bilgileri nesnel, doğru ve anlamı değiştirmeyecek şekilde yeniden ifade eder."]},{"kod":"SB.4.4.3","ad":"Okulda karar alma ve demokratik katılım süreçlerine ilişkin fikir üretebilme","oa":["a) Okulda karar alma ve demokratik katılım süreçlerini fark eder.","b) Okulda karar alma ve demokratik katılım süreçlerine ilişkin deneyimleri inceler.","c) Okuldaki karar alma ve demokratik katılım süreçlerinin etkin bir şekilde yürütülmesine ilişkin fikir üretir."]}],"id":"tymm-sosyal-bilgiler-4-u4"},{"ad":"Hayatımızdaki Ekonomi","kdalar":[{"kod":"SB.4.5.1","ad":"Doğal kaynakların tüketimi ile ilgili grafik yorumlayabilme","oa":["a) Doğal kaynakların tüketimi ile ilgili verilen grafik üzerindeki simgelerin karşılık geldiği ifadeleri tanır.","b) Doğal kaynakların tüketimi ile ilgili verilen grafiği çözümler.","c) Çözümlediği grafiklerden elde ettiği verilere dayalı sonuç çıkarır.","ç) Çıkardığı sonuçları kullanarak kaynaklar ve tüketim ilişkisini karşılaştırır."]},{"kod":"SB.4.5.2","ad":"İstek ve ihtiyaçları arasındaki bilinçli seçimleri hayatına yansıtabilme","oa":["a) İstek ve ihtiyaç kavramlarına ilişkin deneyimleri gözden geçirir.","b) İstek ve ihtiyaçları arasında bilinçli seçim yapmaya yönelik çıkarımda bulunur.","c) İstek ve ihtiyaçları arasında yaptığı seçimleri değerlendirir."]},{"kod":"SB.4.5.3","ad":"Bir ürünün üretim, dağıtım ve tüketim süreçlerini çözümleyebilme","oa":["a) Bir ürünün geçirdiği yolculuğun süreçlerini belirler.","b) Ürünlerin üretim, dağıtım ve tüketim süreçleri arasındaki ilişkileri belirler."]}],"id":"tymm-sosyal-bilgiler-4-u5"},{"ad":"Teknoloji ve Sosyal Bilimler","kdalar":[{"kod":"SB.4.6.1","ad":"Çevrim içi ortamda uyulması gereken güvenlik kurallarını eylemlerine yansıtabilme","oa":["a) Çevrim içi ortamdaki deneyimleri güvenlik kuralları çerçevesinde gözden geçirir.","b) Çevrim içi ortamda uyulması gereken güvenlik kurallarına ilişkin çıkarım yapar.","c) Çevrim içi ortamda uyulması gereken güvenlik kurallarına ilişkin çıkarımları değerlendirir."]},{"kod":"SB.4.6.2","ad":"Bilim insanlarının çocukluk hayatlarına ilişkin tarihsel bağlam oluşturabilme","oa":["a) Bilim insanlarının çalışmalarını kanıtlara dayalı olarak analiz eder.","b) Bilim insanlarının çocukluk dönemi koşullarını fark eder.","c) Bilim insanlarının çocukluk dönemi koşulları ile günümüz koşullarını karşılaştırır.","ç) Bilim insanlarının çocukluklarını dönemin koşulları içerisinde açıklar."]}],"id":"tymm-sosyal-bilgiler-4-u6"}],"id":"tymm-sosyal-bilgiler-4"},{"ad":"İnsan Hakları, Vatandaşlık ve Demokrasi","sinif":"4. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Çocuk Olarak Haklarımla Varım","kdalar":[{"kod":"İHVD.4.1.1","ad":"Çocuk olmanın özelliklerini belirleyebilme","oa":[]},{"kod":"İHVD.4.1.2","ad":"Çocuk haklarıyla ilgili kanıta dayalı olarak oluşturduğu ürünü paylaşabilme","oa":["a) Verilen kanıtlara dayanarak çocuk haklarına ihtiyaç duyulma sebeplerini tespit eder.","b) Tespitleri bağlamında kendi çocuk hakları sözleşmesini oluşturur.","c) Çocuk Hakları Sözleşmesi’nin maddelerini sözlü veya görsel olarak yeniden ifade eder."]},{"kod":"İHVD.4.1.3","ad":"İnsan olmanın getirdiği temel hak ve özgürlükleri yorumlayabilme","oa":["a) İnsan olmanın getirdiği temel hak ve özgürlükleri örnekler üzerinden inceler.","b) İnsan olmanın getirdiği temel hak ve özgürlükleri bağlamdan kopmadan yazılı veya sözlü olarak ifade eder.","c) İnsan olmanın getirdiği temel hak ve özgürlükleri kendi cümleleri ile ifade eder."]}],"id":"tymm-i-nsan-haklari-vatandaslik-ve-demokrasi-4-u1"},{"ad":"Hayatımda Eşitlik ve Adalet","kdalar":[{"kod":"İHVD.4.2.1","ad":"Eşitlik kavramının anlamını sorgulayabilme","oa":["a) Eşitlik kavramı ile ilgili merak ettiklerini tanımlar.","b) Eşitlik kavramı hakkında sorular sorar (5N1K).","c) Eşitlik hakkında farklı kaynaklardan bilgi toplar.","ç) Eşitlik hakkında edindiği bilgilerin doğruluğunu kontrol eder.","d) Eşitlik hakkında topladığı bilgiler üzerinden çıkarım yapar."]},{"kod":"İHVD.4.2.2","ad":"Adalet ve eşitlik arasındaki ilişkiyi yorumlayabilme","oa":["a) Adalet ve eşitlik kavramları arasındaki ilişkiyi inceler.","b) Adalet ve eşitlik kavramları arasındaki ilişkiyi bağlamdan kopmadan, sözlü veya görsel olarak ifade eder.","c) Adalet ve eşitlik kavramlarını kendi hayatından örnekler vererek ifade eder."]},{"kod":"İHVD.4.2.3","ad":"Fırsat eşitliğinin anlamını yorumlayabilme","oa":["a) Fırsat eşitliğine ilişkin durumları inceler.","b) Fırsat eşitliğinin önemini sözlü, yazılı veya görsel olarak ifade eder.","c) Fırsat eşitliği ile ilgili yakın çevresinden örnekler verir."]}],"id":"tymm-i-nsan-haklari-vatandaslik-ve-demokrasi-4-u2"},{"ad":"Etkin Bir Vatandaşım","kdalar":[{"kod":"İHVD.4.3.1","ad":"Vatandaş olmanın getirdiği hak ve özgürlükleri yorumlayabilme","oa":["a) Vatandaş olmanın getirdiği hak ve özgürlükleri örnekler üzerinden inceler.","b) Vatandaş olmanın getirdiği hak ve özgürlükleri sözlü, yazılı, görsel vb. şekillerde ifade eder.","c) Vatandaş olmanın getirdiği hak ve özgürlükleri kendi hayatından örnekler kullanarak yeniden açıklar."]},{"kod":"İHVD.4.3.2","ad":"Etkin vatandaş olmanın gerektirdiği sorumlulukları belirleyebilme","oa":[]},{"kod":"İHVD.4.3.3","ad":"Dijital vatandaşlığın gerektirdiği özellikleri belirleyebilme" function oturumOran(k,o){const vals=hedefler(k).map((_,i)=>o.r[i]).filter(Boolean);return vals.length?vals.filter(v=>v==='+').length/vals.length:null}

function durum(r,k,cut){const t=r.takip[k.kod];if(t?.durum==='kazanildi'&&(!cut||!t.kazanTarih||t.kazanTarih<=cut))return'kazanildi';if(t?.durum==='birakildi')return'birakildi';const os=oturumlar(r,k.kod,cut);if(!os.length)return'baslamadi';return (sonOran(r,k,cut)||0)>=.5?'kismen':'devam'}
const DURUM={kazanildi:['Kazanıldı','l3'],kismen:['Kısmen kazanıldı','l2'],devam:['Çalışılıyor','l1'],baslamadi:['Başlanmadı','ink3'],birakildi:['Bırakıldı','ink3']};

}
function fitDoc(){const st=document.querySelector('.docstage'),d=document.getElementById('docroot');if(!st||!d)return;const w=st.clientWidth-36;d.style.zoom=Math.min(1,w/1000)}

function prog(a,b){return `<span class="prog" role="img" aria-label="${b} amaçtan ${a} kazanıldı"><i style="width:${b?Math.round(a/b*100):0}%"></i></span>`}
function topbar(back,title,sub,tabs,active,act){return `<div class="top"><div class="top-in"><button class="iconbtn" data-act="${back}" aria-label="Geri">${I.back}</button><div class="grow"><h2>${title}</h2><div class="sub">${sub}</div></div></div>${tabs?`<div class="tabs" role="tablist">${tabs.map(([k,l,ic,n])=>`<button class="tab" role="tab" aria-selected="${active===k}" data-act="${act}" data-tab="${k}">${ic}<span>${l}</span>${n!==''&&n!=null&&n!==0?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>`:''}</div>`}
function acctRow(){return AUTH.mode==='user'?`<div class="acct"><span>Merhaba, <b>${esc((AUTH.profile?.ad_soyad||AUTH.user.email||'').split(' ')[0])}</b></span><button class="btn ghost small" data-act="logout" style="min-height:36px;padding:6px 10px">Çıkış</button></div>`:''}
function guestBar(){return AUTH.mode==='guest'?`<div class="guestbar"><span>Giriş yapmadan kullanıyorsun; öğrencilerin yalnızca bu cihazda duruyor.</span><button class="btn small" data-act="toauth" style="min-height:36px">Kayıt ol ya da giriş yap</button></div>`:''}

 let plan=0,kaz=0;act.forEach(s=>recsOf(s).forEach(r=>{const c=sayim(r);plan+=c.plan;kaz+=c.kaz}));
 return `<div class="wrap"><header class="mast">

  ${guestBar()}

  <div class="row"><button class="btn pri" data-act="newstu">${I.plus} Yeni öğrenci</button></div></header>
 ${S.students.length?`<div class="stat-strip"><div><b>${act.length}</b><span class="muted small">öğrenci</span></div><div><b>${plan}</b><span class="muted small">çalışılan amaç</span></div><div><b>${kaz}</b><span class="muted small">kazanılan amaç</span></div></div>

 const list=S.bank.dersler.filter(d=>!var_.has(d.id)&&(!f||d.sinif===f||(/^\d-\d/.test(d.sinif)&&+d.sinif[0]<=+f[0]&&+f[0]<=+d.sinif[2])));

 <div class="ders-grid">${list.map(d=>`<button class="ders" data-act="addders" data-id="${d.id}"><b>${esc(d.ad)}</b><span class="muted small">${esc(d.sinif)} · ${esc(d.program||'')}</span>${/özel/i.test(d.kademe||'')?'<span class="small" style="color:var(--accent);font-weight:700">Özel eğitim dersi</span>':''}<span class="muted small">${d.udalar.length} alan · ${allKda(d).length} kısa dönemli amaç</span></button>`).join('')||'<p class="muted">Bu süzgeçte eklenecek ders kalmadı.</p>'}</div>`}

 ${f('ad','Adı soyadı',{hint:S.profil.basHarf?'Ayarlarına göre baş harflerle saklanır.':''})}${f('no','Numarası',{hint:'Boş bırakılabilir'})}${f('sinif','Sınıfı / şubesi',{ph:'3/A'})}${f('dogum','Doğum tarihi',{type:'date'})}
 ${f('okul','Okul',{hint:'Sonraki öğrencilerde hatırlanır'})}${f('ogretmen','Hazırlayan öğretmen',{hint:'Sonraki öğrencilerde hatırlanır'})}${f('yil','Eğitim öğretim yılı',{ph:'2026-2027'})}
 </div></div>

 ${f('destek','Eğitsel tanı / destek türü',{ph:'İsteğe bağlı',hint:'Sağlık ve engel bilgisi özel nitelikli kişisel veridir; gerekmiyorsa boş bırak.'})}${f('veliAd','Veli adı soyadı')}${f('veliTel','Veli telefonu',{im:'numeric',ph:'05xx xxx xx xx',tel:1})}
 </div></div>

 <div class="section-h"><h2>Değerlendirme takvimi</h2><span class="muted small">Tüm derslerin BEP'inde kullanılır</span></div>
 <div class="card" style="display:grid;gap:12px"><div class="seg" role="group" aria-label="Değerlendirme sıklığı">${Object.entries(TAKVIM).map(([k,l])=>`<button aria-pressed="${s.takvim===k}" data-act="takvim" data-v="${k}">${l}</button>`).join('')}</div>${s.takvim==='hafta'?`<div class="seg" role="group" aria-label="Gün">${GUNLER.map(g=>`<button aria-pressed="${s.takvimGun===g}" data-act="gun" data-v="${g}">${g}</button>`).join('')}</div>`:''}</div>

/* ---------- ders (kayıt) ---------- */
function vRec(r){const s=stu(r),d=dersOf(r);const c=sayim(r);const tot=c.c.reduce((a,b)=>a+b,0);
 const tabs=[['perf','Performans',I.ladder,tot],['plan','Plan',I.cal,c.plan],['takip','Takip',I.chart,c.kaz?c.kaz+'/'+c.plan:''],['belge','Belge',I.doc,'']];

 return topbar('tostu',esc(d?`${d.ad} · ${d.sinif}`:'Ders'),esc(adG(s)+(s?.sinif?' · '+s.sinif:'')),tabs,UI.tab,'tab')+`<div class="wrap">${body}</div>`}
function vPerf(r){const d=dersOf(r);if(!d)return `<div class="empty"><h2>Bu dersin programı bankada yok</h2><p class="muted">Ders bankadan silinmiş olabilir.</p></div>`;

 return `<div class="section-h" style="margin-top:8px"><h2>Ne yapabiliyor?</h2><button class="btn ghost small" data-act="kabaform">${I.print} Kâğıt kaba değerlendirme formu</button></div>
 <p class="muted" style="margin:0;max-width:62ch">Her amaç için öğrencinin ulaştığı basamağa dokun. Hiç ya da yardımla kısmen yapabildikleri plana önerilir; çoğunlukla ya da bağımsız yapabildikleri eğitsel performansa yazılır.</p>
 <div class="legend">${LVL.map((l,i)=>`<span><i style="background:var(--l${i})"></i>${l}</span>`).join('')}</div>
 ${d.udalar.map(u=>{const open=UI.open[u.id]!==false;const n=u.kdalar.filter(k=>r.perf[k.kod]!=null).length;return `<section class="uda" data-open="${open}">
  <button class="uda-h" data-act="uda" data-id="${u.id}" aria-expanded="${open}"><h3>${esc(u.ad)}</h3><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="muted small" data-udacount="${u.id}">${n}/${u.kdalar.length}</span>${I.chev}</span></button>
  <div class="kdas">${u.kdalar.map(k=>kdaRow(r,u,k)).join('')}</div></section>`}).join('')}
 <div class="section-h"><h2>Eğitsel performans notu</h2><span class="muted small">BEP dosyasındaki performans formunda yer alır</span></div>
 <div class="card" style="display:grid;gap:10px"><textarea class="in" rows="5" data-perfnot="${r.id}" placeholder="Öğrencinin bu dersteki güçlü yönleri ve desteklenmesi gereken alanları">${esc(r.perfNot)}</textarea>
 <div class="row"><button class="btn" data-act="sablon" data-k="perf" data-rid="${r.id}">${I.pen} Şablondan yaz</button><button class="btn aibtn" data-act="aiyaz" data-k="perf" data-rid="${r.id}" hidden>${I.spark} Yapay zekâyla yaz</button></div></div>
 <div class="row" style="margin-top:22px"><button class="btn danger small" data-act="delrec">${I.trash} Bu dersi öğrenciden kaldır</button></div>
 <div class="dock"><div class="dock-in"><span class="small">${plan} amaç planda · ${c[2]+c[3]} amaç performansta</span><button class="btn" data-act="tab" data-tab="plan" ${plan?'':'disabled'}>Planla</button></div></div>`}
function kdaRow(r,u,k){
 const l=r.perf[k.kod];const p=r.plan[k.kod];const oaOpen=UI.oaOpen[k.kod];
 return `<div class="kda" id="k-${esc(k.kod)}">
  <div><div class="code">${esc(k.kod)}</div><div class="t">${esc(k.ad)}</div>
   ${k.oa?.length?`<button class="oa-toggle" data-act="oa" data-kod="${esc(k.kod)}" aria-expanded="${!!oaOpen}">${oaOpen?'Öğretimsel amaçları gizle':`${k.oa.length} öğretimsel amaç`}</button>`:''}</div>
  <div class="ladder-wrap"><span class="lvl-name" data-l="${l??''}">${l!=null?LVL[l]:'Değerlendirilmedi'}</span>
   <div class="ladder" data-l="${l??''}" role="radiogroup" aria-label="${esc(k.kod)} performans">${LVL.map((n,i)=>`<button role="radio" aria-checked="${l===i}" aria-label="${n}" title="${n}" data-act="lvl" data-kod="${esc(k.kod)}" data-l="${i}"></button>`).join('')}</div></div>
  ${oaOpen?`<ul class="oa">${k.oa.map((x,i)=>`<li>${esc(oaF(x,i))}</li>`).join('')}</ul>`:''}
  ${l===0||l===1?`<div class="foot"><button class="pill ${p?.on?'on':''}" data-act="toggleplan" data-kod="${esc(k.kod)}" aria-pressed="${!!p?.on}"><span class="dot"></span>${p?.on?'Planda':'Plana al'}</button></div>`:''}
 </div>`}
const bosPlan=`<div class="empty"><h2>Planda amaç yok</h2><p class="muted">Performans sekmesinde "hiç" ya da "kısmen" işaretlediğin amaçlar burada görünür.</p><button class="btn pri" data-act="tab" data-tab="perf">Performansa dön</button></div>`;
function vPlan(r){
 const items=planli(r);if(!items.length)return bosPlan;
 const s=stu(r);const aylar=yilAylari(s.yil);const d=dersOf(r);
 const eks=items.filter(({k})=>eksik(r.plan[k.kod]).length).length;
 let grid=`<div class="tl-grid"><div class="tl-mh">Amaç</div>${aylar.map(a=>`<div class="tl-mh">${ayKisa(a)}</div>`).join('')}`;
 d.udalar.forEach(u=>{const ks=items.filter(x=>x.u===u);if(!ks.length)return;grid+=`<div class="tl-uda">${esc(u.ad)}</div>`;
  ks.forEach(({k})=>{const p=r.plan[k.kod];const e=eksik(p);const si=aylar.indexOf(p.bas),ei=aylar.indexOf(p.bit);
   grid+=`<button class="tl-name" data-act="edit" data-kod="${esc(k.kod)}"><span class="code">${esc(k.kod)}</span><span class="t">${esc(k.ad)}</span>${e.length?`<span class="miss">Eksik: ${e.join(', ')}</span>`:`<span class="ok">Hazır · ${esc(p.olcut)}</span>`}</button>`;
   aylar.forEach((a,i)=>{grid+=`<div class="tl-cell">${i===si&&ei>=si?`<button class="tl-bar" data-act="edit" data-kod="${esc(k.kod)}" style="left:4px;width:calc(${(ei-si+1)*100}% + ${(ei-si)}px - 8px)" aria-label="${esc(k.kod)} tarihlerini düzenle">${ayKisa(p.bas)}${ei>si?'–'+ayKisa(p.bit):''}</button>`:''}</div>`});})});

 <div class="tl"><div class="tl-scroll">${grid}</div></div><div class="plist">${mobile}</div>

 <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-act="tab" data-tab="takip">${I.chart} Takibe geç</button><button class="btn pri" data-act="tab" data-tab="belge">Belgeyi hazırla</button></div>`}

/* ---------- takip ---------- */
function vTakip(r){const items=planli(r);if(!items.length)return bosPlan;const {plan,kaz}=sayim(r);
 return `<div class="section-h" style="margin-top:8px"><h2>Uygulama takibi</h2><span class="muted small">${kaz}/${plan} amaç kazanıldı</span></div>
 <p class="muted small" style="margin:0 0 6px">Her oturumda öğretimsel amaçlara öğrencinin tepkisini işaretle. Ölçüt karşılanınca uygulama haber verir.</p>
 <div class="kodlar">${KODLAR.map(([k,l])=>`<span><i class="k k${kc(k)}">${kg(k)}</i>${l}</span>`).join('')}</div>
 <div class="tgrid">${items.map(({k})=>takipKart(r,k)).join('')}</div>`}
function takipKart(r,k){const t=tk(r,k.kod);const p=r.plan[k.kod];const du=durum(r,k);const [dl,dc]=DURUM[du];const h=hedefler(k);const son=t.oturumlar.slice(-12);const ok=du!=='kazanildi'&&olcutKarsilandi(r,k);const K=esc(k.kod);
 return `<article class="tcard${du==='kazanildi'?' done':''}"><header><div class="grow"><div class="code">${K}</div><h3>${esc(k.ad)}</h3><div class="small muted">${[aralik(p),p.olcut?'ölçüt '+p.olcut:'',t.oturumlar.length+' oturum'].filter(Boolean).map(esc).join(' · ')}</div></div><span class="dpill" style="--c:var(--${dc})">${dl}</span></header>
 ${son.length?`<div class="spark" role="group" aria-label="Oturumlar">${son.map(o=>{const v=oturumOran(k,o)||0;return `<button data-act="oturum" data-kod="${K}" data-sid="${o.id}" title="${tarihK(o.t)}: %${Math.round(v*100)} bağımsız"><i style="height:${Math.max(8,Math.round(v*100))}%"></i><span>${tarihK(o.t)}</span></button>`}).join('')}</div>`:'<p class="small muted" style="margin:10px 0">Henüz oturum kaydı yok.</p>'}
 <ul class="hlist">${h.map((x,i)=>{const vals=t.oturumlar.map(o=>o.r[i]).filter(Boolean).slice(-6);return `<li><span class="htext">${esc(x)}</span><span class="dots">${vals.map(v=>`<i class="k k${kc(v)}">${kg(v)}</i>`).join('')||'<span class="muted small">—</span>'}</span></li>`}).join('')}</ul>
 ${ok?`<div class="note" style="margin-top:10px;align-items:center;flex-wrap:wrap"><span class="grow">Ölçüt karşılandı: son ${olcutSayi(p)[1]} denemede ${esc(p.olcut)} bağımsız.</span><button class="btn small pri" data-act="kazan" data-kod="${K}" style="min-height:36px">Kazanıldı olarak işaretle</button></div>`:''}
 <footer><button class="btn pri" data-act="oturum" data-kod="${K}">${I.plus} Oturum ekle</button><span class="grow"></span>${du==='kazanildi'?`<button class="btn ghost small" data-act="durum" data-kod="${K}" data-v="devam">Çalışmaya geri al</button>`:`<button class="btn ghost small" data-act="kazan" data-kod="${K}">Kazanıldı</button>`}</footer></article>`}

/* ---------- panel (sheet) ---------- */
function renderSheet(){
 document.querySelectorAll('.scrim,.sheet').forEach(e=>e.remove());
 const sh=UI.sheet;if(!sh)return;
 let inner='';
 if(sh.type==='kvkk')inner=`<div class="sheet-h"><div class="grow"><h3 id="sh-t">Aydınlatma metni</h3></div><button class="iconbtn" data-act="close" aria-label="Kapat">${I.x}</button></div><div class="sheet-b kvkk">${KVKK_METNI}</div><div class="sheet-f"><button class="btn pri" data-act="close">Kapat</button></div>`;
 else{const r=rec();if(!r){UI.sheet=null;return}const f=allKda(dersOf(r)).find(x=>x.k.kod===sh.kod);if(!f){UI.sheet=null;return}
  inner=sh.type==='oturum'?sheetOturum(r,f.k):sheetPlan(r,f.u,f.k)}
 document.body.insertAdjacentHTML('beforeend',`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">${inner}</div>`);
 aiButtons();
}
function sheetPlan(r,u,k){const p=r.plan[k.kod];const aylar=yilAylari(stu(r).yil);const si=aylar.indexOf(p.bas),ei=aylar.indexOf(p.bit);
 const grp=(key,title,all)=>`<div class="grp"><h4>${title}</h4><div class="chips">${(p[key]||[]).map((x,i)=>`<span class="chip">${esc(x)}<button data-act="chip-del" data-k="${key}" data-i="${i}" aria-label="${esc(x)} kaldır">${I.x}</button></span>`).join('')||'<span class="muted small">Henüz seçilmedi.</span>'}</div>
  <div class="picker"><input placeholder="Ara ya da yeni yazıp Enter'a bas" data-pick="${key}" aria-label="${title} ekle"><div class="opts">${all.filter(x=>!(p[key]||[]).includes(x)).map(x=>`<button data-act="chip-add" data-k="${key}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div></div>`;
 return `<div class="sheet-h"><div class="grow"><div class="muted small">${esc(k.kod)} · ${esc(u.ad)}</div><h3 id="sh-t">${esc(k.ad)}</h3></div><button class="iconbtn" data-act="close" aria-label="Kapat">${I.x}</button></div>
  <div class="sheet-b">
   ${k.oa?.length?`<details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:500">${k.oa.length} öğretimsel amaç</summary><ul class="small muted" style="margin:8px 0 0;padding-left:18px">${k.oa.map((x,i)=>`<li>${esc(oaF(x,i))}</li>`).join('')}</ul></details>`:''}
   <div class="grp"><h4>Süre</h4><p class="small muted" style="margin:0 0 8px">Önce başlangıç, sonra bitiş ayına dokun.</p>
    <div class="mgrid">${aylar.map((a,i)=>`<button class="${i===si||i===ei?'edge':(i>si&&i<ei?'in':'')}" data-act="ay" data-v="${a}" aria-label="${ayUzun(a)}">${ayKisa(a)}</button>`).join('')}</div>
    <p class="small" style="margin:8px 0 0">${p.bas?aralik(p):'Tarih seçilmedi'}</p></div>
   <div class="grp"><h4>Başarı ölçütü</h4><div class="seg" role="group">${OLCUT.map(o=>`<button aria-pressed="${p.olcut===o}" data-act="olcut" data-v="${o}">${o}</button>`).join('')}</div></div>
   ${grp('y','Öğretim yöntemleri',YONTEM)}${grp('m','Araç-gereç',MATERYAL)}${grp('d','Değerlendirme',DEGER)}
   <div class="grp"><h4>Dersin işlenişi</h4><p class="small muted" style="margin:0 0 8px">BÖP'te görünür. Boş bırakılırsa seçimlerinden otomatik yazılır.</p>
    <textarea class="in" data-islenis rows="6" placeholder="${esc(islenisUret(k,p))}">${esc(p.islenis||'')}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="islenis-sablon">${I.pen} Şablondan yaz</button><button class="btn aibtn" data-act="islenis-ai" id="ai-isl-btn" hidden>${I.spark} Yapay zekâyla yaz</button></div></div>
  </div>
  <div class="sheet-f"><button class="btn" data-act="kopyala">${I.copy} Diğer amaçlara da uygula</button><button class="btn pri" data-act="close">Tamam</button></div>`}
function sheetOturum(r,k){const d=UI.draft;const h=hedefler(k);const t=tk(r,k.kod);
 return `<div class="sheet-h"><div class="grow"><div class="muted small">${esc(k.kod)} · ${d.id?'Oturumu düzenle':'Yeni oturum'}</div><h3 id="sh-t">${esc(k.ad)}</h3></div><button class="iconbtn" data-act="close" aria-label="Kapat">${I.x}</button></div>
 <div class="sheet-b">
  <div class="grp"><h4><label for="o-t">Tarih</label></h4><input class="in" id="o-t" type="date" value="${esc(d.t)}" data-draft="t" style="max-width:220px"></div>
  <div class="grp"><h4>Tepkiler</h4><div class="row small" style="gap:6px;margin-bottom:10px"><span class="muted">Hepsine:</span>${KODLAR.map(([c])=>`<button class="kbtn k${kc(c)}" data-act="dall" data-v="${c}" aria-label="Hepsine ${c}">${kg(c)}</button>`).join('')}</div>
   <ol class="olist">${h.map((x,i)=>`<li><span>${esc(x)}</span><span class="kseg" role="radiogroup" aria-label="Tepki">${KODLAR.map(([c,l])=>`<button class="kbtn k${kc(c)}" role="radio" aria-checked="${d.r[i]===c}" aria-label="${l}" title="${l}" data-act="dcode" data-i="${i}" data-v="${c}">${kg(c)}</button>`).join('')}</span></li>`).join('')}</ol></div>
  <div class="grp"><h4><label for="o-not">Not</label></h4><textarea class="in" id="o-not" rows="3" data-draft="not" placeholder="İsteğe bağlı: kullanılan pekiştireç, dikkat durumu vb.">${esc(d.not)}</textarea></div>
  ${t.oturumlar.length?`<p class="small muted" style="margin:0">Bu amaç için ${t.oturumlar.length} oturum kayıtlı. Geçmiş bir oturumu düzenlemek için takip kartındaki çubuğuna dokun.</p>`:''}
 </div>
 <div class="sheet-f">${d.id?`<button class="btn danger" data-act="odel">${I.trash} Sil</button>`:''}<span class="grow"></span><button class="btn" data-act="close">Vazgeç</button><button class="btn pri" data-act="osave">Kaydet</button></div>`}

/* ---------- belgeler: ders ---------- */
function vBelge(r){
 const items=planli(r);const s=stu(r);
 const tabs=[['bep','BEP'],['bop','BÖP'],['form','Değerlendirme formu'],['kaba','Kaba değerlendirme']];
 if(!items.length&&UI.docTab!=='kaba')UI.docTab='kaba';
 const eks=items.filter(({k})=>eksik(r.plan[k.kod]).length).length;
 const edited=r.docEdits[UI.docTab];
 return `<div class="section-h" style="margin-top:8px"><h2>Belge</h2></div>
 ${eks&&UI.docTab!=='kaba'?`<div class="note">${eks} amaçta eksik bilgi var; belgede boş görünecek. <button class="linkbtn" data-act="tab" data-tab="plan">Plana dön</button></div>`:''}
 <div class="docbar"><div class="seg" role="tablist">${tabs.map(([k,l])=>`<button aria-pressed="${UI.docTab===k}" data-act="doctab" data-v="${k}" ${!items.length&&k!=='kaba'?'disabled':''}>${l}</button>`).join('')}</div><span class="grow"></span>
  ${UI.docTab==='bep'?`<label class="row small" style="gap:8px"><span class="switch"><input type="checkbox" ${UI.withOA?'checked':''} data-act-change="withoa"></span>Öğretimsel amaçlar</label>`:''}
  ${UI.docTab==='kaba'?`<label class="row small" style="gap:8px"><span class="switch"><input type="checkbox" ${UI.kabaDolu?'checked':''} data-act-change="kabadolu"></span>İşaretli (boş form için kapat)</label>`:''}</div>
 ${docBar(edited)}${docStage(edited||docHTML(r,UI.docTab))}`}
function docBar(edited){return `<div class="docbar"><button class="btn ${UI.editing?'pri':''}" data-act="editdoc">${I.pen} ${UI.editing?'Düzenlemeyi bitir':'Belgede düzenle'}</button><button class="btn" data-act="print">${I.print} PDF olarak kaydet</button><button class="btn" data-act="dlhtml" id="dl-btn" hidden>${I.dl} HTML indir</button>${edited?`<button class="btn ghost" data-act="resetdoc">Elle yapılan değişiklikleri at</button>`:''}</div>${edited?'<p class="small muted" style="margin:-6px 0 10px">Bu belge elle düzenlendi. Veriler değişirse belge yeniden oluşturulur.</p>':''}`}
function docStage(html){return `<div class="docstage ${UI.editing?'editing':''}"><div class="doc" id="docroot" ${UI.editing?'contenteditable="true" spellcheck="true"':''}>${html}</div></div>`}
function docHTML(r,t){return t==='bep'?docBEP(r):t==='bop'?docBOP(r):t==='form'?docForm(r):docKaba(r,UI.kabaDolu)}
function baslik(s,d,alt){return `<div class="dh"><div class="s">${esc(s.okul||'')}</div><div class="s">${esc(s.yil)} Eğitim Öğretim Yılı</div><h1>${d?esc(d.ad)+' ('+esc(d.sinif)+') ':''}${alt}</h1></div>
 <div class="info"><div><b>Öğrenci</b>${esc(s.ad)}</div><div><b>Sınıf</b>${esc(s.sinif)}</div><div><b>Numara</b>${esc(s.no)}</div><div><b>Hazırlayan</b>${esc(s.ogretmen)}</div></div>`}
function aralik(p,sep=' – '){if(!p?.bas)return'';return p.bit&&p.bit!==p.bas?ayUzun(p.bas)+sep+ayUzun(p.bit):ayUzun(p.bas)}
function takvimYazi(s,p){if(s.takvim==='bitis')return ayUzun(p.bit);if(s.takvim==='hafta')return `Her ${s.takvimGun}`;return s.takvim?TAKVIM[s.takvim]:''}
function imzalar(s,ek){const on=IMZA.filter(([k])=>s.imza[k].on);const list=on.map(([k,l])=>[s.imza[k].ad,l]);if(ek)list.push(...ek);if(!list.length)return'';return `<div class="signs">${list.map(([a,l])=>`<div>${esc(a)||'&nbsp;'}<b>${esc(l)}</b></div>`).join('')}</div>`}
function perfListeler(r){const d=dersOf(r);const bag=[],cog=[];allKda(d).forEach(({k})=>{if(r.perf[k.kod]===3)bag.push(k);if(r.perf[k.kod]===2)cog.push(k)});return{bag,cog,dest:planli(r).map(x=>x.k)}}
function docBEP(r){
 const s=stu(r),d=dersOf(r);const items=planli(r);const oa=UI.withOA;const {bag,cog,dest}=perfListeler(r);
 let rows='';d.udalar.forEach(u=>{const ks=items.filter(x=>x.u===u);if(!ks.length)return;
  rows+=`<tr class="uda-row"><td colspan="${oa?9:8}">Uzun dönemli amaç: ${esc(u.ad)}</td></tr>`;
  ks.forEach(({k})=>{const p=r.plan[k.kod];rows+=`<tr><td><b>${esc(k.kod)}</b> ${esc(k.ad)}</td>${oa?`<td><ul class="oa">${(k.oa||[]).map((x,i)=>`<li>${esc(oaF(x,i))}</li>`).join('')}</ul></td>`:''}<td class="c">${esc(p.olcut||'')}</td><td>${esc((p.y||[]).join(', '))}</td><td>${esc((p.m||[]).join(', '))}</td><td class="c">${aralik(p,'<br>')}</td><td>${esc((p.d||[]).join(', '))}</td><td class="c">${esc(takvimYazi(s,p))}</td><td class="c">${r.takip[k.kod]?.durum==='kazanildi'?'+':''}</td></tr>`})});
 const col=oa?['20%','20%','7%','13%','11%','8%','10%','6%','5%']:['26%','8%','17%','15%','9%','13%','7%','5%'];
 return `<div class="page">${baslik(s,d,'Bireyselleştirilmiş Eğitim Programı')}
 <h2>Eğitsel performans</h2>
 <div class="perf"><div><h3>Bağımsız yapabildikleri</h3><ul>${bag.map(k=>`<li>${esc(k.kod)} ${esc(k.ad)}</li>`).join('')||'<li>—</li>'}</ul></div>
  <div><h3>Çoğunlukla yapabildikleri</h3><ul>${cog.map(k=>`<li>${esc(k.kod)} ${esc(k.ad)}</li>`).join('')||'<li>—</li>'}</ul></div></div>
 <div class="perf" style="margin-top:8px"><div style="grid-column:1/-1"><h3>Desteklenmesi gerekenler</h3><ul>${dest.map(k=>`<li>${esc(k.kod)} ${esc(k.ad)} <i>(${LVL[r.perf[k.kod]].toLocaleLowerCase('tr')})</i></li>`).join('')}</ul></div></div>
 ${r.perfNot?`<p style="margin:8px 0 0">${esc(r.perfNot)}</p>`:''}
 <h2>Plan</h2>
 <table><colgroup>${col.map(w=>`<col style="width:${w}">`).join('')}</colgroup>
 <thead><tr><th>Kısa dönemli amaç</th>${oa?'<th>Öğretimsel amaçlar</th>':''}<th>Ölçüt</th><th>Yöntem ve teknikler</th><th>Araç-gereç</th><th>Başlama – bitiş</th><th>Değerlendirme</th><th>Değ. tarihi</th><th>Sonuç (+/−)</th></tr></thead>
 <tbody>${rows}</tbody></table>
 ${s.ortam.length?`<h2>Eğitim ortamı düzenlemeleri</h2><ul>${s.ortam.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}
 ${imzalar(s)}</div>`}
function docBOP(r){
 const s=stu(r),d=dersOf(r);const items=planli(r);
 const perf=allKda(d).filter(({k})=>r.perf[k.kod]>=2).map(({k})=>`${k.kod} ${k.ad}`);
 return items.map(({u,k})=>{const p=r.plan[k.kod];return `<div class="page pb">${baslik(s,d,'Bireyselleştirilmiş Öğretim Planı')}
 <div class="kv">
  <div>Eğitsel performans</div><div>${perf.length?perf.map(esc).join('<br>'):'—'}</div>
  <div>Uzun dönemli amaç</div><div>${esc(u.ad)}</div>
  <div>Kısa dönemli amaç</div><div><b>${esc(k.kod)}</b> ${esc(k.ad)}</div>
  <div>Öğretimsel amaçlar</div><div>${(k.oa||[]).map((x,j)=>esc(oaF(x,j))).join('<br>')||'—'}</div>
  <div>Süre</div><div>${aralik(p)}</div><div>Ölçüt</div><div>${esc(p.olcut||'')}</div>
  <div>Yöntem ve teknikler</div><div>${esc((p.y||[]).join(', '))}</div><div>Araç-gereç</div><div>${esc((p.m||[]).join(', '))}</div>
  <div>Dersin işlenişi</div><div>${esc(p.islenis||islenisUret(k,p))}</div>
  <div>Değerlendirme</div><div>${esc((p.d||[]).join(', '))}${takvimYazi(s,p)?` · ${esc(takvimYazi(s,p))}`:''}</div>
 </div></div>`}).join('');
}
function docForm(r){
 const s=stu(r),d=dersOf(r);const items=planli(r);
 return items.map(({k})=>{const p=r.plan[k.kod];const h=hedefler(k);const os=(r.takip[k.kod]?.oturumlar||[]);const ilk8=os.slice(0,8);const son=os.length>8?os[os.length-1]:null;
  const hucre=(o,i)=>`<td class="c">${o&&o.r[i]?kg(o.r[i]):''}</td>`;
  return `<div class="page pb">${baslik(s,d,'Değerlendirme Formu')}
 <div class="kv" style="margin-bottom:8px"><div>Kısa dönemli amaç</div><div><b>${esc(k.kod)}</b> ${esc(k.ad)}</div><div>Süre · ölçüt</div><div>${aralik(p)} · ${esc(p.olcut||'')}</div><div>Araç-gereç</div><div>${esc((p.m||[]).join(', '))}</div></div>
 <table class="fgrid"><colgroup><col style="width:34%"><col><col><col><col><col><col><col><col><col><col></colgroup>
 <thead><tr><th>Öğretimsel amaç</th><th>Başlama</th>${[1,2,3,4,5,6,7,8].map(n=>`<th class="c">${n}. oturum</th>`).join('')}<th>Son</th></tr>
 <tr><th>Tarih</th><td></td>${[0,1,2,3,4,5,6,7].map(i=>`<td class="c" style="font-size:7.5pt">${ilk8[i]?tarihK(ilk8[i].t):''}</td>`).join('')}<td class="c" style="font-size:7.5pt">${son?tarihK(son.t):''}</td></tr></thead>
 <tbody>${h.map((x,i)=>`<tr><td>${esc(x)}</td><td></td>${[0,1,2,3,4,5,6,7].map(j=>hucre(ilk8[j],i)).join('')}${hucre(son,i)}</tr>`).join('')}</tbody></table>
 <p class="legend"><b>Kodlar:</b> + bağımsız &nbsp; S sözel ipucuyla &nbsp; M model olmayla &nbsp; F fiziksel yardımla &nbsp; − tepki yok / yanlış${r.takip[k.kod]?.durum==='kazanildi'?` &nbsp; · &nbsp; <b>Amaç kazanıldı${r.takip[k.kod].kazanTarih?' ('+tarihU(r.takip[k.kod].kazanTarih)+')':''}.</b>`:''}</p></div>`}).join('');
}
function docKaba(r,dolu){const s=stu(r),d=dersOf(r);const box=v=>v?'☒':'☐';
 let rows='';d.udalar.forEach(u=>{rows+=`<tr class="uda-row"><td colspan="6">Uzun dönemli amaç: ${esc(u.ad)}</td></tr>`;
  u.kdalar.forEach(k=>{const l=dolu?r.perf[k.kod]:null;rows+=`<tr><td><b>${esc(k.kod)}</b> ${esc(k.ad)}</td>${[0,1,2,3].map(i=>`<td class="c" style="font-size:12pt">${box(l===i)}</td>`).join('')}<td></td></tr>`})});
 return `<div class="page">${baslik(s,d,'Kaba Değerlendirme Formu')}
 <table><colgroup><col style="width:46%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:9%"><col style="width:17%"></colgroup>
 <thead><tr><th>Kısa dönemli amaç</th><th class="c">Hiç yapamıyor</th><th class="c">Yardımla kısmen</th><th class="c">Çoğunlukla yapıyor</th><th class="c">Bağımsız yapıyor</th><th>Açıklama</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="kv" style="margin-top:12px"><div>Değerlendirme tarihi</div><div>${dolu?tarihU(bugun()):''}&nbsp;</div><div>Değerlendiren</div><div>${esc(s.ogretmen)}&nbsp;</div></div></div>`}

/* ---------- belgeler: öğrenci dosyası ---------- */
const PAKET=[['kapak','Dosya kapağı'],['bilgi','Öğrenci bilgi formu'],['perf','Eğitsel performans formu'],['kurul','BEP geliştirme birimi tutanağı'],['bep','Tüm derslerin BEP planları'],['bop','Tüm derslerin BÖP\'leri'],['form','Değerlendirme formları'],['kaba','Kaba değerlendirme formları'],['veli','Veli bilgilendirme mektubu']];

/* ---------- dönem sonu ---------- */
function donemKesim(s){const y=parseInt(s.yil)||2026;return UI.donem==='1'?`${y+1}-01-31`:null}
function vYilsonu(s){const rs=recsOf(s).filter(r=>dersOf(r)&&planli(r).length);const key='yilsonu-'+UI.donem;const edited=s.docEdits[key];
 let top={kazanildi:0,kismen:0,devam:0,baslamadi:0,birakildi:0};const cut=donemKesim(s);rs.forEach(r=>planli(r).forEach(({k})=>top[durum(r,k,cut)]++));const n=Object.values(top).reduce((a,b)=>a+b,0);
 return `<div class="section-h" style="margin-top:8px"><h2>Dönem sonu değerlendirmesi</h2><div class="seg" role="group"><button aria-pressed="${UI.donem==='1'}" data-act="donem" data-v="1">1. dönem</button><button aria-pressed="${UI.donem==='yil'}" data-act="donem" data-v="yil">Yıl sonu</button></div></div>

 <p class="small muted">Durumlar takip kayıtlarından hesaplanır: son üç oturumda bağımsız tepki oranı %50 ve üstüyse "kısmen kazanıldı" sayılır. ${n} amacın ${top.kazanildi} tanesi kazanıldı.</p>
 ${!s.arsiv&&UI.donem==='yil'?`<div class="note" style="align-items:center;flex-wrap:wrap;margin-bottom:14px"><span class="grow">Yıl bitince öğrenciyi yeni eğitim yılına taşı: kazanılan amaçlar performansa, kazanılmayanlar yeni plana aktarılır.</span><button class="btn pri small" data-act="yeniyil" style="min-height:38px">${I.flag} Yeni yıla taşı</button></div>`:''}
 ${docBar(edited)}${docStage(edited||docYilsonu(s,cut))}`:'<div class="empty"><p>Rapor için en az bir derste plana alınmış amaç olmalı.</p></div>'}`}
function docYilsonu(s,cut){const rs=recsOf(s).filter(r=>dersOf(r)&&planli(r).length);const bas=UI.donem==='1'?'1. Dönem BEP Değerlendirme Raporu':'Yıl Sonu BEP Değerlendirme Raporu';
 return `<div class="page">${baslik(s,null,bas)}${rs.map(r=>{const d=dersOf(r);const items=planli(r);const say={};items.forEach(({k})=>{const x=durum(r,k,cut);say[x]=(say[x]||0)+1});
  return `<h2>${esc(d.ad)} (${esc(d.sinif)})</h2><table><colgroup><col style="width:46%"><col style="width:10%"><col style="width:10%"><col style="width:14%"><col style="width:20%"></colgroup>
  <thead><tr><th>Kısa dönemli amaç</th><th class="c">Ölçüt</th><th class="c">Oturum</th><th class="c">Son bağımsızlık</th><th>Durum</th></tr></thead><tbody>
  ${items.map(({k})=>{const os=oturumlar(r,k.kod,cut);const o=sonOran(r,k,cut);return `<tr><td><b>${esc(k.kod)}</b> ${esc(k.ad)}</td><td class="c">${esc(r.plan[k.kod].olcut||'')}</td><td class="c">${os.length}</td><td class="c">${o==null?'—':'%'+Math.round(o*100)}</td><td>${DURUM[durum(r,k,cut)][0]}</td></tr>`}).join('')}</tbody></table>
  <p class="legend">${items.length} amaçtan ${say.kazanildi||0} tanesi kazanıldı, ${say.kismen||0} tanesi kısmen kazanıldı, ${(say.devam||0)+(say.baslamadi||0)} tanesinde çalışma sürüyor.</p>`}).join('')}
 <h2>Genel değerlendirme ve öneriler</h2><p>${UI.donem==='1'?'Kazanılamayan amaçların çalışmalarına ikinci dönemde devam edilecektir. Ölçütü karşılanan amaçlar eğitsel performansa aktarılarak yeni amaçlara geçilecektir.':'Kazanılan amaçlar bir sonraki eğitim öğretim yılında öğrencinin eğitsel performansına eklenecek; kazanılamayan amaçlar yeni BEP\'te yeniden planlanacaktır.'}</p>
 ${imzalar(s,[[s.ogretmen,'Hazırlayan öğretmen']])}</div>`}
function sinifArtir(x){return String(x||'').replace(/^(\s*)(\d)/,(m,a,b)=>a+Math.min(8,+b+1))}
function yeniYil(s){const y1=parseInt(s.yil)||parseInt(varsayilanYil());const yil=`${y1+1}-${y1+2}`;
 const n=newStudent({ad:s.ad,no:s.no,sinif:sinifArtir(s.sinif),okul:s.okul,ogretmen:s.ogretmen,yil,dogum:s.dogum,destek:s.destek,veliAd:s.veliAd,veliTel:s.veliTel,imza:clone(s.imza),ortam:[...s.ortam],takvim:s.takvim,takvimGun:s.takvimGun,oncekiId:s.id});
 S.students.push(n);
 recsOf(s).forEach(r=>{const d=dersOf(r);const nr={id:uid(),studentId:n.id,dersId:r.dersId,perf:{},plan:{},perfNot:'',takip:{},docEdits:{},created:Date.now(),updated:Date.now()};
  allKda(d).forEach(({k})=>{const l=r.perf[k.kod];if(l==null)return;const pl=r.plan[k.kod];
   if(pl?.on&&(l===0||l===1)){const du=durum(r,k);if(du==='kazanildi')nr.perf[k.kod]=3;else{nr.perf[k.kod]=du==='kismen'?1:l;nr.plan[k.kod]={...clone(pl),on:true,bas:'',bit:''}}}
   else nr.perf[k.kod]=l});
  S.records.push(nr)});
 s.arsiv=true;s.updated=Date.now();save();return n}

/* ---------- şablon metinler ---------- */
function sablonPerf(r){const {bag,cog,dest}=perfListeler(r);const d=dersOf(r);const t=[];
 if(bag.length)t.push(`${d.ad} dersinde ${listeYazK(bag.map(k=>kucuk(k.ad)))} becerilerini bağımsız olarak yerine getirmektedir.`);
 if(cog.length)t.push(`${listeYazK(cog.map(k=>kucuk(k.ad)))} becerilerini çoğunlukla yapabilmektedir.`);
 if(dest.length)t.push(`${listeYazK(dest.map(k=>kucuk(k.ad)))} becerilerinde desteğe ihtiyaç duymaktadır.`);
 return t.join(' ')||`${d.ad} dersinde henüz performans değerlendirmesi yapılmamıştır.`}
function sablonKurul(s){const rs=recsOf(s).filter(r=>dersOf(r));const dersler=listeYaz(rs.map(r=>dersOf(r).ad));
 const m=[`${s.ad||'Öğrencinin'} ${dersler} ${rs.length>1?'derslerindeki':'dersindeki'} eğitsel performansı kaba değerlendirme sonuçlarına göre görüşülmüş; performansına uygun uzun ve kısa dönemli amaçlar belirlenerek bireyselleştirilmiş eğitim programının hazırlanmasına karar verilmiştir.`,
  s.ortam.length?`Eğitim ortamında şu düzenlemelerin yapılmasına karar verilmiştir: ${s.ortam.map(kucuk).join('; ')}.`:'Eğitim ortamında özel bir düzenlemeye ihtiyaç görülmemiştir.',
  `BEP'te yer alan amaçların ${s.takvim==='hafta'?'her hafta '+s.takvimGun+' günü':s.takvim==='bitis'?'her amacın bitiş tarihinde':s.takvim==='ay'?'her ayın son iş gününde':'belirlenen zamanlarda'} değerlendirilmesine, sonuçların veliyle paylaşılmasına karar verilmiştir.`,
  'Programın eğitim öğretim yılı boyunca uygulanmasına, dönem sonlarında birim tarafından gözden geçirilmesine karar verilmiştir.'];
 return m.map((x,i)=>`${i+1}. ${x}`).join('\n')}
function sablonVeli(s){const rs=recsOf(s).filter(r=>dersOf(r));
 return `Çocuğunuz ${s.ad||''} için ${s.yil} eğitim öğretim yılında ${listeYaz(rs.map(r=>dersOf(r).ad))} ${rs.length>1?'derslerinde':'dersinde'} Bireyselleştirilmiş Eğitim Programı (BEP) hazırlanmıştır. Bu program, çocuğunuzun bugün neleri yapabildiğini ve hangi becerilerde desteğe ihtiyaç duyduğunu esas alır.

Yıl boyunca her amaç için düzenli çalışmalar yapılacak, çocuğunuzun ilerlemesi kaydedilecek ve ${s.takvim==='ay'?'her ay sonunda':'düzenli aralıklarla'} değerlendirilecektir. Evde kısa ve düzenli tekrarlar, okulda kazanılan becerilerin kalıcı olmasını çok destekler.

Programla ilgili sorularınız için benimle her zaman iletişime geçebilirsiniz. İş birliğiniz için teşekkür ederim.`}

function parseBank(txt){
 const out=[];let d=null,u=null,k=null;
 txt.split(/\r?\n/).forEach(raw=>{const l=raw.trim();if(!l)return;let m;
  if(m=l.match(/^#\s+(?!#)(.+)$/)){const [ad,sinif,program]=m[1].split('|').map(s=>s.trim());d={id:uid(),ad,sinif:sinif||'',program:program||'',kademe:'',udalar:[]};out.push(d);u=null;k=null;return}
  if(m=l.match(/^##\s+(.+)$/)){if(!d){d={id:uid(),ad:'Adsız ders',sinif:'',program:'',udalar:[]};out.push(d)}u={id:uid(),ad:m[1],kdalar:[]};d.udalar.push(u);k=null;return}
  if(m=l.match(/^[-•]?\s*((?:[A-ZÇĞİÖŞÜ]{1,6}\.?){1,3}\d+(?:\.\d+){1,3})\.?\s+(.+)$/)){if(!u)return;k={kod:m[1],ad:m[2],oa:[]};u.kdalar.push(k);return}
  if(/^[a-zçğıöşü]\)\s/.test(l)){if(k)l.split(/\s(?=[a-zçğıöşü]\)\s)/).forEach(p=>k.oa.push(p.trim()));return}
  if(k&&k.oa.length)k.oa[k.oa.length-1]+=' '+l;
 });
 return out.filter(d=>d.udalar.some(u=>u.kdalar.length));
}

async function aiYaz(kind,rid,btn){
 const s=curStu();let ta,prompt,saveFn;
 if(kind==='perf'){const r=S.records.find(x=>x.id===rid);const {bag,cog,dest}=perfListeler(r);ta=document.querySelector(`[data-perfnot="${rid}"]`);
  prompt=`Bir BEP dosyasındaki "Eğitsel performans" bölümü için ${dersOf(r).ad} (${dersOf(r).sinif}) dersine ait bir paragraf yaz.
Bağımsız yapabildikleri: ${bag.map(k=>k.ad).join('; ')||'yok'}.
Çoğunlukla yapabildikleri: ${cog.map(k=>k.ad).join('; ')||'yok'}.
Desteğe ihtiyaç duyduğu beceriler: ${dest.map(k=>k.ad).join('; ')||'yok'}.
Kurallar: 70-110 sözcük, tek paragraf, öğrencinin adını kullanma ("öğrenci" de), olumlu ve nesnel bir dil, önce güçlü yönler sonra desteklenecek alanlar. Tanı ya da etiket kullanma. Yalnızca paragrafı yaz.`;
  saveFn=v=>{r.perfNot=v;touch(r)}}
 else if(kind==='kurul'){ta=document.querySelector('[data-kurul="karar"]');
  prompt=`Bir ilkokulda BEP geliştirme birimi toplantı tutanağının "Görüşmeler ve kararlar" bölümünü yaz.
Öğrencinin BEP hazırlanan dersleri: ${recsOf(s).map(r=>dersOf(r)?.ad).filter(Boolean).join(', ')}.
Eğitim ortamı düzenlemeleri: ${s.ortam.join('; ')||'yok'}. Değerlendirme takvimi: ${TAKVIM[s.takvim]||'belirtilmedi'}.
Kurallar: 4-6 numaralı madde, her biri tek cümle, resmî tutanak dili ("…karar verilmiştir"). Öğrencinin adını ve tanısını yazma. Yalnızca maddeleri yaz.`;
  saveFn=v=>{s.kurul.karar=v;touchS(s)}}
 else {ta=document.querySelector('[data-veli]');
  prompt=`Özel eğitim desteği alan bir ilkokul öğrencisinin velisine, çocuğu için Bireyselleştirilmiş Eğitim Programı hazırlandığını bildiren kısa bir mektup gövdesi yaz.
Dersler: ${recsOf(s).map(r=>dersOf(r)?.ad).filter(Boolean).join(', ')}. Eğitim yılı: ${s.yil}.
Kurallar: 3 kısa paragraf, sıcak ama resmî, sade Türkçe; programın amacı, yıl boyunca nasıl izleneceği, evde nasıl destek olunabileceği ve iletişim daveti. Hitap ve imza yazma; yalnızca gövdeyi yaz.`;
  saveFn=v=>{s.veliMektup=v;touchS(s)}}
 btn.disabled=true;const eski=ta.value;ta.value='Düşünüyor…';
 try{await SAMPLE(prompt,{modelTier:'default',onText:({text})=>{ta.value=text}});saveFn(ta.value.trim());toast('Metin yazıldı.')}
 catch(e){ta.value=e?.text||eski;toast(aiHata(e))}finally{btn.disabled=false}
}

function genDoc(){if(UI.view==='rec')return docHTML(rec(),UI.docTab);const s=curStu();return UI.stuTab==='yilsonu'?docYilsonu(s,donemKesim(s)):paket(s)}
function currentDoc(){const t=editTarget();return (t&&t[0][t[1]])||genDoc()}
function saveEditing(){if(!UI.editing)return;const t=editTarget();const el=document.getElementById('docroot');if(t&&el){t[0][t[1]]=el.innerHTML;save()}}
function belgeAdi(){const s=UI.view==='rec'?stu(rec()):curStu();const ad=(s?.ad||'ogrenci').toLocaleLowerCase('tr').replace(/[^a-z0-9çğıöşü]+/g,'-').replace(/^-|-$/g,'');const ek=UI.view==='rec'?(dersOf(rec())?.ad||'ders')+'-'+UI.docTab:UI.stuTab==='yilsonu'?'donem-sonu':'bep-dosyasi';return `${ad}-${ek.toLocaleLowerCase('tr').replace(/[^a-z0-9çğıöşü]+/g,'-')}.html`}
function standalone(title,html){return `<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)}</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E8EFEC;font-family:Arial,sans-serif}.bar{position:sticky;top:0;background:#12302B;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:2;font-size:14px}.bar button{background:#fff;color:#12302B;border:0;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}main{padding:20px;overflow-x:auto}main:focus{outline:none}@media print{.bar{display:none}body{background:#fff}main{padding:0}}

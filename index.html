) Konuşma sırasında dinleyiciler ile göz teması kurar.","c) İletişim sırasında uygun zamanda söz alır.","ç) Konuşmalarında selamlaşma ve hitap ile ilgili ifadeler kullanır."]},{"kod":"T.K.1.2","ad":"Konuşmalarında içerik oluşturabilme","oa":["a) Ön bilgilerinden hareketle dinlediği sesin içinde geçtiği sözcükler hakkında konuşur.","b) Dinlediği/izlediği metni anlatır.","c) Kendisi ve ailesi hakkında konuşmalar yapar.","ç) Dinlediklerini/izlediklerini ifade ederken ön bilgilerini kullanır.","d) Görselden/görsellerden hareketle dinleyeceği/izleyeceği metin hakkında tahminde bulunur.","e) Konuşmalarında geçen nesneleri fiziksel özelliklerine göre karşılaştırır.","f) Konuşmalarında nesneleri fiziksel özelliklerine göre sınıflandırır.","g) Dinlediklerini, izlediklerini veya okuduklarını kendi cümleleriyle ifade eder.","ğ) Sözlü iletişimde kabul etmediği konulara ilişkin önerilerde bulunur.","h) İlgi alanına yönelik seçtiği bir konu hakkında konuşur.","ı) Konuşmalarını desteklemek için görseller kullanır.","i) Dinleyicilere ne anlatacağını dikkate alarak konuşur.","j) Konuşmalarında benzetmelere yer verir."]},{"kod":"T.K.1.3","ad":"Konuşma kurallarını uygulayabilme","oa":["a) Öğrendiği ses, hece, sözcük veya cümleleri işitilebilir bir ses düzeyinde söyler.","b) Konuşmalarında konuşma hızını ayarlar.","c) Dinlediğini/izlediğini telaffuza dikkat ederek anlatır.","d) Konuşmalarında sözcükleri yerinde ve anlamına uygun kullanır.","e) Konuşmalarını mimiklerle destekler.","f) Konuşmalarını desteklemek için beden dilini kullanır."]},{"kod":"T.K.1.4","ad":"Konuşma sürecini değerlendirebilme","oa":["a) Konuşmasındaki hatalarını fark eder.","b) Konuşmasında fark ettiği hataları düzeltir.","c) Konuşmasındaki olumlu davranışları sonraki konuşmalarına aktarır."]}],"id":"tymm-turkce-1-u2"},{"ad":"Okuma","kdalar":[{"kod":"T.O.1.1","ad":"Okuma sürecini yönetebilme","oa":["a) Harf ve heceleri doğru seslendirir.","b) Sözcükleri doğru okur.","c) Basit ve kısa cümleleri doğru okur.","ç) Telaffuza dikkat ederek okur.","d) Öğrendiği ses, hece, sözcük veya cümleleri işitilebilir bir ses düzeyinde okur.","e) Okuyacağı metnin başlığı ve görsellerini inceler.","f) Kuralına uygun sesli ve sessiz okur.","g) Anlaşılabilir ve uygun bir hızda sesli okur.","ğ) Bir dizi kısa metin içerisinden seçtiği metni okur.","h) Noktalama işaretlerine dikkat ederek okur."]},{"kod":"T.O.1.2","ad":"Okudukları ile ilgili anlam oluşturabilme","oa":["a) Metni okurken ön bilgilerini kullanır.","b) Okuduğu metindeki bilgiler ile ön bilgileri arasında bağlantı kurar.","c) Okuyacağı metnin başlığından ve görsellerinden hareketle metnin konusu hakkında tahminde bulunur.","ç) Okuduğu metindeki yönergeleri uygular."]},{"kod":"T.O.1.3","ad":"Okuduklarını çözümleyebilme","oa":["a) Okuduğu metnin konusunu bulur."]},{"kod":"T.O.1.4","ad":"Okuma sürecine etki eden durumları gözden geçirebilme","oa":["a) Okuduğu ortamın fiziksel özelliklerini açıklar."]},{"kod":"T.O.1.5","ad":"Okuma sürecini değerlendirebilme","oa":["a) Okuma sürecindeki hatalarını belirler.","b) Okuma sürecinde belirlediği hatalarını düzeltir.","c) Okuma sürecindeki olumlu davranışlarını sonraki okumalarına aktarır."]}],"id":"tymm-turkce-1-u3"},{"ad":"Yazma","kdalar":[{"kod":"T.Y.1.1","ad":"Yazılı anlatım becerilerini yönetebilme","oa":["a) Yazma materyalini kurala uygun kullanır.","c) Hece, sözcük veya cümleler yazar.","ç) Kısa metinler yazar.","d) Verilen bir metni metne bakarak yazar.","e) Söylenen sözcük ve cümleleri yazar.","f) Yazışmalarını selamlaşma ve hitap ifadeleriyle başlatır."]},{"kod":"T.Y.1.2","ad":"Yazılarında içerik oluşturabilme","oa":["a) Görsellerle ilgili sözcük veya cümleler yazar.","b) Sözcük ve cümlelerde eksik bırakılan yerleri ön bilgileri doğrultusunda yazarak tamamlar.","c) Yazılarını karşıdakinin iletilerinden yola çıkarak devam ettirir.","ç) Yazılarında geçen nesneleri fiziksel özelliklerine göre karşılaştırır.","d) Yazılarında nesneleri fiziksel özelliklerine göre sınıflandırır.","e) Dinlediği/izlediği veya okuduğu bir metindeki olayları oluş sırasına göre kendi ifadeleriyle yazar.","f) Yazılı anlatımlarını zenginleştirmek için görseller kullanır.","g) Seçtiği görselden hareketle kısa bir metin yazar.","ğ) Muhatabına ne yazacağını dikkate alarak yazma çalışmaları yapar.","h) Yazılarında benzetmelere yer verir."]},{"kod":"T.Y.1.3","ad":"Yazma kurallarını uygulayabilme","oa":["a) Anlamlı ve kurallı cümleler yazar.","b) Harfleri temel formuna ve yazım yönlerine göre yazar.","c) Rakamları temel formuna ve yazım yönlerine göre yazar.","ç) Harf, sözcük veya cümleler arasında uygun boşluk bırakır.","d) Harflerin büyük yazılışını yerinde kullanır.","e) Anlamını bilmediği sözcüğün anlamını çevrim içi veya basılı kaynaklardan araştırarak yazar.","f) Yazılarında sözcükleri yerinde ve anlamına uygun kullanır.","g) Yazışmalarında mesajlarını açık ve anlaşılır şekilde ifade eder.","ğ) Yazılarında anlamlı ve kurallı cümleler kullanır.","h) Rakam ve sayıları kuralına uygun yazar.","ı) Büyük harfleri kuralına uygun yazar.","i) Yazılarında harf, sözcük ve satırlar arasında uygun boşluk bırakır.","j) Soru edatını (mı, mi) kuralına uygun yazar.","k) Yazılarında noktalama işaretlerini (nokta, kesme işareti, soru işareti, virgül, ünlem) kuralına uygun kullanır."]},{"kod":"T.Y.1.4","ad":"Yazma sürecini değerlendirebilme","oa":["a) Yazılarında hatalarını bulur.","b) Yazılarında belirlediği hataları düzeltir.","c) Yazılarındaki uygun davranışları sonraki yazılarına aktarır"]}],"id":"tymm-turkce-1-u4"}],"id":"tymm-turkce-1"},{"ad":"Türkçe","sinif":"2. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Dinleme/İzleme","kdalar":[{"kod":"T.D.2.1","ad":"Dinleme/izlemeyi yönetebilme","oa":["a) Dinleyeceklerini/izleyeceklerini amacına ve ilgi alanına uygun olarak seçer.","b) Dinleme kurallarına uygun olarak dinler.","c) Dinleme esnasında konuşmaya dâhil olmak için uygun zamanda söz alır."]},{"kod":"T.D.2.2","ad":"Dinledikleri/izledikleri ile ilgili anlam oluşturabilme","oa":["a) Dinlediklerini yaşantı ve ön bilgileriyle karşılaştırarak çıkarımda bulunur.","b) Görsellerden hareketle dinleyeceği/izleyeceği metnin konusunu tahmin eder.","c) Dinlediklerinde/izlediklerinde geçen olayların öncesi hakkında tahminde bulunur.","ç) Dinlediklerinde/izlediklerinde geçen olayların sonrası hakkında tahminde bulunur.","d) Dinlediklerindeki/izlediklerindeki iletilerden ilgi alanına uygun çıkarımlar yapar.","e) Dinlediklerindeki/izlediklerindeki iletileri doğruluk, gerçeklik açısından ön bilgileriyle karşılaştırır.","f) Dinlediği/izlediği metnin içindeki bilgileri doğruluk, gerçeklik açısından karşılaştırır.","g) Dinlediklerindeki/izlediklerindeki farklı nesne ve karakterleri özelliklerine göre sınıflandırır.","ğ) Dinlediklerine/izlediklerine yönelik düşüncelerini ifade eder."]},{"kod":"T.D.2.3","ad":"Dinlediklerini/izlediklerini çözümleyebilme","oa":["a) Dinlediği/izlediği metindeki olayları belirler.","b) Dinlediği/izlediği metnin konusunu bulur.","c) Dinlediği/izlediği farklı metinlerdeki iletilerin benzerlik ve farklılıklarını belirler.","ç) Dinlediğindeki/izlediğindeki söylem ve görsel arasındaki ilişkiyi belirler."]},{"kod":"T.D.2.4","ad":"Dinleme/izleme sürecine etki eden durumları gözden geçirebilme","oa":["a) Dinleme/izleme yapacağı ortamın uygunluğunu gözden geçirir."]},{"kod":"T.D.2.5","ad":"Dinleme/izleme sürecini değerlendirebilme","oa":["a) Dinleme/izleme sürecindeki hatalarını belirler.","b) Dinlemesinde/izlemesinde belirlediği hatalarını düzeltir.","c) Dinlemesindeki/izlemesindeki uygun davranışlarını sonraki dinlemelerine aktarır."]}],"id":"tymm-turkce-2-u1"},{"ad":"Konuşma","kdalar":[{"kod":"T.K.2.1","ad":"Konuşmalarını yönetebilme","oa":["a) Konunun özelliğine göre konuşma üslubunu belirler.","b) Konuşma türüne göre konuşmasını belirler.","c) Konuşma amacına göre konuşmasını belirler.","ç) Konuşma sırasında dinleyiciler ile göz teması kurar.","d) İletişim sırasında uygun zamanda söz alır.","e) Konuşmalarında selamlaşma ve hitap ile ilgili ifadeler kullanır.","f) Belirlenen bir konuda konuşma planı hazırlar."]},{"kod":"T.K.2.2","ad":"Konuşmalarında içerik oluşturabilme","oa":["a) Dinlediklerini/izlediklerini ifade ederken ön bilgilerini kullanır.","b) Görsellerden hareketle olayların oluş sırası hakkında tahminlerde bulunur.","c) Dinledikleri/izledikleri veya okudukları metinlerdeki kişilerin benzer ve farklı yönlerini açıklar.","ç) Verilen görsellerden hareketle karakterleri veya nesneleri benzer özelliklerine göre sınıflandırarak anlatır.","d) Konuşmalarında zıt anlamlı sözcükleri kullanır.","e) Dinlediği/izlediği veya okuduğu bir metindeki olayları oluş sırasına göre kendi ifadeleriyle anlatır.","f) Dinlediği/izlediği bir olaydaki veya okuduğu bir metindeki görüşlere katılıp katılmadığını nedenleriyle ifade eder.","g) Konuşmalarında benzetmelere yer verir.","ğ) Dinlediği/izlediği veya okuduğu metindeki neden sonuç ilişkisini söyler.","h) Konuşmalarını desteklemek için görseller kullanır."]},{"kod":"T.K.2.3","ad":"Konuşma kurallarını uygulayabilme","oa":["a) Konuşmalarında konuşma hızını ayarlar.","b) Dinleyici kitlesi ve konunun özelliğine göre hazırladığı plana uygun konuşur.","c) Konuşmalarında vurgu ve tonlamaya dikkat eder.","ç) Konuşmalarında, sözcükleri yerinde ve anlamına uygun kullanır.","d) Günlük hayatta karşılaştığı bir olayla ilgili düşüncelerini açık ve anlaşılır cümlelerle ifade eder.","e) Konuşmalarında anlamlı ve kurallı cümleler kullanır.","f) Konuşmalarında bağlama ögelerini (ile, ve, ama, çünkü) doğru kullanır.","g) Konuşmalarını jest ve mimiklerle destekler.","ğ) Konuşmalarını desteklemek için beden dilini kullanır.","h) Konuşma sürecinde beden dilini yerinde kullanır."]},{"kod":"T.K.2.4","ad":"Konuşma sürecine etki eden durumları gözden geçirebilme","oa":["a) Konuşma yapacağı ortamın uygunluğunu gözden geçirir."]},{"kod":"T.K.2.5","ad":"Konuşma sürecini değerlendirebilme","oa":["a) Konuşmasında fark ettiği hataları düzeltir.","b) Konuşmasındaki olumlu davranışları fark eder.","c) Konuşmasındaki olumlu davranışları sonraki konuşmalarına aktarır."]}],"id":"tymm-turkce-2-u2"},{"ad":"Okuma","kdalar":[{"kod":"T.O.2.1","ad":"Okuma sürecini yönetebilme","oa":["a) Okuyacağı metnin başlığı ve görsellerini inceler.","b) Okuyacağı metni ilgi alanına göre seçer.","c) Kuralına uygun sesli ve sessiz okur.","ç) Noktalama işaretlerine dikkat ederek okur."]},{"kod":"T.O.2.2","ad":"Okudukları ile ilgili anlam oluşturabilme","oa":["a) Okuduğu metindeki bilgiler ile ön bilgileri arasında bağlantı kurar.","b) Okuyacağı metnin başlığından ve görsellerinden hareketle metnin konusu hakkında tahminde bulunur.","c) Metnin başlığı ve görsellerinden hareketle metinde geçen bilgiler/olaylar hakkında tahminde bulunur.","ç) Okuduğu metindeki verilerden yararlanarak içeriğe uygun çıkarımlar yapar.","d) Okuduğu metindeki iletileri ön bilgileri ile karşılaştırır.","e) Okuduğu metindeki nesne ve kişileri özelliklerine göre sınıflandırır.","f) Okuduğu metindeki zıt anlamlı sözcükleri bulur.","g) Okuduğu metindeki iletilere katılıp katılmadığını ifade eder."]},{"kod":"T.O.2.3","ad":"Okuduklarını çözümleyebilme","oa":["a) Okuduğu metindeki karakter, olay ve bilgileri açıklar.","b) Okuduğu metnin konusunu bulur.","c) Okuduğu metindeki iletilerin benzerlik ve/veya farklılıklarını belirler.","ç) Okuduğu metindeki içerik ve görsel (tablo, grafik, broşür gibi) arasındaki ilişkiyi belirler."]},{"kod":"T.O.2.4","ad":"Okuma sürecine etki eden durumları gözden geçirebilme","oa":["a) Okuduğu ortamın okumasına etkisini açıklar.","b) Okuma yapacağı ortamın fiziksel özelliklerini dikkate alarak okur."]},{"kod":"T.O.2.5","ad":"Okuma sürecini değerlendirebilme","oa":["a) Okuma sürecindeki hatalarını belirler.","b) Okuma sürecinde belirlediği hatalarını düzeltir.","c) Okuma sürecindeki olumlu davranışlarını sonraki okumalarına aktarır."]}],"id":"tymm-turkce-2-u3"},{"ad":"Yazma","kdalar":[{"kod":"T.Y.2.1","ad":"Yazılı anlatım becerilerini yönetebilme","oa":["a) Verilen bir yazma görevini hazırlık yaparak yazar.","b) Verilen bir yazma görevini belirlediği yazı türüne göre yazar.","c) Yazışmalarını selamlaşma ve hitap ifadeleriyle başlatır.","ç) Yazışmalarını uygun ifadeleri kullanarak sonlandırır.","d) Belirlenen bir konuda yazma planı hazırlar."]},{"kod":"T.Y.2.2","ad":"Yazılarında içerik oluşturabilme","oa":["a) Bir metinde eksik bırakılan cümleleri ön bilgilerini kullanarak yazar.","b) Yarım bırakılan bir metni ön bilgilerinden hareketle yazar.","c) Bir sözcüğün anlamına ilişkin tahminlerini bağlamdan yararlanarak yazar.","ç) Eksik bırakılan bir metni tahminleri doğrultusunda yazarak tamamlar.","d) Yazılarında kişi ve nesneleri benzerlik ve/veya farklılık bakımından karşılaştırır.","e) Verilen görsellerden hareketle karakterleri veya nesneleri benzer özelliklerine göre sınıflandırarak yazar.","f) Yazılarında sözcükleri anlamına uygun kullanır.","g) Dinlediği/izlediği veya okuduğu bir metindeki olayları oluş sırasına göre kendi ifadeleriyle yazar.","ğ) Basit yönergeler yazar.","h) Dinlediği/izlediği veya okuduğu bir metindeki görüşlere katılıp katılmadığını nedenleriyle yazar.","ı) İstek ve önerilerini yazarak (tebrik, mektup ve anlık ileti) ifade eder.","i) Yazılı anlatımlarını desteklemek için görseller kullanır.","j) Görsellerle destekleyerek oluşturduğu e-posta, mektup, anlık ileti türlerindeki yazılarını sunar.","k) Yazılarında benzetmelere yer verir.","l) Yazılarında örneklendirmeye yer verir.","m) Dinlediği/izlediği veya okuduğu metindeki neden sonuç ilişkisini yazar."]},{"kod":"T.Y.2.3","ad":"Yazma kurallarını uygulayabilme","oa":["a) Hedef kitle ve konunun özelliğine göre hazırladığı plana uygun yazar.","b) Anlamını bilmediği sözcüğün anlamını çevrim içi veya basılı kaynaklardan araştırarak yazar.","c) Yazılarında sözcükleri yerinde kullanır.","ç) Yazışmalarında mesajlarını birden çok cümleyle açık ve anlaşılır şekilde ifade eder.","d) Soru edatını (mı, mi) kuralına uygun yazar.","e) Kısaltmaları kuralına uygun yazar.","f) Büyük harfleri kuralına uygun yazar.","g) Yazılarında yazım alanını uygun şekilde (yazıyı sayfaya hizalama, paragraf başı, satır sonuna sığmayan sözcükler vb.) kullanır.","ğ) Yazılarında noktalama işaretlerini (nokta, kesme işareti, virgül, iki nokta, ünlem, tırnak işareti, soru işareti, kısa çizgi) kuralına uygun kullanır."]},{"kod":"T.Y.2.4","ad":"Yazma sürecine etki eden durumları gözden geçirebilme","oa":["a) Yazma yapacağı ortamın uygunluğunu gözden geçirir."]},{"kod":"T.Y.2.5","ad":"Yazma sürecini değerlendirebilme","oa":["a) Yazılarında hatalarını bulur.","b) Yazılarında belirlediği hataları düzeltir.","c) Yazılarındaki uygun davranışları sonraki yazılarına aktarır."]}],"id":"tymm-turkce-2-u4"}],"id":"tymm-turkce-2"},{"ad":"Türkçe","sinif":"3. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Dinleme/İzleme","kdalar":[{"kod":"T.D.3.1","ad":"Dinlemeyi/izlemeyi yönetebilme","oa":["a) Dinleyeceklerini/izleyeceklerini amacına ve ilgi alanına uygun olarak seçer.","b) Konuya ve amacına uygun olarak dinleme/izleme stratejisini seçer.","c) Dinleme kurallarına uygun olarak dinler.","ç) Dinlediği konuya ilişkin düşüncelerini belirtmek için uygun zamanda söz alır."]},{"kod":"T.D.3.2","ad":"Dinledikleri/izledikleri ile ilgili anlam oluşturabilme","oa":["a) Görsellerden hareketle dinleyeceği/izleyeceği metnin konusunu tahmin eder.","b) Dinlediklerinde/izlediklerinde geçen olayların öncesi hakkında tahminde bulunur.","c) Dinlediklerinde/izlediklerinde geçen olayların sonrası hakkında tahminde bulunur.","ç) Dinlediklerindeki/izlediklerindeki bilgiler ile ön bilgileri arasında bağlantı kurar.","d) Dinlediklerindeki/izlediklerindeki iletilerden amacına ve ilgi alanına uygun çıkarımlar yapar.","e) Dinlediklerindeki/izlediklerindeki iletileri doğruluk, gerçeklik açısından ön bilgileriyle karşılaştırır.","f) Dinlediği/izlediği metnin içindeki bilgileri doğruluk, gerçeklik açısından karşılaştırır.","g) Dinledikleri ve izlediklerindeki farklı durum, nesne ve karakterleri özelliklerine göre sınıflandırır.","ğ) Dinlediklerine/izlediklerine yönelik düşüncelerini nedenleriyle ifade eder.","h) Dinlediklerindeki/izlediklerindeki iletilere ilişkin önerilerde bulunur.","ı) Dinlediklerine/izlediklerine ilişkin düşüncelerini sözlü ve sözsüz iletişim unsurları ile ifade eder."]},{"kod":"T.D.3.3","ad":"Dinlediklerini/izlediklerini çözümleyebilme","oa":["a) Dinlediği/izlediği metindeki olayları belirler.","b) Dinlediği/izlediği metinde ana fikri/ana duyguyu bulur.","c) Dinlediği/izlediği metnin konusunu bulur.","ç) Dinlediği/izlediği farklı metinlerdeki iletilerin benzerlik ve farklılıklarını belirler.","d) Dinlediği/izlediği farklı metinlerdeki iletileri benzerlik ve farklılık yönüyle ilişkilendirir.","e) Dinlediğindeki/izlediğindeki söylem ve görsel arasındaki ilişkiyi açıklar."]},{"kod":"T.D.3.4","ad":"Dinleme/izleme sürecine etki eden durumları gözden geçirebilme","oa":["a) Dinleme/izleme yapacağı ortamın uygunluğunu gözden geçirir.","b) Dinleme/izleme ortamının dinleme sürecindeki duygu, düşünce ve davranışlarına etkisini açıklar."]},{"kod":"T.D.3.5","ad":"Dinleme/izleme sürecini değerlendirebilme","oa":["a) Dinlemelerinde/izlemelerinde tercih ettiği dinleme/izleme stratejilerini açıklar.","b) Dinleyecekleri/izleyecekleri türü tercih nedenleri ile belirtir.","c) Dinlemesindeki/izlemesindeki uygun davranışlarını sonraki dinlemelerine aktarır."]}],"id":"tymm-turkce-3-u1"},{"ad":"Konuşma","kdalar":[{"kod":"T.K.3.1","ad":"Konuşmalarını yönetebilme","oa":["a) Konunun özelliğine göre konuşma üslubunu belirler.","b) Konuşma türüne göre konuşmasını belirler.","c) Konuşma amacına göre konuşmasını belirler.","ç) Konuşma kurallarına uygun (ses düzeyi, nezaket ifadeleri, göz teması) bir biçimde iletişimi sürdürür.","d) Belirlenen bir konuda konuşma planı hazırlar."]},{"kod":"T.K.3.2","ad":"Konuşmalarında içerik oluşturabilme","oa":["a) Konuşmanın içeriğine uygun olarak yaşantı ve ön bilgilerinden örnekler verir.","b) Dinlediği bir konuşmanın nasıl sonuçlanacağına dair tahminlerde bulunur.","c) Bir konu hakkında hazırladığı konuşma planına uygun konuşur.","ç) Dinledikleri/izledikleri veya okudukları metinlerdeki nesne ve kişileri karşılaştırır.","d) Konuşmalarında farklı karakter, olay ve nesneleri özelliklerine göre sınıflandırır.","e) Konuşmalarında zıt anlamlı sözcükleri kullanır.","f) Konuşmalarında eş anlamlı sözcükler kullanır.","g) Dinlediklerini, izlediklerini veya okuduklarını mantıksal ilişkilere bağlı olarak kendi cümleleriyle ifade eder.","ğ) Sözlü iletişimde katılmadığı görüşlere ilişkin nedenleri ifade eder.","h) Sözlü iletişimde katılmadığı görüşlere ilişkin önerilerde bulunur.","ı) Konuşmalarında benzetmelere yer verir.","i) Konuşmalarında örneklendirmelere yer verir.","j) Görsellerden hareketle konuşma içeriği oluşturur.","k) Dinleyici grubunun özelliklerini dikkate alarak belirli bir konuda sunum yapar.","l) Dinlediği/izlediği veya okuduğu metindeki neden sonuç ilişkisini söyler.","m) Sık karşılaşılan atasözlerinin anlamlarını söyler."]},{"kod":"T.K.3.3","ad":"Konuşma kurallarını uygulayabilme","oa":["a) Konuşmanın özelliğine uygun olarak ses düzeyini ayarlar.","b) Dinleyici kitlesi ve konunun özelliğine göre hazırladığı plana uygun konuşur.","c) Konuşmalarında vurgu ve tonlamaya dikkat eder.","ç) Konuşmalarında sözcükleri yerinde ve anlamına uygun kullanır.","d) Sık karşılaşılan atasözlerini konuşma bağlamına uygun kullanır.","e) Konuşmasındaki mesajları açık ve anlaşılır cümlelerle ifade eder.","f) Konuşmalarında içeriğe uygun zaman ifadelerini kullanır.","g) Konuşmalarında anlamlı ve kurallı cümleler kullanır.","ğ) Konuşmalarında bağlama ögelerini (ile, ve, veya, ya da, ama, çünkü) doğru kullanır.","h) Konuşmalarını jest ve mimiklerle destekler.","ı) Konuşma sürecinde beden dilini yerinde kullanır."]},{"kod":"T.K.3.4","ad":"Konuşma sürecine etki eden durumları gözden geçirebilme","oa":["a) Konuşma yapacağı ortamın uygunluğunu gözden geçirir.","b) Konuşma ortamının konuşma sürecindeki duygu, düşünce ve davranışlarına etkisini açıklar."]},{"kod":"T.K.3.5","ad":"Konuşma sürecini değerlendirebilme","oa":["a) Başkalarının konuşmalarındaki hataları fark eder.","b) Konuşmasındaki olumlu davranışları sonraki konuşmalarına aktarır."]}],"id":"tymm-turkce-3-u2"},{"ad":"Okuma","kdalar":[{"kod":"T.O.3.1","ad":"Okuma sürecini yönetebilme","oa":["a) Okuyacağı metnin başlığı ve görsellerini inceler.","b) Noktalama işaretlerine dikkat ederek okur.","c) Okuyacağı metni ilgi alanına ve amacına göre seçer.","ç) Okuyacağı konuya veya okuma amacına göre okuma stratejisine karar verir."]},{"kod":"T.O.3.2","ad":"Okudukları ile ilgili anlam oluşturabilme","oa":["a) Okuduğu metindeki bilgiler ile ön bilgileri arasında bağlantı kurar.","b) Metnin başlığı ve görsellerinden hareketle metinde geçen bilgiler/olaylar hakkında tahminde bulunur.","c) Okuduğu metinde geçen bilgilerin/olayların öncesi hakkında tahminde bulunur.","ç) Okuma sırasında metinde verilen bilgilerden ve görsellerden hareketle metinde geçen bilgilerin/olayların sırası hakkında tahminde bulunur.","d) Okuma sırasında metinde verilen bilgilerden ve görsellerden hareketle metinde geçen bilgilerin/olayların sonrası hakkında tahminde bulunur.","e) Okuduğu metindeki verilerden yararlanarak metnin amacına uygun çıkarım yapar.","f) Okuduğu metindeki iletileri ön bilgileri ile karşılaştırır.","g) Okuduğu metindeki iletileri metnin içindeki diğer bilgilerle karşılaştırır.","ğ) Okuduğu metindeki olay, nesne ve kişileri özelliklerine göre sınıflandırır.","h) Okuduğu metindeki zıt ve eş anlamlı sözcükleri bulur.","ı) Okuduğu metindeki iletilere katılıp katılmadığını nedenleriyle ifade eder.","i) Okuduğu metindeki içeriğe ilişkin farklı önerilerde bulunur.","j) Okuyacağı metnin başlığı ve görsellerinden hareketle metnin içeriği hakkında görüş oluşturur."]},{"kod":"T.O.3.3","ad":"Okuduklarını çözümleyebilme","oa":["a) Okuduğu metindeki karakter, olay, bilgi veya duyguları açıklar.","b) Okuduğu metnin konusunu bulur.","c) Okuduğu metindeki ana fikri/ana duyguyu bulur.","ç) Okuduğu metindeki iletileri benzerlik ve/veya farklılık yönüyle ilişkilendirir.","d) Gerçek ve mecaz anlamlı sözcüklerin metinle ilişkisini belirler.","e) Okuduğu metindeki noktalama işaretlerinin içerikle ilişkisini belirler."]},{"kod":"T.O.3.4","ad":"Okuma sürecine etki eden durumları gözden geçirebilme","oa":["a) Okuma yapacağı ortamın uygunluğunu değerlendirir.","b) Okuma yapacağı ortamın fiziksel özelliklerini dikkate alarak okur."]},{"kod":"T.O.3.5","ad":"Okuma sürecini değerlendirebilme","oa":["a) Okuma sürecinde belirlediği hatalarını düzeltir.","b) Okuma sürecindeki olumlu davranışlarını sonraki okumalarına aktarır.","c) Tür veya ilgi alanına göre okuma tercihini belirtir.","ç) Basılı materyali okuma sürecindeki olumlu davranışlarını çevrim içi okuma sürecine aktarır."]}],"id":"tymm-turkce-3-u3"},{"ad":"Yazma","kdalar":[{"kod":"T.Y.3.1","ad":"Yazılı anlatım becerilerini yönetebilme","oa":["a) Verilen bir yazma görevini hazırlıksız yazar.","b) Verilen bir yazma görevini belirlediği yazı türüne göre yazar.","c) Yazışmalarını içeriğe ve amacına uygun ifadelerle sürdürür.","ç) Yazışmayı başlatma, sürdürme ve sonlandırmayla ilgili uygun ifadeler kullanır.","d) Çevrim içi yazılarında yazışmayı başlatma, sürdürme ve sonlandırmayla ilgili uygun ifadeler kullanır.","e) İmzasında adını ve soyadını özgün bir şekilde kullanır.","f) Belirlenen bir konuda yazma planı hazırlar."]},{"kod":"T.Y.3.2","ad":"Yazılarında içerik oluşturabilme","oa":["a) Metnin eksik bırakılan bölümlerini ön bilgilerinden hareketle devam ettirir.","b) Bir sözcüğün anlamına ilişkin tahminlerini bağlamdan yararlanarak yazar.","c) Dinlediği/izlediği veya okuduğu bir metne ilişkin çıkarımlarını planlı bir biçimde yazar.","ç) Yazılarında kişi ve nesneleri benzerlik ve/veya farklılık bakımından karşılaştırır.","d) Yazılarında karakter, olay ve nesneleri özelliklerine göre sınıflandırır.","e) Yazılarında zıt anlamlı sözcükleri kullanır.","f) Yazılarında eş anlamlı sözcükleri kullanır.","g) Dinlediği/izlediği bir olayı veya okuduklarını kendi ifadeleriyle yazar.","ğ) Ayrıntılı yönergeler yazar.","h) Yazılı iletişimde katılmadığı görüşlere ilişkin önerilerde bulunur.","ı) İstek, şikâyet ve önerilerini yazarak (mektup, dilekçe, tebrik, anlık ileti) ifade eder.","i) Yazılı anlatımlarının içeriğini oluşturmak için görseller kullanır.","j) Edindiği bilginin kaynağını yazar.","k) Hedef kitleye görsellerle desteklenmiş açıklayıcı türdeki yazılarını sunar.","l) Hedef kitleye görsellerle desteklenmiş öyküleyici türdeki yazılarını sunar.","m) Dijital araçları kullanarak hedef kitleye uygun türde yazılarını sunar.","n) Yazılarında benzetme ve örneklendirmeye yer verir.","o) Dinlediği/izlediği veya okuduğu metindeki neden sonuç ilişkisini yazar."]},{"kod":"T.Y.3.3","ad":"Yazma kurallarını uygulayabilme","oa":["a) Hedef kitle ve konunun özelliğine göre hazırladığı plana uygun yazar.","b) Yazılarında sözcükleri yerinde ve anlamına uygun kullanır.","c) Yazılarında sık karşılaşılan deyim ve atasözlerini içeriğe uygun kullanır.","ç) Yazışmalarında/çevrim içi yazışmalarında mesajlarını birden çok cümleyle açık ve anlaşılır şekilde ifade eder.","d) Kısaltmalara gelen ekleri kuralına uygun yazar.","e) Pekiştirmeli sözcükleri doğru yazar.","f) Büyük harfleri kuralına uygun yazar.","g) Yazılarında noktalama işaretlerini (nokta, kesme işareti, virgül, iki nokta, ünlem, tırnak işareti, soru işareti, kısa çizgi, konuşma çizgisi, yay ayraç, üç nokta, eğik çizgi) kuralına uygun kullanır."]},{"kod":"T.Y.3.4","ad":"Yazma sürecine etki eden durumları gözden geçirebilme","oa":["a) Yazma yapacağı ortamın uygunluğunu gözden geçirir.","b) Yazma ortamının yazma sürecindeki duygu, düşünce ve davranışlarına etkisini açıklar."]},{"kod":"T.Y.3.5","ad":"Yazma sürecini değerlendirebilme","oa":["a) Yazılarında hatalarını bulur.","b) Yazılarında belirlediği hataları düzeltir.","c) Yazılarındaki uygun davranışları sonraki yazılarına aktarır."]}],"id":"tymm-turkce-3-u4"}],"id":"tymm-turkce-3"},{"ad":"Türkçe","sinif":"4. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Dinleme/İzleme","kdalar":[{"kod":"T.D.4.1","ad":"Dinleme/izlemeyi yönetebilme","oa":["a) Konuya, amacına ve ilişkinin türüne uygun olarak dinleme/izleme stratejisini seçer.","b) Dinleme kurallarına uygun olarak dinler.","c) Dinlediği konuya ilişkin düşüncelerini belirtmek için uygun zamanda söz alır."]},{"kod":"T.D.4.2","ad":"Dinledikleri/izledikleri ile ilgili anlam oluşturabilme","oa":["a) Görsellerden hareketle dinleyeceği/izleyeceği metnin konusunu tahmin eder.","b) Dinlediği/izlediği metnin günlük yaşamla bağlantısını kurar.","c) Dinlediklerinde/izlediklerinde geçen olayların öncesi hakkında tahminde bulunur.","ç) Dinlediklerinde/izlediklerinde geçen olayların sonrası hakkında tahminde bulunur.","d) Dinlediklerindeki/izlediklerindeki bilgiler ile ön bilgileri arasında bağlantı kurar.","e) Dinledikleri/izledikleri içerikten hareketle uygun çıkarımlar yapar.","f) Dinlediklerindeki/izlediklerindeki iletileri doğruluk, gerçeklik açısından ön bilgileriyle karşılaştırır.","g) Dinlediği/izlediği metnin içindeki bilgileri doğruluk, gerçeklik açısından karşılaştırır.","ğ) Dinlediklerindeki/izlediklerindeki olay, durum, nesne ve karakterleri özelliklerine göre sınıflandırır.","h) Dinlediklerine/izlediklerine katılıp katılmadığını nedenleriyle ifade eder.","ı) Dinlediklerinde/izlediklerinde kabul etmediği konulara ilişkin önerilerde bulunur.","i) Dinlediklerine/izlediklerine ilişkin düşüncelerini sözlü ve sözsüz iletişim unsurları ile ifade eder."]},{"kod":"T.D.4.3","ad":"Dinlediklerini/izlediklerini çözümleyebilme","oa":["a) Dinlediği/izlediği metindeki olayları belirler.","b) Dinlediği/izlediği metindeki ana fikri/ana duyguyu bulur.","c) Dinlediği/izlediği metnin konusunu bulur.","ç) Dinlediği/izlediği farklı metinlerdeki iletilerin benzerlik ve farklılıklarını belirler.","d) Dinlediği/izlediği farklı metinlerdeki iletileri benzerlik ve farklılık yönüyle ilişkilendirir.","e) Dinlediğindeki/izlediğindeki söylem ve görsel arasındaki ilişkiyi değerlendirir."]},{"kod":"T.D.4.4","ad":"Dinleme/izleme sürecine etki eden durumları gözden geçirebilme","oa":["a) Dinleme/izleme ortamının dinleme sürecindeki duygu, düşünce ve davranışlarına etkisini açıklar.","b) Dinleme/izleme yapacağı ortamın fiziksel özelliklerini dikkate alarak dinler."]},{"kod":"T.D.4.5","ad":"Dinleme/izleme sürecini değerlendirebilme","oa":["a) Dinlemelerinde/izlemelerinde tercih ettiği dinleme/izleme stratejilerini açıklar.","b) Dinlediği/izlediği metinde verilen bilginin ve kaynağının doğruluğunu sorgular.","c) Dinlemesindeki/izlemesindeki uygun davranışlarını sonraki dinlemelerine aktarır."]}],"id":"tymm-turkce-4-u1"},{"ad":"Konuşma","kdalar":[{"kod":"T.K.4.1","ad":"Konuşmalarını yönetebilme","oa":["a) Konunun özelliğine göre konuşma üslubunu belirler.","b) Konuşma türüne göre konuşmasını belirler.","c) Konuşma amacına göre konuşmasını belirler.","ç) Yüz yüze iletişimde konuşma kurallarına uygun biçimde iletişimi sürdürür.","d) Çevrim içi iletişimde konuşma kurallarına uygun biçimde iletişimi sürdürür.","e) Yüz yüze iletişim sürecini uygun nezaket ifadelerini kullanarak sürdürür.","f) Çevrim içi iletişim sürecini uygun nezaket ifadelerini kullanarak sürdürür.","g) Dinleyici kitlesi ve konunun özelliğine uygun konuşma planı hazırlar."]},{"kod":"T.K.4.2","ad":"Konuşmalarında içerik oluşturabilme","oa":["a) Belirlenen bir konu hakkında konuşurken yaşantı ve ön bilgilerinden yararlanır.","b) Dinlediği, izlediği veya okuduğu metnin günlük yaşamla ilişkisini ifade eder.","c) Dinlediklerindeki/izlediklerindeki yarım kalan bir konuşmayı tahminleri ile devam ettirir.","ç) Dinlediği/izlediği bir konuya ilişkin çıkarımlarını planlayarak konuşur.","d) Konuşmalarında dinlediklerinden/izlediklerinden veya okuduğu metinlerden yola çıkarak nesne ve kişileri karşılaştırır.","e) Konuşmalarında olay, durum, nesne ve karakterleri özelliklerine göre sınıflandırır.","f) Çevrim içi konuşmalarında olay, durum, nesne ve karakterleri özelliklerine göre sınıflandırır.","g) Konuşmalarında zıt anlamlı sözcükleri kullanır.","ğ) Konuşmalarında eş anlamlı sözcükleri kullanır.","h) Konuşmalarında eş sesli sözcükleri kullanır.","ı) Dinlediklerini/izlediklerini veya okuduklarını mantıksal ilişkilere bağlı olarak kendi cümleleriyle ifade eder.","i) Dinledikleri/izledikleri veya okuduklarındaki görüşlere katılma veya katılmama kararını nedenleriyle ifade eder.","j) Serbest konuşma çalışmalarında görüş ve düşüncelerini nedenleriyle açıklar.","k) Sözlü iletişimde kabul etmediği konulara ilişkin önerilerde bulunur.","l) Konuşmalarında benzetmelere yer verir.","m) Konuşmasında örneklendirmeye yer verir.","n) Konuşmalarını görsel/dijital içeriklerle destekler.","o) Sık karşılaşılan deyimlerin anlamını söyler.","ö) Sık karşılaşılan atasözlerinin anlamlarını söyler."]},{"kod":"T.K.4.3","ad":"Konuşma kurallarını uygulayabilme","oa":["a) Konuşmalarında sesinin düzeyini dikkat çekmek amacıyla kullanır.","b) Dinleyici kitlesi ve konunun özelliğine göre hazırladığı plana uygun konuşma yapar.","c) Konuşmalarında vurgu ve tonlamaya dikkat eder.","ç) Belirli bir konuda beden dilini, ses tonunu ve dinleyici özelliklerini dikkate alarak sunum yapar.","d) Dinlediği/izlediği veya okuduğu metindeki neden sonuç ilişkisini söyler.","e) Konuşmalarında sözcükleri yerinde ve anlamına uygun kullanır.","f) Deyimleri konuşma bağlamına uygun kullanır.","g) Atasözlerini konuşma bağlamına uygun kullanır.","ğ) Konuşmasındaki mesajları açık ve anlaşılır cümlelerle ifade eder.","h) Konuşmalarında içeriğe uygun zaman ifadelerini kullanır.","ı) Konuşmalarında anlamlı ve kurallı cümleler kullanır.","i) Konuşmalarında bağlama ögelerini (ile, ve, veya, ya da, ama, çünkü, de, ki) doğru kullanır.","j) Konuşmalarını jest ve mimiklerle destekler.","k) Konuşma sürecinde beden dilini yerinde kullanır."]},{"kod":"T.K.4.4","ad":"Konuşma sürecine etki eden durumları gözden geçirebilme","oa":["a) Konuşma ortamının konuşma sürecindeki duygu, düşünce ve davranışlarına etkisini açıklar.","b) Konuşma yapacağı ortamın fiziksel özelliklerini dikkate alarak konuşur."]},{"kod":"T.K.4.5","ad":"Konuşma sürecini değerlendirebilme","oa":["a) Başkalarının konuşmalarındaki hataları fark eder.","b) Başkalarının konuşmalarındaki hataları düzeltir.","c) Konuşmasındaki olumlu davranışları sonraki konuşmalarına aktarır.","ç) Metni yazar rolünde değerlendirerek ifade eder."]}],"id":"tymm-turkce-4-u2"},{"ad":"Okuma","kdalar":[{"kod":"T.O.4.1","ad":"Okuma sürecini yönetebilme","oa":["a) Okuma amacına ve ilgi alanına göre okuyacağı metni seçer.","b) Okuyacağı konuya veya okuma amacına göre okuma stratejisini seçer.","c) Noktalama işaretlerine dikkat ederek okur."]},{"kod":"T.O.4.2","ad":"Okudukları ile ilgili anlam oluşturabilme","oa":["a) Okuduğu metindeki bilgiler ile ön bilgileri arasında bağlantı kurar.","b) Okuduğu metnin günlük yaşamla bağlantısını kurar.","c) Metnin başlığı ve görsellerinden hareketle metinde geçen bilgiler/olaylar hakkında tahminde bulunur.","ç) Okuma sırasında metinde verilen bilgilerden hareketle metinde geçen bilgilerin/olayların öncesi ve sonrası hakkında tahminde bulunur.","d) Okuduğu metindeki verilerden yararlanarak ilgi alanına uygun çıkarım yapar.","e) Okuduğu metindeki verilerden yararlanarak metnin amacına uygun çıkarım yapar.","f) Okuduğu metindeki iletileri ön bilgileriyle karşılaştırır.","g) Okuduğu metindeki iletileri değerlendirir.","ğ) Okuduklarındaki olay, durum, nesne ve kişileri özelliklerine göre sınıflandırır.","h) Okuduğu metindeki eş anlamlı, zıt anlamlı veya eş sesli sözcükleri sınıflandırır.","ı) Okuduğu metindeki iletilere katılıp katılmadığını nedenleriyle ifade eder.","i) Okuduğu metnin kurgusuna ilişkin farklı önerilerde bulunur.","j) Okuyacağı metnin başlığı ve görsellerinden hareketle metnin içeriği hakkında görüş oluşturur.","k) Okuyacağı metnin biçimsel ve tanıtıcı özelliklerinden hareketle metnin içeriği hakkında görüş oluşturur.","l) Okuduğu metinlerde \"de\" ve \"ki\" bağlaçlarının anlam üzerindeki etkisini fark eder."]},{"kod":"T.O.4.3","ad":"Okuduklarını çözümleyebilme","oa":["a) Okuduğu metindeki karakter, olay, bilgi veya duyguları analiz eder.","b) Okuduğu metnin konusunu bulur.","c) Okuduğu metindeki ana fikri/ana duyguyu bulur.","ç) Okuduğu metindeki iletileri benzerlik ve/veya farklılık yönüyle ilişkilendirir.","d) Gerçek, mecaz ve terim anlamlı sözcüklerin metinle ilişkisini belirler.","e) Yan anlamlı sözcükleri metinde bulur.","f) Çevrim içi okumada aradığı bilginin yerini doğru olarak bulur.","g) Okuduğu metindeki noktalama işaretlerinin içerikle ilişkisini belirler.","ğ) Okuduğu metindeki içerik ve görsel (tablo, grafik, broşür vb.) arasındaki ilişkiyi belirler."]},{"kod":"T.O.4.4","ad":"Okuma sürecine etki eden durumları gözden geçirebilme","oa":["a) Okuma sürecini etkileyen fiziksel etmenleri düzenler.","b) Okuma yapacağı ortamın fiziksel özelliklerini dikkate alarak okur."]},{"kod":"T.O.4.5","ad":"Okuma sürecini değerlendirebilme","oa":["a) Okuma sürecinde belirlediği hatalarını düzeltir.","b) Okuma sürecindeki olumlu davranışlarını sonraki okumalarına aktarır.","c) Okuduğu metinde verilen bilginin ve kaynağının doğruluğunu sorgular.","ç) Tür veya ilgi alanına göre okuma tercihini belirtir.","d) Basılı materyali okuma sürecindeki olumlu davranışlarını çevrim içi okuma sürecine aktarır."]}],"id":"tymm-turkce-4-u3"},{"ad":"Yazma","kdalar":[{"kod":"T.Y.4.1","ad":"Yazılı anlatım becerilerini yönetebilme","oa":["a) Serbest yazma çalışmaları yapar.","b) Amacına uygun yazma stratejisini seçer.","c) Dinlediği/izlediği veya okuduğu metnin günlük yaşamla ilişkisini yazar.","ç) Bir sözcüğün anlamına ilişkin tahminlerini bağlamdan yararlanarak yazar.","d) Yazışmayı başlatma, sürdürme ve sonlandırmayla ilgili uygun ifadeler kullanır.","e) Çevrim içi yazılarında yazışmayı başlatma, sürdürme ve sonlandırmayla ilgili uygun ifadeler kullanır.","f) İmzasında adını ve soyadını özgün bir şekilde kullanır.","g) Yazacağı metnin türüne uygun yazma planı hazırlar.","j) Dinlediği/izlediği bir olayı veya okuduğu bir metni mantıksal ilişkilere uygun şekilde kendi ifadeleriyle yazar.","m) Dinledikleri/izledikleri veya okuduklarındaki görüşlere katılma veya katılmama kararını nedenleriyle yazar."]},{"kod":"T.Y.4.2","ad":"Yazılarında içerik oluşturabilme","oa":["a) Metnin eksik bırakılan bölümlerini ön bilgilerinden hareketle devam ettirir.","b) Ön bilgilerinden hareketle metin yazar.","c) Dinlediği, izlediği veya okuduğu metnin günlük yaşamla ilişkisini yazar.","ç) Bir sözcüğün anlamına ilişkin tahminlerini bağlamdan yararlanarak yazar.","d) Dinlediği/izlediği veya okuduğu bir metne ilişkin çıkarımlarını planlı bir biçimde yazar.","e) Yazışmalarında kişi ve nesneleri benzerlik ve/veya farklılık bakımından karşılaştırır.","f) Çevrim içi yazışmalarında kişi ve nesneleri benzerlik ve farklılık bakımından karşılaştırır.","g) Yazışmalarında olay, durum, nesne ve karakterleri özelliklerine göre sınıflandırır.","ğ) Çevrim içi yazışmalarında olay, durum, nesne ve karakterleri özelliklerine göre sınıflandırır.","h) Yazılarında zıt anlamlı sözcükleri kullanır.","ı) Yazılarında eş anlamlı sözcükleri kullanır.","i) Yazılarında eş sesli sözcükleri kullanır.","j) Dinlediği, izlediği bir olayı veya okuduğu bir metni mantıksal ilişkilere uygun şekilde kendi ifadeleriyle yazar.","k) Ayrıntılı yönergeler yazar.","l) Çevrim içi ortamda dijital mahremiyete dikkat ederek yazar.","m) Dinledikleri/izledikleri veya okuduklarındaki görüşlere katılma veya katılmama kararını nedenleriyle yazar.","n) Serbest yazma çalışmalarında görüş ve düşüncelerini nedenleriyle açıklar.","o) İstek, şikâyet ve önerilerini yazarak (mektup, dilekçe, tebrik, anlık ileti) ifade eder.","p) Edindiği bilginin kaynağını yazar.","r) Hedef kitleye görsellerle desteklenmiş açıklayıcı türdeki yazılarını sunar.","s) Hedef kitleye görsellerle desteklenmiş öyküleyici türdeki yazılarını sunar.","ş) Dijital araçları kullanarak hedef kitleye uygun türde yazılarını sunar.","t) Yazılarında benzetme ve örneklendirmeye yer verir.","u) Dinlediği/izlediği veya okuduğu metindeki neden sonuç ilişkisini yazar.","ü) Yazılarında \"de\" ve \"ki\" bağlaçlarını kuralına uygun kullanır."]},{"kod":"T.Y.4.3","ad":"Yazma kurallarını uygulayabilme","oa":["a) Yazacağı metin türünün özelliğine göre hazırladığı plana uygun yazar.","b) Yazılarında sözcükleri yerinde ve anlamına uygun kullanır.","c) Yazılarında deyim ve atasözlerini içeriğe uygun kullanır.","ç) Yazışmalarında/çevrim içi yazışmalarında mesajlarını birden çok cümleyle açık ve anlaşılır şekilde ifade eder.","d) Yazım kurallarına uygun yazar.","e) Yazılarında noktalama işaretlerini (nokta, kesme işareti, virgül, iki nokta, ünlem, tırnak işareti, soru işareti, kısa çizgi, konuşma çizgisi, yay ayraç, üç nokta, eğik çizgi) kuralına uygun kullanır."]},{"kod":"T.Y.4.4","ad":"Yazma sürecine etki eden durumları gözden geçirebilme","oa":["a) Yazma ortamının yazma sürecindeki duygu, düşünce ve davranışlarına etkisini açıklar.","b) Yazma yapacağı ortamın fiziksel özelliklerini dikkate alarak yazar."]},{"kod":"T.Y.4.5","ad":"Yazma sürecini değerlendirebilme","oa":["a) Yazılarında hatalarını bulur.","b) Yazılarında belirlediği hataları düzeltir.","c) Yazılarındaki uygun davranışları sonraki yazılarına aktarır.","ç) Tür veya ilgi alanına göre yazma tercihini belirtir.","d) Dinlediği/izlediği veya okuduğu metni yazarın gözünden değerlendirdiği yazılar yazar."]}],"id":"tymm-turkce-4-u4"}],"id":"tymm-turkce-4"},{"ad":"Matematik","sinif":"1. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Sayılar ve Nicelikler","kdalar":[{"kod":"MAT.1.1.1","ad":"Rakamları ve 20’ye kadar olan sayıları (20 dâhil), niceliklerin büyüklüklerini temsil etmek için kullanabilme","oa":["a) Niceliklerin büyüklüklerinin farklı temsillerini tanır.","b) Karşılaştığı niceliklerin büyüklüklerini, farklı temsilleri bağlamında belirler.","c) Karşılaştığı niceliklerin büyüklüklerini rakam ve sayılarla okur ve yazar."]},{"kod":"MAT.1.1.2","ad":"Ögeleri dağınık veya düzenli bir şekilde bulunan bir nesne grubunu sayarken parçalar arasında ilişkileri çözümleyebilme","oa":["a) Ögeleri dağınık veya düzenli bir şekilde bulunan bir nesne grubunun parçalarını belirler.","b) Ögeleri dağınık veya düzenli bir şekilde bulunan bir nesne grubunu sayarken parçalar arasındaki ilişkileri belirler."]},{"kod":"MAT.1.1.3","ad":"Nesnelerin sıra sayısını gösterebilme","oa":[]},{"kod":"MAT.1.1.4","ad":"İki niceliğin büyüklüğünü “çok”, “daha çok”, “az”, “daha az” veya “eşit” terimleriyle karşılaştırabilme","oa":["a) İki niceliğin büyüklüğünü “çok”, “daha çok”, “az”, “daha az” veya “eşit” terimleriyle ifade eder.","b) İfade edilen büyüklüklere ilişkin benzerlikleri listeler.","c) İfade edilen büyüklüklere ilişkin farklılıkları listeler."]},{"kod":"MAT.1.1.5","ad":"100’e kadar ileriye ve 20’den geriye doğru ritmik sayabilme","oa":[]},{"kod":"MAT.1.1.6","ad":"Artan veya azalan sayı ve şekil örüntülerini çözümleyebilme","oa":["a) Sayı ve şekil örüntülerinin ardışık ögelerini belirler.","b) Sayı ve şekil örüntülerinin ardışık ögeleri arasındaki ilişkiyi belirler."]},{"kod":"MAT.1.1.7","ad":"Verilen bir çokluktaki ilişkilerden yararlanarak 20’ye kadar (20 dâhil) olan nesnelerin sayısını tahmin edebilme","oa":["a) Verilen bir çokluktaki ilişkileri gözlem ve deneyimleri ile ilişkilendirir.","b) Bir çokluğun büyüklüğünü stratejiye dayanarak tahmin eder.","c) Tahmin edilen sonuç ile sayma sonucunu karşılaştırarak yargıda bulunur."]},{"kod":"MAT.1.1.8","ad":"Standart olmayan uygun ölçme araçları ile nesnelerin uzunluğunu ve tartacağı kütlenin ölçüm sonuçlarını tahmin edebilme","oa":["a) Ölçeceği uzunluğa ve kütleye uygun standart olmayan ölçme aracını belirler.","b) Ölçeceği uzunluğun ve tartacağı kütlenin ölçüm sonuçlarını belirlenen standart olmayan ölçü birimi cinsinden tahmin eder.","c) Tahmininin doğruluğuna ilişkin yargıda bulunur."]},{"kod":"MAT.1.1.9","ad":"Paraların (1 TL, 5 TL, 10 TL, 20 TL, 50 TL, 100 TL ve 200 TL) temsil ettiği büyüklükleri tanıyabilme","oa":[]}],"id":"tymm-matematik-1-u1"},{"ad":"İşlemlerden Cebirsel Düşünmeye","kdalar":[{"kod":"MAT.1.2.1","ad":"Günlük yaşamın içerdiği toplama ve çıkarma işlemlerini çözümleyebilme","oa":["a) Günlük yaşam durumunun toplama ve çıkarma işlemlerinden hangisini gerektirdiğini fark eder.","b) Günlük yaşam durumuna karşılık gelen toplama ve çıkarma işlemlerini birbiri ile ilişkilendirir."]},{"kod":"MAT.1.2.2","ad":"Toplama ve çıkarma işlemlerinin sonuçlarını tahminde bulunarak ve zihinden işlem yaparak muhakeme edebilme","oa":["a) Toplama ve çıkarma işlemlerine ilişkin ögeleri belirler.","b) Toplama ve çıkarma işlemlerine ilişkin ögeler arasındaki ilişkileri belirler.","c) Toplama ve çıkarma işlemlerine yönelik tahmin ve zihinden işlem sonuçları arasında ilişki kurar.","ç) Tahmin ve zihinden işlem sonuçlarının tutarlılığını ifade eder."]},{"kod":"MAT.1.2.3","ad":"Eşit işaretinin anlamını toplama ve çıkarma işlemi bağlamında yorumlayabilme","oa":["a) Toplama ve çıkarma işlemlerinde eşit işaretinin kullanımını inceler.","b) Eşit işaretinin anlamını kullanarak bir toplama ya da çıkarma işlemini dönüştürür.","c) Dönüştürdüğü toplama ve çıkarma işlemlerini kendi cümleleriyle ifade eder."]},{"kod":"MAT.1.2.4","ad":"Toplama ve çıkarma işlemlerinin ilişkisini yorumlayabilme","oa":["a) Toplama ve çıkarma işlemlerinin ilişkisini inceler.","b) Toplama ve çıkarma işlemlerini tersine dönüştürür.","c) Toplama ve çıkarma işlemlerinin ilişkisini yeniden ifade eder."]}],"id":"tymm-matematik-1-u2"},{"ad":"Nesnelerin Geometrisi","kdalar":[{"kod":"MAT.1.3.1","ad":"Hedefe ulaşmak için mesafeleri ve yönleri içeren yönergeleri çözümleyebilme","oa":["a) Yönergede yer alan mesafe ve yönleri içeren kavramları belirler.","b) Yönergeleri kullanarak başlangıç noktası ve hedef arasında ilişki kurar."]},{"kod":"MAT.1.3.2","ad":"Nesnelerin eşliğini değerlendirebilme","oa":["a) Nesnelerin eşliği için bir ölçüt belirler.","b) Ölçüte uygun bilgileri kullanarak ölçme yapar.","c) Yapılan ölçmeye dayalı olarak elde ettiği sonuçları ölçüt ile karşılaştırır.","ç) Karşılaştırmalarına ilişkin olarak yargıda bulunur."]}],"id":"tymm-matematik-1-u3"},{"ad":"Veriye Dayalı Araştırma","kdalar":[{"kod":"MAT.1.4.1","ad":"Kategorik veriye dayalı temel veri grubu ile çalışabilme ve veriye dayalı karar verebilme","oa":["a) Kategorik veriye dayalı istatiksel araştırma gerektiren günlük yaşam durumu belirler.","b) Kategorik veriye dayalı betimleme gerektirebilecek araştırma soruları oluşturur.","c) Kategorik verileri toplamak için plan yapar.","ç) Kategorik verileri toplar ve analize hazırlar.","d) Toplanan verileri analiz etmek için görselleştirme araçlarından çetele, sıklık tablosu ve nesne grafiğini seçer.","e) Seçtiği araçlarla verileri görselleştirerek analiz eder.","f) Araştırma sonuçlarını yorumlar.","g) Araştırma sonuçlarını araştırma sorularına göre değerlendirir."]}],"id":"tymm-matematik-1-u4"}],"id":"tymm-matematik-1"},{"ad":"Matematik","sinif":"2. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Sayılar ve Nicelikler","kdalar":[{"kod":"MAT.2.1.1","ad":"100’e kadar olan niceliklerin büyüklüklerini temsil etmede sayıların sembolik temsillerinden yararlanabilme","oa":["a) Niceliklerin büyüklüklerinin farklı temsillerini tanır.","b) Niceliklerin büyüklüklerine uygun sayı temsillerini belirler.","c) Niceliklerin büyüklüklerine karşılık gelen sayıları okur ve yazar."]},{"kod":"MAT.2.1.2","ad":"İki basamaklı sayıları çözümleyebilme","oa":["a) İki basamaklı sayıların basamak ve basamak değerini belirler.","b) İki basamaklı sayıların basamak ve basamak değerleri arasındaki ilişkileri belirler."]},{"kod":"MAT.2.1.3","ad":"Sayıların sırasını belirleyebilme","oa":[]},{"kod":"MAT.2.1.4","ad":"İleriye ve geriye doğru ritmik sayabilme","oa":["a) Yüzlük tablo üzerinde ileriye ve geriye doğru ritmik saymaya ilişkin gözlem yapar.","b) 20 içinde ikişer, 30 içinde üçer, 40 içinde dörder, 100 içinde beşer ileriye ve geriye doğru ritmik sayarken örüntü bulur.","c) İleriye ve geriye doğru ritmik sayarken bulduğu örüntüyü geneller."]},{"kod":"MAT.2.1.5","ad":"Sayı ve sayı temsiline dönüşen şekil örüntülerine dayalı çıkarım yapabilme","oa":["a) Örüntüde kullanılan sayılar ve sayı temsiline dönüşen şekiller arasındaki ilişkiye yönelik varsayımda bulunur.","b) Belirlediği varsayıma göre sayı ve sayı temsiline dönüşen şekil örüntülerini örnekler üzerinde listeler.","c) Gösterilen örüntünün, varsayımı karşılayıp karşılamadığını örneklerle sınar.","ç) Karşılaştırılan sayı ve sayı temsiline dönüşen şekil örüntülerinin kuralını sözlü olarak ifade eder.","d) Gösterilen örüntü ile ilgili değerlendirmede bulunur."]},{"kod":"MAT.2.1.6","ad":"Bir çokluktaki ilişkilerden yararlanarak 50’ye kadar olan nesnelerin sayısını tahmin edebilme","oa":["a) Bir çokluktaki parça-bütün ve dağılım ilişkisini gözlem ve deneyimleri ile ilişkilendirir.","b) Bir çokluğun büyüklüğünü stratejiye dayanarak tahmin eder.","c) Tahmini ile sayma sonucunu karşılaştırarak tahmininin doğruluğuna yönelik bir yargıda bulunur."]},{"kod":"MAT.2.1.7","ad":"Bütün, yarım ve çeyrek arasındaki ilişkiyi çözümleyebilme","oa":["a) Bir bütünün yarım ve çeyrek parçalarını belirler.","b) Bütün, yarım ve çeyrek arasındaki ilişkileri belirler."]},{"kod":"MAT.2.1.8","ad":"Paraları değerlerine göre ilişkilendirerek çözümleyebilme","oa":["a) Paraları değerlerine göre inceleyerek madenî paraları belirler.","b) Kuruş ve Türk lirası arasındaki ilişkileri belirler."]},{"kod":"MAT.2.1.9","ad":"Zaman ölçü birimlerini okuyabilme ve yazabilme","oa":[]},{"kod":"MAT.2.1.10","ad":"Standart uzunluk ve kütle ölçme araçlarının ve birimlerinin gerekliliğini yansıtabilme","oa":["a) Standart olmayan araçlarla ilgili deneyimlerinden yola çıkarak standart ölçme araçlarına olan ihtiyacı gözden geçirir.","b) Deneyimlerine dayalı olarak standart ölçme araçlarının gerekliliğine ilişkin çıkarımda bulunur.","c) Standart ölçme araçlarına ilişkin ulaştığı çıkarımlar doğrultusunda standart ölçü birimlerinin gerekliliğini değerlendirir."]},{"kod":"MAT.2.1.11","ad":"Standart uzunluk ve kütle ölçü birimleri cinsinden uzunlukları ve kütleleri tahmin edebilme","oa":["a) Standart ölçü birimlerine ilişkin deneyimini, tahmine konu olan uzunluk ve kütle ile ilişkilendirir.","b) Nesnelerin uzunluğunu ve kütlesini standart ölçü birim cinsinden tahmin eder.","c) Tahminini ölçüm sonuçlarıyla karşılaştırarak tahminine ilişkin yargıda bulunur."]}],"id":"tymm-matematik-2-u1"},{"ad":"İşlemlerden Cebirsel Düşünmeye","kdalar":[{"kod":"MAT.2.2.1","ad":"Toplama ve çıkarma işlemleri gerektiren günlük yaşam problemlerini çözebilme","oa":["a) Problemi anlayarak verilen ve istenilenleri belirler.","b) Problemde verilenler ile istenilenlerin gerektirdiği işlemler arasındaki ilişkiyi belirler.","c) Probleme ilişkin verilenleri belirleyerek uygun matematiksel temsillere dönüştürür.","ç) Matematiksel temsillere dönüştürdüğü problemi kendi ifadeleri ile açıklar.","d) Problemlerin sonucuna ilişkin tahminde bulunarak işlemleri gerçekleştirmek için stratejiler geliştirir.","e) Belirlenen strateji ya da stratejileri çözüm için uygular.","f) Çözüm yollarını kontrol ederek çözüme ulaştırmayan stratejiyi değiştirir.","g) Problemin çözümü için kullandığı veya geliştirdiği stratejileri gözden geçirerek kısa yolları değerlendirir.","ğ) Çözüme ulaştıran stratejinin/stratejilerin hangi problemlere uygulanabileceğini geneller.","h) Genellemenin geçerliliğini matematiksel örneklerle değerlendirir."]},{"kod":"MAT.2.2.2","ad":"Toplama ve çıkarma işlemlerinin sonuçlarını tahminde bulunarak ve zihinden işlem yaparak muhakeme edebilme","oa":["a) Toplama ve çıkarma işlemlerine ilişkin ögeleri belirler.","b) Toplama ve çıkarma işlemlerine ilişkin ögeler arasındaki ilişkileri belirler.","c) Toplama ve çıkarma işlemine yönelik tahmin ve zihinden işlem sonuçları arasında ilişki kurar.","ç) Tahmin ve zihinden işlem sonuçlarının tutarlılığını ifade eder."]},{"kod":"MAT.2.2.3","ad":"Toplama ve çıkarma işlemlerinin ilişkisini yorumlayabilme","oa":["a) Toplama ve çıkarma işlemlerinin ilişkisini inceler.","b) Toplama ve çıkarma işlemlerini tersine dönüştürür.","c) Toplama ve çıkarma işlemlerinin ilişkisini yeniden ifade eder."]},{"kod":"MAT.2.2.4","ad":"Çarpma ve bölme işlemlerini toplama ve çıkarma işlemlerine dayalı olarak çözümleyebilme","oa":["a) Çarpma ve bölme işlemlerinin anlamlarının toplama ve çıkarma işlemleriyle ilişkili olduğunu fark eder.","b) Çarpma ve bölme işlemlerini toplama ve çıkarma işlemleriyle ilişkilendirir."]},{"kod":"MAT.2.2.5","ad":"Çarpma ve bölme işlemlerinin sonuçlarını tahminde bulunarak ve zihinden işlem yaparak muhakeme edebilme","oa":["a) Çarpma ve bölme işlemlerine ilişkin bileşenleri belirler.","b) Çarpma ve bölme işlemlerine ilişkin bileşenler arasındaki ilişkileri belirler.","c) Çarpma ve bölme işlemine yönelik tahmin ve zihinden işlem sonuçlarını ifade eder.","ç) Tahmin ve zihinden işlem sonuçlarını açıklar."]},{"kod":"MAT.2.2.6","ad":"Dört işlem bağlamında eşitliğin farklı anlamlarını yorumlayabilme","oa":["a) Dört işlemde eşitliği farklı anlamlarına göre inceler.","b) Dört işlem bağlamında aynı sonucu veren durumları eşitliğin anlamını kullanarak farklı sayılarla ifade eder.","c) Eşitliğin anlamlarını dört işlem bağlamında ifade eder."]}],"id":"tymm-matematik-2-u2"},{"ad":"Nesnelerin Geometrisi","kdalar":[{"kod":"MAT.2.3.1","ad":"Günlük yaşamda kullanılan nesneleri biçimsel özelliklerine göre geometrik cisim olarak sınıflandırabilme","oa":["a) Günlük yaşamda kullanılan nesnelerin biçimsel özelliklerini belirler.","b) Farklı nesneleri biçimsel özelliklerine göre ayırır.","c) Nesneleri geometrik cisim olarak tasnif eder.","ç) Geometrik cisimleri adlandırır."]},{"kod":"MAT.2.3.2","ad":"Geometrik cisim modellerini kullanarak yapılar sentezleyebilme","oa":["a) Geometrik yapılardaki geometrik cisimleri belirler.","b) Geometrik cisimler arasında ilişki kurar.","c) Geometrik cisimleri birleştirerek özgün bir yapı oluşturur."]},{"kod":"MAT.2.3.3","ad":"Geometrik şekiller kullanarak modeller sentezleyebilme","oa":["a) Geometrik yapılardaki geometrik şekilleri belirler.","b) Geometrik şekiller arasında ilişki kurar.","c) Geometrik şekilleri birleştirerek özgün model oluşturur."]},{"kod":"MAT.2.3.4","ad":"Geometrik şekil ve cisimlerin yön, konum veya büyüklükleri değiştiğinde biçimsel özelliklerinin değişmediğini yorumlayabilme","oa":["a) Geometrik şekil ve cisimlerin mevcut yön, konum veya büyüklüklerini inceler.","b) Geometrik şekil ve cisimlerin mevcut yön, konum veya büyüklüklerini biçimsel özelliklerinden kopmadan farklı büyüklüklere veya farklı yönlere dönüştürerek gösterir.","c) Geometrik şekil ve cisimlerin yön, konum veya büyüklükleri değişse de geometrik şekil ve cisim olarak aynı kaldığını ifade eder."]},{"kod":"MAT.2.3.5","ad":"Standart olmayan sıvı ölçme araçları ile sıvı miktarını tahmin edebilme","oa":["a) Standart olmayan sıvı ölçme araçlarına ilişkin deneyimini, tahmine konu olan sıvı miktarı ile ilişkilendirir.","b) Belirlenen standart olmayan sıvı ölçme araçlarına göre sıvının miktarını tahmin eder.","c) Tahminini ölçüm sonuçlarıyla karşılaştırarak tahminine ilişkin yargıda bulunur."]},{"kod":"MAT.2.3.6","ad":"Mesafe ve yönleri içerecek şekilde hedefe ulaşmak için uygun stratejilere karar verebilme","oa":["a) Hedefe ulaşmak için ölçüt belirler.","b) Belirlediği ölçüte uygun bilgileri toplar.","c) Topladığı bilgilerden ölçüte yönelik seçenekler oluşturur.","ç) Oluşturduğu seçenekler üzerinde mantıksal denetleme yapar.","d) Seçenekler arasından ölçüte uygun seçim yapar.","e) Ölçüt değişikliği durumunu sürece yansıtır."]},{"kod":"MAT.2.3.7","ad":"Verilen şekiller arasından simetrik olanları ayırt edebilme","oa":[]}],"id":"tymm-matematik-2-u3"},{"ad":"Veriye Dayalı Araştırma","kdalar":[{"kod":"MAT.2.4.1","ad":"Kategorik veriye dayalı en çok iki veri grubu ile çalışabilme ve veriye dayalı karar verebilme","oa":["a) Kategorik veriye dayalı istatistiksel araştırma gerektiren günlük yaşam durumu belirler.","b) Kategorik veriye dayalı betimleme veya karşılaştırma gerektirebilecek araştırma soruları oluşturur.","c) Kategorik verileri toplamak için plan yapar.","ç) Kategorik verileri toplar ve analize hazırlar.","d) Toplanan verileri analiz etmek için görselleştirme araçlarından çetele tablosu, sıklık tablosu ve şekil grafiğini seçer.","e) Seçtiği araçlarla verileri görselleştirerek analiz eder.","f) Araştırma sonuçlarını yorumlar.","g) Araştırma sonuçlarını araştırma sorularına göre değerlendirir."]}],"id":"tymm-matematik-2-u4"}],"id":"tymm-matematik-2"},{"ad":"Matematik","sinif":"3. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Sayılar ve Nicelikler","kdalar":[{"kod":"MAT.3.1.1","ad":"Niceliklerin büyüklüklerine karşılık gelen 1000’e kadar olan sayıların temsillerinden yararlanabilme","oa":["a) Niceliklerin büyüklüklerinin temsillerini tanır.","b) Niceliklerin büyüklüklerine uygun sayı temsillerini belirler.","c) Niceliklerin büyüklüklerine karşılık gelen uygun sayıları okur ve yazar."]},{"kod":"MAT.3.1.2","ad":"1000’e kadar olan sayıları çözümleyebilme","oa":["a) Üç basamaklı sayıların basamaklarını belirler.","b) Üç basamaklı sayıların basamak ve basamak değerleri arasındaki ilişkileri belirler."]},{"kod":"MAT.3.1.3","ad":"Sayıları sıralayabilme","oa":["a) 1000’e kadar olan sayıları öncelik/sonralık ilişkisine göre belirler.","b) 1000’e kadar olan sayıları bulundukları onluklara ve yüzlüklere göre ayırır.","c) 1000’e kadar olan sayıları en yakın onluklara ve yüzlüklere göre tasnif eder.","ç) 1000’e kadar olan sayıları en yakın onluklara ve yüzlüklere göre ifade eder."]},{"kod":"MAT.3.1.4","ad":"Sayıları ileriye ve geriye doğru ritmik sayabilme","oa":["a) Modeller üzerinde ileriye ve geriye doğru ritmik saymaya ilişkin gözlem yapar.","b) 60 içinde altışar, 70 içinde yedişer, 80 içinde sekizer, 90 içinde dokuzar; 1000 içinde onar ve yüzer ileriye ve geriye doğru ritmik sayarken örüntü bulur.","c) İleriye ve geriye doğru ritmik sayarken bulduğu örüntüyü geneller."]},{"kod":"MAT.3.1.5","ad":"Sayıları tek-çift olarak sınıflandırabilme","oa":["a) Sayıları tek-çift ilişkisine göre belirler.","b) Sayıları tek-çift olma durumlarına göre ayırt eder.","c) Sayıları tek-çift olma durumlarına göre tasnif eder.","ç) Sayıları tek-çift sayı olarak ifade eder."]},{"kod":"MAT.3.1.6","ad":"Tek ve çift sayıların toplamlarının tek ya da çift olma durumu arasındaki ilişkiye yönelik tümevarımsal akıl yürütebilme","oa":["a) Tek ve çift sayıların toplamlarına yönelik örnek durumların tek ya da çift olma özelliklerini belirler.","b) Toplanan sayılar ile elde edilen toplamın tek ya da çift olma durumları arasındaki örüntüyü belirler.","c) Tek ve çift sayıların toplamlarının tek ya da çift olma durumuna ilişkin genelleme yapar."]},{"kod":"MAT.3.1.7","ad":"Sayı ve sayı temsiline dönüşen şekil örüntülerine dayalı çıkarım yapabilme","oa":["a) Örüntüde kullanılan sayılar ve sayı temsiline dönüşen şekiller arasındaki ilişkiye yönelik varsayımda bulunur.","b) Belirlediği varsayıma göre sayı ve sayı temsiline dönüşen şekil örüntülerini örnekler üzerinde listeler.","c) Gösterilen örüntünün varsayımı karşılayıp karşılamadığını örneklerle sınar.","ç) Karşılaştırılan sayı ve sayı temsiline dönüşen şekil örüntülerinin kuralını sözlü olarak ifade eder.","d) Gösterilen örüntü ile ilgili değerlendirmede bulunur."]},{"kod":"MAT.3.1.8","ad":"Bir çokluktaki ilişkilerden yararlanarak 100’e kadar olan nesnelerin sayısını tahmin edebilme","oa":["a) Bir çokluktaki parça-bütün ve dağılım ilişkisini gözlem ve deneyimleri ile ilişkilendirir.","b) Bir çokluğun büyüklüğünü stratejiye dayanarak tahmin eder.","c) Tahmini ile sayma sonucunu karşılaştırarak tahmininin doğruluğuna yönelik bir yargıda bulunur."]},{"kod":"MAT.3.1.9","ad":"Bütün, yarım ve çeyreğin kesirle gösterimi için modellerden yararlanabilme","oa":["a) Bütün, yarım ve çeyrek modellerinin temsillerini tanır.","b) Bütün, yarım ve çeyrek modellerine uygun kesir temsillerini belirler.","c) Belirlediği temsili bütün, yarım ve çeyrek modelleri için kullanır."]},{"kod":"MAT.3.1.10","ad":"Bir bütünü eş parçalar oluşturacak şekilde birim kesir olarak çözümleyebilme","oa":["a) Bir bütünü oluşturan eş parçaları belirler.","b) Bütün ile eş parçaların her biri arasındaki ilişkiyi belirler."]},{"kod":"MAT.3.1.11","ad":"Bir kesrin payı ile paydası arasındaki ilişkiyi çözümleyebilme","oa":["a) Bir kesrin pay ve paydasına ait parçaları belirler.","b) Bir kesrin pay ve paydasına ait parçalar arasındaki ilişkiyi belirler."]},{"kod":"MAT.3.1.12","ad":"Analog ve dijital saatlerde zamanı okuyabilme ve yazabilme","oa":[]},{"kod":"MAT.3.1.13","ad":"Zaman ölçü birimlerini çözümleyebilme","oa":["a) Zaman ölçü birimlerini (yıl, ay, hafta, gün, saat, dakika, saniye) belirler.","b) Zaman ölçü birimleri arasındaki ilişkileri belirler."]},{"kod":"MAT.3.1.14","ad":"Olayların oluş sürelerini tahmin ederek yargıda bulunabilme","oa":["a) Olayların oluş sürelerini birbirleriyle ilişkilendirir.","b) Olayların oluş sürelerine ilişkin deneyimlerinden faydalanarak çıkarım yapar.","c) Olayların oluş sürelerine ilişkin yapılan çıkarımla gerçekte olan sürelerine ilişkin yargıda bulunur."]},{"kod":"MAT.3.1.15","ad":"Uzunluk ve kütle birimleri arasındaki ilişkileri kullanarak bu birimleri kendi içerisinde çözümleyebilme","oa":["a) Standart kütle ve uzunluk birimlerine ilişkin parçaları belirler.","b) Santimetre, metre, kilometre ve gram, kilogram ve ton arasındaki ilişkileri kendi içerisinde belirler."]},{"kod":"MAT.3.1.16","ad":"Madenî ve kâğıt paraları değerlerine göre ilişkilendirerek yorumlayabilme","oa":["a) Paraları değerlerine göre inceler.","b) Madenî paraları ve kâğıt paraları değerlerine göre dönüştürür.","c) Paranın değerini, anlamını değiştirmeyecek şekilde yeniden ifade eder."]}],"id":"tymm-matematik-3-u1"},{"ad":"İşlemlerden Cebirsel Düşünmeye","kdalar":[{"kod":"MAT.3.2.1","ad":"Toplama ve çıkarma işlemlerinin sonuçlarını tahminde bulunarak ve zihinden işlem yaparak muhakeme edebilme","oa":["a) Toplama ve çıkarma işlemlerine ilişkin ögeleri belirler.","b) Toplama ve çıkarma işlemlerine ilişkin ögeler arasındaki ilişkileri belirler.","c) Toplama ve çıkarma işlemine yönelik tahminî ve zihinden işlem sonuçları arasında ilişki kurar.","ç) Tahminî ve zihinden işlem sonuçlarının tutarlılığını ifade eder."]},{"kod":"MAT.3.2.2","ad":"Toplama ve çıkarma işlemlerini çözümleyebilme","oa":["a) Toplama ve çıkarma işlemlerinin adımlarını belirler.","b) Toplama ve çıkarmanın işlem süreçlerini birbiri ile ilişkilendirir."]},{"kod":"MAT.3.2.3","ad":"Çarpma ve bölme işlemlerinin sonuçlarını tahminde bulunarak ve zihinden işlem yaparak muhakeme edebilme","oa":["a) Çarpma ve bölme işlemlerine ilişkin bileşenleri belirler.","b) Çarpma ve bölme işlemlerine ilişkin bileşenler arasındaki ilişkileri belirler.","c) Çarpma ve bölme işlemine yönelik tahminî ve zihinden işlem sonuçlarını ifade eder.","ç) Tahminî ve zihinden işlem sonuçlarını kendi cümleleri ile açıklar."]},{"kod":"MAT.3.2.4","ad":"Çarpma ve bölme işlemlerini çözümleyebilme","oa":["a) Çarpma ve bölme işlemlerinin adımlarını belirler.","b) Çarpma ve bölme işlemlerini birbiri ile ilişkilendirir."]},{"kod":"MAT.3.2.5","ad":"Dört işlem gerektiren durumlar için verilen yönergeleri takip ederek yorumlayabilme","oa":["a) Dört işleme ait bileşenleri inceler.","b) İncelediği bileşenleri işlem diline dönüştürür.","c) Oluşturduğu yapıyı temsillerle yeniden ifade eder."]},{"kod":"MAT.3.2.6","ad":"Dört işlem gerektiren günlük yaşam problemlerini çözebilme","oa":["a) Problemi anlayarak verilenleri ve istenilenleri belirler.","b) Problemde verilenlerin ve istenilenlerin gerektirdiği işlemler arasındaki ilişkiyi belirler.","c) Probleme ilişkin verilenleri belirleyerek uygun matematiksel temsillere dönüştürür.","ç) Matematiksel temsillere dönüştürdüğü problemi kendi ifadeleri ile açıklar.","d) Problemlerin sonucuna ilişkin tahminde bulunarak işlemleri gerçekleştirmek için stratejiler geliştirir.","e) Belirlenen strateji ya da stratejileri çözüm için uygular.","f) Çözüm yollarını kontrol ederek çözüme ulaştırmayan stratejiyi değiştirir.","g) Problemin çözümü için kullandığı veya geliştirdiği stratejileri gözden geçirerek kısa yolları değerlendirir.","ğ) Çözüme ulaştıran stratejilerin hangi problemlere uygulanabileceğini geneller.","h) Genellemenin geçerliliğini matematiksel örneklerle değerlendirir."]},{"kod":"MAT.3.2.7","ad":"Dört işlem gerektiren problem durumlarını yapılandırabilme","oa":["a) Dört işlem gerektiren problem durumlarına yönelik hiyerarşik, nedensel ya da mantıksal ilişkiler ortaya koyar.","b) Dört işlem yapmayı gerektiren deneyimleriyle elde ettiği ilişkilere dayalı bir problem oluşturur."]},{"kod":"MAT.3.2.8","ad":"Dört işlem bağlamında eşitliğin farklı anlamlarını yorumlayabilme","oa":["a) Dört işlemde eşitliğin kullanımını inceler.","b) Aynı sonucu veren dört işlemi eşitliğin anlamını kullanarak farklı sayılarla ifade eder.","c) Eşitliğin anlamlarını dört işlem bağlamında ifade eder."]}],"id":"tymm-matematik-3-u2"},{"ad":"Nesnelerin Geometrisi","kdalar":[{"kod":"MAT.3.3.1","ad":"Geometrik cisimlerin özelliklerini yorumlayabilme","oa":["a) Geometrik cisimlerin özelliklerini inceler.","b) Geometrik cisimlerin köşe, yüz ve ayrıt özelliklerini ifade eder.","c) Köşe, yüz ve ayrıt terimlerini kendi ifadeleri ile açıklar."]},{"kod":"MAT.3.3.2","ad":"Kenar sayılarına göre geometrik şekilleri sınıflandırabilme","oa":["a) Geometrik şekillerin kenarlarını belirler.","b) Geometrik şekilleri kenar sayılarına göre ayırır.","c) Geometrik şekilleri kenar sayılarına göre tasnif eder.","ç) Geometrik şekilleri kenar sayılarına göre adlandırır."]},{"kod":"MAT.3.3.3","ad":"Matematiksel araç ve teknolojileri kullanarak çeşitli geometrik şekilleri ve cisimleri çizebilme","oa":["a) Geometrik şekil ve cisim çizmeyi gerektiren matematiksel araç ve teknolojileri tanır.","b) Geometrik şekil ve cisim çizmek için gerekli araçları ve teknolojiyi belirler.","c) Belirlenen araç ve teknolojiyi kullanır."]},{"kod":"MAT.3.3.4","ad":"Standart olmayan ve standart ölçme araçları ile geometrik şekillerin çevre uzunluğunu tahmin edebilme","oa":["a) Standart olmayan ve standart uzunluk ölçme araçlarına ilişkin deneyimini, tahmine konu olan şeklin çevre uzunluğu ile ilişkilendirir.","b) Belirlenen standart olmayan ve standart uzunluk ölçme aracına göre çevre uzunluğuna ilişkin tahminde bulunur.","c) Tahminini ölçüm sonuçlarıyla karşılaştırarak tahminine ilişkin yargıda bulunur."]},{"kod":"MAT.3.3.5","ad":"Standart sıvı ölçü birimleri cinsinden sıvı miktarını tahmin edebilme","oa":["a) Standart sıvı ölçü birimlerine ilişkin deneyimini tahmine konu olan sıvı miktarı ile ilişkilendirir.","b) Belirlenen standart sıvı ölçü birimi cinsinden sıvının miktarına ilişkin tahminde bulunur.","c) Tahminini ölçüm sonuçlarıyla karşılaştırarak tahminine ilişkin yargıda bulunur."]},{"kod":"MAT.3.3.6","ad":"Birden fazla simetri doğrusu olan şekilleri çözümleyebilme","oa":["a) Kare, dikdörtgen ve dairenin birden fazla simetri doğrusu olduğunu belirler.","b) Simetri doğrusuna göre oluşan parçaların birbirine eş olduğunu belirler."]},{"kod":"MAT.3.3.7","ad":"Bir parçası verilen simetrik şekli simetri doğrusuna göre yapılandırabilme","oa":["a) Bir parçası verilen simetrik şekli inceleyerek mantıksal ilişkiler ortaya koyar.","b) Bir parçası verilen simetrik şekli yatay ve dikey simetri doğrusuna göre tamamlar."]},{"kod":"MAT.3.3.8","ad":"Yönerge ile yapılandırılan ve bir parçası verilen bir şekli tamamlayarak simetrisini oluşturmaya ilişkin kodlama stratejilerini kullanarak yargıda bulunabilme","oa":["a) Bir parçası verilen şekli tamamlayarak simetrisini oluşturmaya ilişkin yönergeleri yeniden ifade eder.","b) Yönergeleri takip ederek bir parçası verilen şekli tamamlayarak simetrisini oluşturur.","c) Bir şeklin simetrisini oluşturmaya ilişkin yargıda bulunur."]}],"id":"tymm-matematik-3-u3"},{"ad":"Veriye Dayalı Araştırma","kdalar":[{"kod":"MAT.3.4.1","ad":"Kategorik ve sayma ile elde edilen nicel veriye dayalı tek veri grubu ile çalışabilme ve veriye dayalı karar verebilme","oa":["a) Kategorik ve nicel veriye dayalı istatistiksel araştırma gerektiren günlük yaşam durumları belirler.","b) Kategorik ve nicel veriye dayalı betimleme gerektirebilecek araştırma soruları oluşturur.","c) Kategorik ve nicel verileri toplamak için plan yapar.","ç) Kategorik verileri toplar ve analize hazırlar.","d) Toplanan verileri analiz etmek için görselleştirme araçlarından çetele, sıklık tablosu veya nokta grafiğini seçer.","e) Seçtiği araçlarla verileri görselleştirerek analiz eder.","f) Araştırma sonuçlarını yorumlar.","g) Araştırma sonuçlarını araştırma sorularına göre değerlendirir."]}],"id":"tymm-matematik-3-u4"}],"id":"tymm-matematik-3"},{"ad":"Matematik","sinif":"4. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Sayılar ve Nicelikler","kdalar":[{"kod":"MAT.4.1.1","ad":"Niceliklerin büyüklükleri için en fazla altı basamaklı olan sayıların temsillerinden yararlanabilme","oa":["a) Niceliklerin büyüklüklerinin temsillerini tanır.","b) Niceliklerin büyüklüklerine uygun sayı temsillerini belirler.","c) Niceliklerin büyüklüklerine karşılık gelen uygun sayıları okur ve yazar."]},{"kod":"MAT.4.1.2","ad":"En fazla altı basamaklı sayıları çözümleyebilme","oa":["a) En fazla altı basamaklı sayıların basamaklarını ve bölüklerini belirler.","b) En fazla altı basamaklı sayıların basamak, bölük ile basamak ve sayı değerleri arasındaki ilişkileri belirler."]},{"kod":"MAT.4.1.3","ad":"Sayıları sıralayabilme","oa":["a) En fazla altı basamaklı sayıları öncelik/sonralık ilişkisine göre sembol kullanarak belirler.","b) En fazla altı basamaklı sayıları onluklara, yüzlüklere ve binliklere göre basamaklarına ayırır.","c) En fazla dört basamaklı sayıları en yakın onluğa, yüzlüğe ve binliğe göre yuvarlayarak tasnif eder.","ç) Tasnif edilen sayı gruplarını birler ve binler bölüğü şeklinde ifade eder."]},{"kod":"MAT.4.1.4","ad":"İleriye ve geriye doğru ritmik saymayı yapılandırabilme","oa":["a) Sayıları ileriye ve geriye doğru ritmik sayarken hiyerarşik ilişkiler ortaya koyar.","b) Ritmik saymaya ilişkin öz bilgisine dayanarak yüzer ve biner ileriye ve geriye doğru hedeflenen sayıya ulaşır."]},{"kod":"MAT.4.1.5","ad":"Artan azalan sayı örüntüleri ve şekil örüntülerindeki değişimi genelleyebilme","oa":["a) Verilen örüntünün adımı ve örüntüde kullanılan sayılar ya da şekiller arasındaki ilişkiye yönelik bilgi toplar.","b) Verilen örüntüde kullanılan sayıların ya da şekillerin ortak olan özelliklerini belirler.","c) Verilen örüntüde kullanılan sayıların ya da şekillerin ortak olmayan özelliklerini belirler.","ç) Karşılaştırılan sayı ve şekil örüntülerindeki artma, azalma ve tekrar etme durumlarını sözlü olarak ifade eder."]},{"kod":"MAT.4.1.6","ad":"Basit, bileşik ve tam sayılı kesirleri kullanmak için matematiksel temsillerden yararlanabilme","oa":["a) Basit, bileşik ve tam sayılı kesirlerin temsillerini tanır.","b) Günlük yaşam durumuna uygun basit, bileşik ve tam sayılı kesir temsillerini belirler.","c) Belirlediği basit, bileşik ve tam sayılı kesirlerin temsillerini kullanır."]},{"kod":"MAT.4.1.7","ad":"Denk kesirleri kullanmak için matematiksel temsillerden yararlanabilme","oa":["a) Denk kesirlerin temsillerini tanır.","b) Denk kesirlere uygun temsilleri belirler.","c) Belirlediği denk kesirlerin temsillerini kullanır."]},{"kod":"MAT.4.1.8","ad":"Birim kesirlerin büyüklük küçüklük ilişkilerini çözümleyebilme","oa":["a) Birim kesirleri büyüklük küçüklük bağlamında ifade eder.","b) Birim kesirler arasındaki büyüklük küçüklük ilişkisini belirler."]},{"kod":"MAT.4.1.9","ad":"Paydaları eşit olan kesirlerin büyüklük küçüklük ilişkilerini çözümleyebilme","oa":["a) Paydaları eşit kesirleri büyüklük küçüklük bağlamında ifade eder.","b) Paydaları eşit kesirler arasındaki büyüklük küçüklük ilişkisini belirler."]},{"kod":"MAT.4.1.10","ad":"Bir çokluğun basit kesir kadarını ve bir basit kesir kadarı verilen çokluğun tamamını çözümleyebilme","oa":["a) Bir çokluğu oluşturan eş parçaları ve eş parçaları verilen bir çokluğu kesire uygun olacak şekilde belirler.","b) Çokluk ile eş parçalar ve eş parçalar ile çokluk arasındaki ilişkiyi belirler."]},{"kod":"MAT.4.1.11","ad":"Paydaları eşit kesirlerle toplama ve çıkarma işlemini yapılandırabilme","oa":["a) Paydaları eşit kesirlerle toplama ve çıkarma işleminde mantıksal ilişkileri ortaya koyar.","b) Paydaları eşit kesirlerle toplama ve çıkarma işleminde kendi öz bilgisi ile elde ettiği ilişkilere dayalı bir bütün oluşturur."]},{"kod":"MAT.4.1.12","ad":"Paydaları eşit kesirlerle toplama ve çıkarma işlemi gerektiren günlük yaşam problemlerine çözüm geliştirebilme","oa":["a) Problemin çözümü için uygun stratejiyi oluşturur.","b) Problemi çözmek için uygun stratejiyi kullanır.","c) Problemin çözümünü kontrol eder."]},{"kod":"MAT.4.1.13","ad":"Uzunluk ve kütle birimlerinin kendi içerisindeki dönüşümlerini yorumlayabilme","oa":["a) Uzunluk ve kütle birimlerinin kendi içindeki ilişkileri inceler.","b) Uzunluk ve kütle birimlerini kendi içinde birbirine dönüştürür.","c) Uzunluk ve kütle birimlerini kendi içinde farklı birim cinsinden yeniden ifade eder."]}],"id":"tymm-matematik-4-u1"},{"ad":"İşlemlerden Cebirsel Düşünmeye","kdalar":[{"kod":"MAT.4.2.1","ad":"Toplama ve çıkarma işlemlerini zihinden yaparak çözümleyebilme","oa":["a) Zihinden toplama ve çıkarma işlemlerinde sayıların uygun bir biçimde parçalarını belirler.","b) Sayıların parçalarına ait özellikleri ilişkilendirir."]},{"kod":"MAT.4.2.2","ad":"En çok dört basamaklı sayılarla toplama ve çıkarma işlemlerini yapılandırabilme","oa":["a) Toplama ve çıkarma işlemlerinin algoritmasına yönelik hiyerarşik, nedensel ya da mantıksal ilişkiler ortaya koyar.","b) Toplama ve çıkarma işlemlerinin algoritmasına yönelik kendi öz bilgisi ile elde ettiği ilişkilere dayalı bir bütün oluşturur."]},{"kod":"MAT.4.2.3","ad":"Çarpma ve bölme işlemlerinin sonucunu tahmin edebilme","oa":["a) Çarpma ve bölme işlemlerinin sonucunu deneyimleri ile ilişkilendirir.","b) Çarpma ve bölme işlemlerinin sonucuna ilişkin çıkarım yapar.","c) Çarpma ve bölme işlemlerinin sonucuna ilişkin yargıda bulunur."]},{"kod":"MAT.4.2.4","ad":"Zihinden çözümlenen çarpma ve bölme işlemleri ile bu işlemlerin kısa yollarını yapılandırabilme","oa":["a) Zihinden çözümlenen çarpma ve bölme işlemlerinin algoritmasına yönelik hiyerarşik, nedensel ya da mantıksal ilişkiler ortaya koyar.","b) Zihinden çözümlenen çarpma ve bölme işlemlerinin algoritmasına yönelik kendi öz bilgisi ile elde ettiği ilişkilere dayalı bir bütün oluşturur."]},{"kod":"MAT.4.2.5","ad":"Çarpma ve bölme işlemlerini çözümleyebilme","oa":["a) Çarpma ve bölme işlemlerini fark eder.","b) Çarpma ve bölme işlemlerini birbiri ile ilişkilendirir."]},{"kod":"MAT.4.2.6","ad":"Dört işlem içeren yönergeler oluşturarak süreci yorumlayabilme","oa":["a) Dört işlem içeren durumları inceler.","b) İncelediği durumları yönergelere dönüştürür.","c) Oluşturduğu yönergeyi yeniden ifade eder."]},{"kod":"MAT.4.2.7","ad":"Dört işlem gerektiren problemleri çözebilme","oa":["a) Problemi anlayarak verilenleri ve istenilenleri belirler.","b) Problemde verilenlerin ve istenilenlerin gerektirdiği işlemler arasındaki ilişkiyi belirler.","c) Probleme ilişkin verilenleri belirleyerek uygun matematiksel temsillere dönüştürür.","ç) Matematiksel temsillere dönüştürdüğü problemi kendi ifadeleri ile açıklar.","d) Problemlerin sonucuna ilişkin tahminde bulunarak işlemleri gerçekleştirmek için stratejiler geliştirir.","e) Belirlenen strateji ya da stratejileri çözüm için uygular.","f) Çözüm yollarını kontrol ederek çözüme ulaştırmayan stratejiyi değiştirir.","g) Problemin çözümü için kullandığı veya geliştirdiği stratejileri gözden geçirerek kısa yolları değerlendirir.","ğ) Çözüme ulaştıran stratejilerin hangi problemlere uygulanabileceğini geneller.","h) Genellemenin geçerliliğini matematiksel örneklerle değerlendirir."]},{"kod":"MAT.4.2.8","ad":"Dört işlem gerektiren problem durumlarını yapılandırabilme","oa":["a) Dört işlem gerektiren problem durumlarına yönelik hiyerarşik, nedensel ya da mantıksal ilişkiler ortaya koyar.","b) Dört işlem gerektiren problemleri kendi öz bilgisi ile elde ettiği ilişkilere dayalı olarak oluşturur."]},{"kod":"MAT.4.2.9","ad":"Dört işlem bağlamında eşitliğin farklı anlamlarını yorumlayabilme","oa":["a) Dört işlem bağlamında eşitlik kavramını inceler.","b) Günlük yaşam durumlarını dört işleme dönüştürür.","c) Dört işlem içeren günlük yaşam durumunu eşitlik kavramı bağlamında ifade eder."]}],"id":"tymm-matematik-4-u2"},{"ad":"Nesnelerin Geometrisi","kdalar":[{"kod":"MAT.4.3.1","ad":"Geometrik cisimlerin açınımlarını yapılandırabilme","oa":["a) Geometrik cisimlerin açınımlarını inceleyerek yüzler arasında mantıksal ilişkiler ortaya koyar.","b) Ortaya koyduğu ilişkilerden yola çıkarak geometrik cismi oluşturur."]},{"kod":"MAT.4.3.2","ad":"Geometrik şekilleri kenar ve köşelerine göre yorumlayabilme","oa":["a) Üçgen, kare ve dikdörtgenin kenar ve köşelerini belirler.","b) Üçgen, kare ve dikdörtgenin kenar ve köşeleri arasında ilişki kurar.","c) Kenarlarına göre üçgen çeşitlerini ve kare ile dikdörtgen ilişkisini ifade eder."]},{"kod":"MAT.4.3.3","ad":"Geometrik şekillerin çevre uzunluğunu ölçmede matematiksel araç ve teknolojiden yararlanabilme","oa":["a) Geometrik şekillerin çevre uzunluğunu ölçmede kullanılabilecek matematiksel araç ve teknolojiyi tanır.","b) Üçgen, kare ve dikdörtgenin çevre uzunluğunu ölçmede kullanılabilecek matematiksel araç ve teknolojiyi belirler.","c) Üçgen, kare ve dikdörtgenin çevre uzunluğunu ölçmek için ilgili matematiksel araç ve teknolojiyi kullanır."]},{"kod":"MAT.4.3.4","ad":"Standart olmayan ölçü birimleri cinsinden şekillerin alanlarını tahmin edebilme","oa":["a) Standart olmayan ölçü birimlerine ilişkin deneyimini, tahmine konu olan şeklin alanıyla ilişkilendirir.","b) Belirlenen standart olmayan ölçü birimini kullanarak şeklin alanına ilişkin tahminde bulunur.","c) Tahminini ölçüm sonuçlarıyla karşılaştırarak tahminine ilişkin yargıda bulunur."]},{"kod":"MAT.4.3.5","ad":"Günlük yaşamdan örneklerle açıyı bir dönme miktarı olarak yorumlayabilme","oa":["a) Günlük hayattan örneklerle açıyı belirler.","b) Açıları bağlamından koparmadan günlük yaşam durumlarına dönüştürür.","c) Açıyı bir dönme miktarı olarak yeniden ifade eder."]},{"kod":"MAT.4.3.6","ad":"Açı ölçümüne ilişkin standart ölçme araçlarının gerekliliğini değerlendirebilme","oa":["a) Açı ölçümü için bir ölçüt belirler.","b) Ölçüte uygun olarak standart olmayan ölçü birimlerini kullanarak ölçme yapar.","c) Standart olmayan ölçü birimlerine dayalı olarak elde ettiği sonuçları ölçüt ile karşılaştırır.","ç) Karşılaştırmalarına ilişkin olarak standart ölçme araçlarının gerekliliğine ilişkin yargıda bulunur."]},{"kod":"MAT.4.3.7","ad":"Dik açıyı referans alarak açıları dar ve geniş olarak sınıflandırabilme","oa":["a) Dik açının özelliklerini belirler.","b) Dik açıyı referans alarak açı çeşitlerini dar ve geniş açı olarak ayırır.","c) Dar ve geniş açının özelliklerini tasnif eder.","ç) Dar ve geniş açıyı adlandırır."]},{"kod":"MAT.4.3.8","ad":"Geometrik nesneler ve şekiller üzerinden doğruya göre simetriyi yorumlayabilme","oa":["a) Geometrik şekiller ve modeller üzerinden aynaya göre simetrinin özelliklerini inceler.","b) Aynaya göre simetri ile doğruya göre simetri arasındaki ilişkiyi fark eder.","c) Aynaya göre simetriyi, anlamını değiştirmeden kendi ifadeleriyle doğruya göre simetri olarak yeniden ifade eder."]},{"kod":"MAT.4.3.9","ad":"Bir şeklin doğruya göre simetrisini yapılandırabilme","oa":["a) Simetri doğrusunun özelliklerini inceleyerek doğruya göre simetriye ilişkin mantıksal ilişkiler ortaya koyar.","b) Ortaya koyduğu ilişkilerden yola çıkarak şeklin doğruya göre simetrisini oluşturur."]},{"kod":"MAT.4.3.10","ad":"Geometrik şekillere dayalı bir yapı oluşturabilmek için kodlama stratejilerini yapılandırabilme","oa":["a) Geometrik şekil ve yapı bilgisi arasında mantıksal ilişkiler ortaya koyar.","b) Ortaya koyduğu ilişkilerden yola çıkarak kodlama stratejisi oluşturur."]}],"id":"tymm-matematik-4-u3"},{"ad":"Olayların Olasılığı ve Veriye Dayalı Araştırma","kdalar":[{"kod":"MAT.4.4.1","ad":"Günlük yaşamdan herhangi bir olayın olasılığını “imkânsız, olabilir, kesin” olarak belirleyebilme","oa":[]},{"kod":"MAT.4.4.2","ad":"Kategorik veriye ve sayma ile elde edilen nicel veriye dayalı en çok iki veri grubu ile çalışabilme ve veriye dayalı karar verebilme","oa":["a) Kategorik ve nicel veriye dayalı istatistiksel araştırma gerektiren günlük yaşam ile ilgili bir problem belirler.","b) Kategorik ve nicel veriye dayalı betimleme veya karşılaştırma gerektirebilecek araştırma soruları oluşturur.","c) Kategorik ve nicel verileri toplamak için plan yapar.","ç) Kategorik verileri toplar ve analize hazırlar.","d) Toplanan verileri analiz etmek için uygun görselleştirme araçlarını (çetele ve sıklık tablosu ile nesne, şekil ve nokta grafiği) seçer.","e) Seçtiği araçlarla verileri görselleştirerek analiz eder.","f) Araştırma sonuçlarını yorumlar.","g) Araştırma sonuçlarını araştırma sorularına göre değerlendirir."]}],"id":"tymm-matematik-4-u4"}],"id":"tymm-matematik-4"},{"ad":"Hayat Bilgisi","sinif":"1. sınıf","program":"Maarif Modeli","kademe":"İlkokul","udalar":[{"ad":"Ben ve Okulum","kdalar":[{"kod":"HB.1.1.1","ad":"Öğretmeni ve arkadaşlarıyla tanışabilme","oa":[]},{"kod":"HB.1.1.2","ad":"Sınıf ve okul ortamını tanıyabilme","oa":[]},{"kod":"HB.1.1.3","ad":"Sınıf ve okul ortamında kurallara uygun davranabilme","oa":[]},{"kod":"HB.1.1.4","ad":"Bireysel özelliklerini açıklayabilme","oa":[]}],"id":"tymm-hayat-bilgisi-1-u1"},{"ad":"Sağlığım ve Güvenliğim","kdalar":[{"kod":"HB.1.2.1","ad":"Sağlıklı büyüme ve gelişme için yapılması gerekenleri belirleyebilme","oa":[]},{"kod":"HB.1.2.2","ad":"Kişisel alan sınırlarını koruyabilme","oa":[]},{"kod":"HB.1.2.3","ad":"Temel trafik kurallarına uygun davranabil
